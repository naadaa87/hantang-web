<style>

.btn:hover{background:var(--blue-deep)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn:disabled{opacity:.5;cursor:wait}

.top nav.anav{display:flex;gap:6px;flex-wrap:wrap}
.top nav.anav a{font-size:14px;font-weight:700;padding:7px 12px;border-radius:99px;color:var(--ink);text-decoration:none}

@media (max-width:640px){.top{position:static}.top .wrap{flex-wrap:wrap;gap:8px;padding-block:12px 10px}.top nav.anav{flex-wrap:nowrap;overflow-x:auto;width:100%;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.top nav.anav::-webkit-scrollbar{display:none}.top nav.anav a{white-space:nowrap;font-size:13.5px;padding:7px 11px}}

.k-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.k-seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
.k-seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink)}
.k-seg button.on{background:var(--ink);color:#fff}
.k-btn{font:inherit;font-size:13.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.k-btn:hover{border-color:var(--blue);color:var(--blue)}
.k-meta{font-size:12.5px;color:var(--mute);margin-left:auto}
.k-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.k-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px 16px 13px;min-width:0}
.k-card .l{font-size:13px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.k-card .v{font-family:var(--serif);font-size:29px;line-height:1.15;margin-top:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.k-card .d{font-size:12.5px;margin-top:4px;color:var(--mute)}
.k-card .d b.up{color:var(--ok)}.k-card .d b.dn{color:var(--red)}

.k-t td a{color:var(--ink);text-decoration:none}.k-t td a:hover{color:var(--blue);text-decoration:underline}
.k-t .sm{display:block;font-size:11.5px;color:var(--mute)}
.k-bar{display:inline-block;height:7px;border-radius:99px;background:var(--blue);vertical-align:middle;margin-right:6px;opacity:.75}

.k-utm input{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;width:100%;box-sizing:border-box}
.k-utm-out{margin-top:10px;font-family:var(--mono);font-size:12.5px;background:var(--stone);border-radius:10px;padding:10px 12px;word-break:break-all}
dl.k-def{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px;margin:0}
dl.k-def dt{font-weight:700}dl.k-def dd{margin:0;color:var(--mute)}
@media (max-width:1000px){.k-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.k-three{grid-template-columns:1fr 1fr}}

@media (max-width:760px){.k-two,.k-three{grid-template-columns:1fr}.k-utm{grid-template-columns:1fr 1fr}.k-meta{margin-left:0;width:100%}dl.k-def{grid-template-columns:1fr}.k-card .v{font-size:24px}}
</style>

<main class="wrap">

  <p class="k-sub">한탕이 직접 모으는 방문 통계(쿠키·IP 저장 없음, 날짜별 합계)와 회원·후기·업주 신청 숫자입니다. 날짜는 한국 시간 기준입니다.</p>

<script>
(function(){
  var API='../../api/admin/kpi?days=', days=28, J=null, pageMerge=true, placeSort='act';
  var out=document.getElementById('kOut'), meta=document.getElementById('kMeta');
  var LN={en:'영어',ja:'일본어','zh-Hant':'중국어(번체)','zh-Hans':'중국어(간체)',vi:'베트남어',th:'태국어',ru:'러시아어',ko:'한국어'};
  var DEV={mobile:'휴대폰',desktop:'PC',tablet:'태블릿'};
  var REG={seoul:'서울',busan:'부산',incheon:'인천',daegu:'대구',daejeon:'대전',ulsan:'울산',sejong:'세종',gyeonggi:'경기',gangwon:'강원',chungbuk:'충북',chungnam:'충남',jeonbuk:'전북','jeonnam-gwangju':'전남·광주',gyeongbuk:'경북',gyeongnam:'경남',jeju:'제주','hot-springs':'온천 지도',private:'1인·프라이빗',near:'관광지 주변'};
  var SRCG={google:'검색',naver:'검색',bing:'검색',yahoo:'검색','daum·kakao':'검색',duckduckgo:'검색',yandex:'검색',baidu:'검색',chatgpt:'AI 검색',perplexity:'AI 검색','ai-other':'AI 검색',instagram:'SNS',facebook:'SNS',x:'SNS',youtube:'SNS',reddit:'SNS',tiktok:'SNS',line:'SNS',threads:'SNS',pinterest:'SNS',xiaohongshu:'SNS',weibo:'SNS',vk:'SNS',tripadvisor:'여행 사이트','(direct)':'직접 방문','(internal)':'사이트 안'};
  var EVN={map:'지도 열기',route:'길찾기·택시 카드',save:'찜',review:'후기 창 열기',site:'시설 홈페이지',share:'공유',lang:'언어 바꾸기',out:'외부 링크',game:'게임으로 이동',partner:'업주 등록으로 이동',signup:'회원가입',login:'로그인',post:'게시글 작성',comment:'댓글 작성',review_post:'후기 작성',filter:'필터 사용',video:'영상 재생',photo:'사진 크게 보기'};
  var rn, ln; try{rn=new Intl.DisplayNames(['ko'],{type:'region'}); ln=new Intl.DisplayNames(['ko'],{type:'language'});}catch(e){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function n(x){return (Math.round(x||0)).toLocaleString('ko-KR')}
  function pct(a,b){return b?(a/b*100).toFixed(1)+'%':'–'}
  function dur(sec){sec=Math.round(sec||0); if(!sec) return '0초'; var m=Math.floor(sec/60), s=sec%60; return m?(m+'분 '+(s<10?'0':'')+s+'초'):(s+'초')}
  function flag(cc){ if(!/^[A-Z]{2}$/.test(cc)||cc==='XX') return '🌐'; return String.fromCodePoint(127397+cc.charCodeAt(0),127397+cc.charCodeAt(1)); }
  function country(cc){ if(cc==='XX') return '알 수 없음'; try{return rn?rn.of(cc):cc}catch(e){return cc} }
  function blang(c){ if(c==='xx') return '알 수 없음'; try{return ln?ln.of(c):c}catch(e){return c} }
  function delta(cur,prev){ if(!prev) return cur?'<span class="k-pill">새로 생김</span>':'<span>직전 기간 없음</span>'; var d=(cur-prev)/prev*100; return '<b class="'+(d>=0?'up':'dn')+'">'+(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(0)+'%</b> 직전 '+days+'일 대비'; }
  function sum(rows,k){ return rows.reduce(function(a,r){return a+(+r[k]||0)},0); }
  function strip(p){ return p.replace(/^\/(ja|zh-hant|zh-hans|vi|th|ru|ko)\//,'/'); }
  function langOf(p){ var m=p.match(/^\/(ja|zh-hant|zh-hans|vi|th|ru|ko)\//); return m?{ja:'ja','zh-hant':'zh-Hant','zh-hans':'zh-Hans',vi:'vi',th:'th',ru:'ru',ko:'ko'}[m[1]]:'en'; }
  function kind(p){ p=strip(p);
    if(p==='/') return '홈'; if(/^\/guide\/$/.test(p)) return '가이드 목록'; if(/^\/guide\//.test(p)) return '가이드'; if(/^\/journal\/$/.test(p)) return '저널 목록'; if(/^\/journal\//.test(p)) return '저널';
    if(/^\/baths\/p\//.test(p)) return '지점 상세'; if(/^\/baths\/hot-springs\//.test(p)) return '온천 지도'; if(/^\/baths\/(near|private)\//.test(p)) return '테마 목록'; if(/^\/baths\/[^/]+\//.test(p)) return '지역 목록'; if(/^\/baths\/$/.test(p)) return '목욕탕 찾기';
    if(/^\/board\/p\//.test(p)) return '게시글'; if(/^\/board\//.test(p)) return '게시판'; if(/^\/me\//.test(p)) return '마이페이지'; if(/^\/(terms|privacy)\//.test(p)) return '약관·방침';
    if(/^\/play\//.test(p)) return '게임'; if(/^\/partner\//.test(p)) return '업주 등록'; return '기타'; }
  function area(a){ a=(a||'').split(' ')[0]; var M={'서울특별시':'서울','부산광역시':'부산','인천광역시':'인천','대구광역시':'대구','대전광역시':'대전','울산광역시':'울산','광주광역시':'광주','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','강원도':'강원','충청북도':'충북','충청남도':'충남','전북특별자치도':'전북','전라북도':'전북','전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'}; return M[a]||a||'–'; }

  // 이 브라우저 제외
  function meLabel(){ var on=false; try{on=localStorage.getItem('hantang.noan')==='1'}catch(e){} document.getElementById('kMe').textContent=on?'✓ 이 브라우저 방문은 집계 안 함':'이 브라우저 방문 빼기'; }
  document.getElementById('kMe').addEventListener('click',function(){ try{ if(localStorage.getItem('hantang.noan')==='1') localStorage.removeItem('hantang.noan'); else localStorage.setItem('hantang.noan','1'); }catch(e){} meLabel(); });
  meLabel();

  function card(label,val,d,hint,hl){ return '<div class="k-card'+(hl?' hl':'')+'"><div class="l"><span>'+esc(label)+'</span>'+(hint?'<span title="'+esc(hint)+'">ⓘ</span>':'')+'</div><div class="v">'+val+'</div><div class="d">'+(d||'&nbsp;')+'</div></div>'; }
  function table(cols,rows,opt){ opt=opt||{}; if(!rows.length) return '<p class="k-empty">'+(opt.empty||'아직 자료가 없습니다.')+'</p>';
    var lim=opt.limit||rows.length, h='<div class="k-tw"><table class="k-t"><thead><tr>'+cols.map(function(c){return '<th class="'+(c.l?'l ':'')+(c.sort?'s':'')+(opt.sorted===c.sort&&c.sort?' on':'')+'"'+(c.sort?' data-sort="'+c.sort+'"':'')+'>'+c.h+(opt.sorted===c.sort&&c.sort?' ▾':'')+'</th>'}).join('')+'</tr></thead><tbody>';
    rows.slice(0,lim).forEach(function(r){ h+='<tr>'+cols.map(function(c){return '<td'+(c.l?' class="l"':'')+'>'+c.f(r)+'</td>'}).join('')+'</tr>'; });
    h+='</tbody></table></div>'; if(rows.length>lim) h+='<button class="k-btn k-more" data-more="'+(opt.id||'')+'">'+n(rows.length-lim)+'개 더 보기</button>'; return h; }
  function bar(v,max){ return '<span class="k-bar" style="width:'+Math.max(2,Math.round((v/(max||1))*80))+'px"></span>'; }

  function chart(cur){
    if(!cur.length) return '<p class="k-empty">아직 자료가 없습니다.</p>';
    var box=document.getElementById('kOut'), cw=box?box.clientWidth-38:1000, W=Math.max(320,Math.min(1000,Math.round(cw||1000))),H=W<600?220:240,P={l:40,r:10,t:12,b:28}, iw=W-P.l-P.r, ih=H-P.t-P.b, mx=Math.max.apply(null,cur.map(function(r){return +r.views||0}).concat([5]));
    var step=iw/cur.length, bw=Math.max(2,step*0.62), s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="일별 페이지뷰와 방문자">';
    for(var g=0;g<=4;g++){ var y=P.t+ih-ih*g/4; s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y+'" y2="'+y+'" stroke="#EEECE8"/><text x="'+(P.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#79746D">'+n(mx*g/4)+'</text>'; }
    var pts=[]; cur.forEach(function(r,i){ var x=P.l+step*i+step/2, h=ih*(+r.views||0)/mx, vy=P.t+ih-ih*(+r.visitors||0)/mx;
      s+='<rect x="'+(x-bw/2)+'" y="'+(P.t+ih-h)+'" width="'+bw+'" height="'+Math.max(h,0)+'" rx="2" fill="#BCD6E6"><title>'+r.day+' · 페이지뷰 '+n(r.views)+' · 방문자 '+n(r.visitors)+' · 방문 '+n(r.visits)+'</title></rect>'; pts.push(x+','+vy);
      var every=Math.ceil(cur.length/Math.max(4,Math.floor(W/95))); if(i%every===0||i===cur.length-1) s+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#79746D">'+r.day.slice(5).replace('-','.')+'</text>'; });
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#1E6E9C" stroke-width="2.4" stroke-linejoin="round"/>';
    pts.forEach(function(p){ var a=p.split(','); s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="'+(cur.length>60?1.5:3)+'" fill="#1E6E9C"/>'; });
    return s+'</svg><div class="k-leg"><span><i style="background:#BCD6E6"></i>페이지뷰</span><span><i style="background:#1E6E9C"></i>방문자</span></div>';
  }
  // 기간 안의 날짜를 빠짐없이 (자료 없는 날은 0)
  function fill(rows,start,end){ var m={}; rows.forEach(function(r){m[r.day]=r}); var o=[], d=new Date(start+'T00:00:00Z'), e=new Date(end+'T00:00:00Z');

      +'<dt>방문(세션)</dt><dd>다른 사이트·검색·SNS·주소창에서 한탕으로 들어온 횟수입니다. 사이트 안에서 페이지를 옮긴 것은 세지 않습니다.</dd>'
      +'<dt>참여 시간</dt><dd>페이지가 화면에 보이고, 마지막으로 스크롤·클릭·터치한 지 2분이 안 된 동안만 셉니다(페이지당 최대 30분). 창을 띄워 두기만 한 시간은 빠집니다.</dd>'
      +'<dt>끝까지</dt><dd>페이지의 75% 이상까지 내려 본 비율입니다.</dd>'
      +'<dt>국가</dt><dd>Cloudflare 가 접속 위치로 판단한 나라입니다. VPN 을 쓰면 다른 나라로 잡힐 수 있습니다.</dd>'
      +'<dt>지점 행동</dt><dd>지점 카드나 상세 페이지에서 지도(구글·네이버·카카오) 열기, 길찾기·택시 카드, 찜, 후기 창, 시설 홈페이지 링크를 누른 횟수입니다. 순위는 광고와 관계없이 이 숫자로만 정합니다.</dd>'
      +'<dt>빠지는 방문</dt><dd>추적 거부(Do Not Track·GPC)를 켠 브라우저, 검색 로봇, 관리자 화면, ‘이 브라우저 방문 빼기’를 누른 브라우저는 세지 않습니다. 그래서 Search Console·서치어드바이저 숫자와 다를 수 있습니다. 검색어별 노출·클릭은 그쪽에서 보세요.</dd>'
      +'</dl></div></div>';
    out.innerHTML=h;
    // 표 정렬·더 보기·체크박스·UTM
    out.querySelectorAll('[data-sort]').forEach(function(th){ th.addEventListener('click',function(){ placeSort=th.dataset.sort; var y=scrollY; render(); scrollTo(0,y); }); });
    out.querySelectorAll('[data-more]').forEach(function(b){ b.addEventListener('click',function(){ expanded[b.dataset.more]=1; var y=scrollY; render(); scrollTo(0,y); }); });
    var mg=document.getElementById('kMerge'); if(mg) mg.addEventListener('change',function(){ pageMerge=mg.checked; render(); });
    var U=['uUrl','uSrc','uMed','uCmp'].map(function(i){return document.getElementById(i)}), uo=document.getElementById('uOut');
    function mk(){ try{ var u=new URL(U[0].value.trim()||'https://hantang.kr/'); [['utm_source',U[1]],['utm_medium',U[2]],['utm_campaign',U[3]]].forEach(function(p){ var v=p[1].value.trim().toLowerCase().replace(/\s+/g,'_'); if(v) u.searchParams.set(p[0],v); else u.searchParams.delete(p[0]); }); uo.textContent=u.toString(); }catch(e){ uo.textContent='주소를 확인해 주세요.'; } }
    U.forEach(function(i){ i.addEventListener('input',mk) }); mk();
    document.getElementById('uCopy').addEventListener('click',function(){ var b=this, t=uo.textContent; if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){b.textContent='✓ 복사했습니다'},function(){}); });
  }
  // "더 보기": 그 표만 전체 행으로 다시 그린다
  var expanded={}, _table=table;
  table=function(cols,rows,opt){ opt=opt||{}; if(opt.id&&expanded[opt.id]) opt.limit=rows.length; return _table(cols,rows,opt); };

  function csv(rows,cols){ var s='﻿'+cols.join(',')+'\n'+rows.map(function(r){return cols.map(function(c){var v=r[c]==null?'':String(r[c]); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n'); return s; }
  function dl(name,text){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500); }
  document.getElementById('kCsv').addEventListener('click',function(){ if(!J) return; var R=J.range; dl('hantang-kpi-daily-'+R.start+'_'+R.end+'.csv', csv(fill((J.series||[]).filter(function(r){return r.day>=R.start}),R.start,R.end),['day','visitors','visits','views','ret','eng_sec','engaged','place_views'])); });
  document.getElementById('kCsvP').addEventListener('click',function(){ if(!J) return; var R=J.range; dl('hantang-kpi-places-'+R.start+'_'+R.end+'.csv', csv(J.places||[],['place','name','area','views','maps','route','saves','reviews','sites','url'])); });

  function load(){
    out.innerHTML='<p class="k-empty">불러오는 중…</p>'; expanded={};
    fetch(API+days,{credentials:'same-origin'}).then(function(r){return r.json().then(function(j){j.code=r.status;return j},function(){return {ok:false,code:r.status}})}).then(function(j){
      if(!j.ok){
        if(j.code===403) out.innerHTML='<div class="k-lock"><b>관리자 인증이 필요합니다.</b><p class="k-note" style="margin-top:6px">이 화면은 Cloudflare Zero Trust Access 로 로그인한 관리자만 볼 수 있습니다. ('+esc(j.why||'forbidden')+') README 의 ‘관리자 화면 잠그기’ 순서대로 Access 를 설정해 주세요.</p></div>';
        else if(j.code===503) out.innerHTML='<div class="k-lock"><b>통계 데이터베이스가 연결되지 않았습니다.</b><p class="k-note" style="margin-top:6px">Cloudflare → Workers &amp; Pages → hantang-web → Settings → Bindings 에서 D1 데이터베이스를 변수 이름 <b>HANTANG_DB</b> 로 연결한 뒤 다시 배포하면, 그때부터 방문 통계가 쌓입니다. (회원·후기 기능과 같은 데이터베이스입니다.)</p></div>';
        else out.innerHTML='<div class="k-lock"><b>불러오지 못했습니다.</b> ('+esc(j.error||j.code)+')</div>';
        meta.textContent=''; return; }
      J=j; render();
    }).catch(function(){ out.innerHTML='<div class="k-lock"><b>연결하지 못했습니다.</b> 잠시 뒤 다시 시도해 주세요.</div>'; });
  }
  document.getElementById('kDays').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)}); days=+b.dataset.d; load(); });
  var lw=innerWidth, rt=0; addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ if(J && Math.abs(innerWidth-lw)>60){ lw=innerWidth; var y=scrollY; render(); scrollTo(0,y); } },250); });
  load();
})();
