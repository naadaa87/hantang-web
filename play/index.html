<style>
/* 목욕탕 간판: 흰 법랑 패널 + 먹색 테두리 + 타일 블루 포인트, 도장 빨강은 보상에만 */
:root{
  --ink:#1B1A18; --ink2:#3A3835; --paper:#FFFFFF; --stone:#F6F5F2; --tint:#EAF2F7; --line:#D9D7D2; --grout:#DCE5EB;
  --blue:#1E6E9C; --blue-d:#12476A; --blue-l:#CFE6F3; --red:#C13A2A; --red-l:#F6D4CC; --brass:#B5822B; --gold:#E0B85A; --green:#1F9D57; --green-l:#DFF3E6;
  --px:Galmuri11,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --px14:Galmuri14,Galmuri11,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pxko:Galmuri14,Galmuri11,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs14:15px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutR:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
/* 언어별 글꼴: 한자·가나는 Fusion Pixel(12px 원형), 태국 문자는 HTThai.
   갈무리14에 없는 베트남어·키릴 문자와 12px 원형인 한자는 큰 글씨도 12px 로 또렷하게 */
html[data-lang="ja"]{--px:HTFusionJA,Galmuri11,"Hiragino Sans","Yu Gothic",sans-serif;--px14:var(--px);--fs14:12px}
html[data-lang="zh-Hant"]{--px:HTFusionTC,Galmuri11,"PingFang TC","Microsoft JhengHei",sans-serif;--px14:var(--px);--fs14:12px}
html[data-lang="zh-Hans"]{--px:HTFusionSC,Galmuri11,"PingFang SC","Microsoft YaHei",sans-serif;--px14:var(--px);--fs14:12px}
html[data-lang="vi"],html[data-lang="ru"]{--px14:Galmuri11,sans-serif;--fs14:12px}
html[data-lang="th"]{--px:Galmuri11,HTThai,"Thonburi","Leelawadee UI",sans-serif;--px14:Galmuri14,Galmuri11,HTThai,"Thonburi","Leelawadee UI",sans-serif}
html,body{height:100%;margin:0;background:var(--stone);color:var(--ink);overflow:hidden}
body{font-family:var(--px);font-size:12px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
img.pxi{image-rendering:pixelated;image-rendering:crisp-edges}
.notch{clip-path:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px))}

#app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:var(--gut);padding-right:var(--gutR);
  background-color:#F7F9FA;background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:24px 24px}
#stage{position:relative;flex:none;background:#DCE6EC;box-shadow:0 0 0 2px var(--ink),0 6px 0 2px rgba(27,26,24,.18)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#tx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* HUD: 작게, 가장자리에 붙이고, 캐릭터가 밑으로 오면 흐려지며 터치를 통과시킨다 */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .hud-l{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;transition:opacity .2s;max-width:46%}
.pchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border:2px solid var(--ink);padding:0 8px 0 0;cursor:pointer;pointer-events:auto;font:inherit;color:var(--ink);height:28px}
.pchip canvas{width:24px;height:24px;image-rendering:pixelated;background:var(--blue-l);border-right:2px solid var(--ink)}
.pchip .lv{color:var(--blue-d);font-variant-numeric:tabular-nums}
.xpb{display:block;width:52px;height:6px;border:1px solid var(--ink);background:var(--line)}
.xpb i{display:block;height:100%;background:#4FBF8F;width:0;transition:width .3s}
.pchip .sp{display:flex;align-items:center;gap:2px;color:var(--brass);font-variant-numeric:tabular-nums}
.pchip .sp img{width:12px;height:14px;image-rendering:pixelated}
.tracker{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.94);border:2px solid var(--ink);padding:3px 6px 4px;width:min(250px,100%);line-height:1.35}
.tracker .tk-h{display:flex;gap:5px;align-items:center}
.tk-k{background:var(--blue);color:#fff;padding:0 4px;white-space:nowrap;flex:none}
.tk-k.side{background:var(--brass)} .tk-k.daily{background:var(--green)}
.tk-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue-d)}
.tk-c{color:#6E6B66;font-variant-numeric:tabular-nums;flex:none}
.tk-min{border:0;background:none;cursor:pointer;padding:0 0 0 4px;color:var(--ink2);font:inherit;flex:none;min-width:16px}
.tk-s{margin-top:1px} .tk-s b{font-weight:normal;color:var(--red);font-variant-numeric:tabular-nums}
.tracker.min .tk-s{display:none}
.buffs{display:flex;gap:3px;flex-wrap:wrap}
.bf{background:var(--green);color:#fff;border:2px solid var(--ink);padding:0 5px}
.heatbar{width:150px;height:10px;border:2px solid var(--ink);background:#3A3835}
.heatbar i{display:block;height:100%;background:linear-gradient(90deg,#F0913A,var(--red));width:0}
#hud .hud-r{position:absolute;right:6px;top:6px;display:flex;gap:3px;pointer-events:auto;transition:opacity .2s}
#hud .fade{opacity:.22}
#hud .fade,#hud .fade *{pointer-events:none!important}
.ib{position:relative;width:32px;height:32px;padding:0;border:2px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(27,26,24,.12)}
.ib img{width:22px;height:22px;image-rendering:pixelated}

.ib:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
.ib .dot{position:absolute;right:-4px;top:-4px;width:10px;height:10px;background:var(--red);border:2px solid var(--ink)}
#hud .hud-b{position:absolute;left:6px;bottom:6px;right:6px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.emobar{display:flex;gap:3px;pointer-events:auto}
.emobar .ib{width:30px;height:30px}
.emobar .ib img{width:22px;height:20px}
.net{background:rgba(255,255,255,.92);border:2px solid var(--ink);padding:1px 7px;color:var(--ink2)}
.net.on{color:var(--green)}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--paper);border:2px solid var(--ink);padding:10px 22px;text-align:center;box-shadow:0 4px 0 var(--ink);max-width:80%;pointer-events:none}
.banner .k{display:block;font-size:24px;line-height:1.2;color:var(--blue-d)}
.banner .e{display:block;color:var(--ink2)}
.lvup{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:12;background:var(--paper);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 22px 12px;text-align:center;cursor:pointer;max-width:90%}
.lvup.pop{animation:lvpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes lvpop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.lv-k{font-size:24px;line-height:1.2;color:var(--green);letter-spacing:.08em}
.lv-n{font-family:var(--pxko);font-size:15px;color:var(--blue-d)}
.lv-g{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px;color:var(--brass)}
.flash{position:absolute;inset:0;background:#FFFFFF;pointer-events:none;z-index:13;opacity:0}
.flash.go{animation:flash .4s ease-out}
@keyframes flash{from{opacity:.95}to{opacity:0}}

/* 모바일 조작 */
#touch{display:none}
html.touch #touch{display:block}
#touch{position:absolute;left:0;right:0;bottom:0;pointer-events:none;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
#joy{position:absolute;left:calc(var(--gut) + 6px);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:108px;height:108px;border-radius:50%;background:rgba(27,26,24,.14);border:2px solid rgba(27,26,24,.35);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--ink)}
.tbtns{position:absolute;right:calc(var(--gutR) + 6px);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,56px);grid-template-rows:44px 60px;gap:8px;pointer-events:auto}
.tb{border:2px solid var(--ink);background:rgba(255,255,255,.92);font-size:12px;touch-action:none;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(27,26,24,.15);padding:0;display:grid;place-items:center}
.tb img{width:24px;height:24px;image-rendering:pixelated;pointer-events:none}
.tbtns .tb.D,.tbtns .tb.C{border-radius:10px}
.tb.A{background:var(--green);color:#fff;grid-column:2;grid-row:2}
.tb.B{background:var(--blue);color:#fff;grid-column:1;grid-row:2}
.tb.C{grid-column:2;grid-row:1}
.tb.D{grid-column:1;grid-row:1}
.tb.on{filter:brightness(.85);transform:translateY(1px)}
.tb.A.ready{box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
html.touch.portrait #app{justify-content:flex-start;padding-top:12px}
html.touch.portrait #touch{position:absolute;height:40%}
html.mgmode #touch{display:none!important}
html.mg #hud{display:none!important}
html.mg #banner,html.mg #lvup{display:none!important}
html.touch #hud .hud-b{display:none}
html.touch.portrait #hud{inset:auto;left:0;right:0;top:calc(100% + 8px);display:flex;flex-direction:column;gap:6px}
html.touch.portrait #hud .hud-l,html.touch.portrait #hud .hud-r,html.touch.portrait #hud .hud-b{position:static;max-width:none}
html.touch.portrait #hud .hud-l{flex-direction:row;flex-wrap:wrap;align-items:center}
html.touch.portrait #hud .hud-r{flex-wrap:wrap}
html.touch.portrait #hud .hud-b{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;align-items:center}
html.touch.portrait #hud .hud-b .emobar{display:none}
html.touch.portrait #hud .hud-b::after{content:attr(data-rotate);color:#6E6B66;flex-basis:100%}
html.portrait .banner{padding:6px 12px}
html.portrait .banner .k{font-size:15px}

/* 미니게임 터치패드 */
#mgpad{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;padding-left:var(--gut);padding-right:var(--gutR);pointer-events:none}
#mgpad .grp{display:flex;gap:8px;pointer-events:auto}
#mgpad .tb{width:62px;height:62px;border-radius:8px;font-size:var(--fs14);font-family:var(--px14)}

/* 패널 */
.sheet{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px var(--gutR) 12px var(--gut);background:rgba(27,26,24,.45);z-index:20}
.card{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink)}

.chead{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--blue);color:#fff;border-bottom:2px solid var(--ink)}

.chead .x{width:28px;height:28px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;color:var(--ink)}

.tabs{flex:none;display:flex;gap:4px;padding:8px 10px 0;border-bottom:2px solid var(--ink);background:var(--tint);overflow-x:auto}

.btn{border:2px solid var(--ink);background:var(--paper);padding:7px 14px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(27,26,24,.12);white-space:nowrap}

.btn.big{font-size:24px;padding:10px 26px;font-family:var(--px)}
.btn:disabled{opacity:.45;cursor:default}

.btn:focus-visible,.tab:focus-visible,.chead .x:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:#6E6B66}
.ko{font-family:var(--pxko);font-size:15px}
p{margin:0 0 8px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{border:2px solid var(--ink);padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}

.list{display:flex;flex-direction:column;gap:6px}

/* 대화 */
.dialog{position:absolute;left:var(--gut);right:var(--gutR);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center}

/* 토스트 */
#toasts{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:30;pointer-events:none;width:min(92%,520px)}

/* 미니게임 카드 */
.mgc{text-align:center}
.mgc .t{font-size:24px;line-height:1.2;color:var(--blue-d);margin:4px 0 2px}

/* 도장 */
.stampcard{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;border:2px solid var(--ink);padding:12px;background:#FFFDF6}

/* 타이틀 */
#title{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px var(--gutR) 16px var(--gut);overflow:auto;
  background-color:#FFFFFF;background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:32px 32px}

function seeded(seed) {
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h += 0x6D2B79F5; let t = h;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function dayKey(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function weekKey(d = new Date()) {           // ISO 주차
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((t - y0) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');
}

function tr(s) {                     // 영어 원문을 현재 언어로 (영어·한국어 화면에서는 영어 그대로)
  if (s == null || LANG === 'en' || LANG === 'ko') return s;
  const m = TR[LANG]; return (m && m[s]) || s;
}
// 복수형: 번역문 안의 {n|한 개|두~네 개|다섯 개 이상} 을 숫자에 맞게 고른다 (러시아어용)
function plural(n, forms) {
  if (LANG === 'ru') { const a = Math.abs(n) % 100, b = a % 10; return forms[a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2] ?? forms[forms.length - 1]; }
  return n === 1 ? forms[0] : (forms[1] ?? forms[0]);
}
function fill(s, vars) {
  if (!vars) return s;
  s = s.replace(/\{(\w+)\|([^{}]*)\}/g, (m, k, f) => {
    const forms = f.split('|'), n = parseInt(String(vars[k] ?? '').replace(/[^\d]/g, ''), 10);
    return isNaN(n) ? forms[forms.length - 1] : plural(n, forms);

  for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

  return fill((I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key, vars);
}

  if (o == null) return '';

  if (typeof o === 'string') s = o;
  else { s = o[LANG]; if (s == null) s = LANG === 'ko' ? (o.ko ?? o.en ?? '') : tr(o.en ?? ''); }
  return fill(s, vars);
}

const TIPS = [
  { en: 'Wash before you soak. Every Korean bather showers first, sitting on a little stool.', ko: '탕에 들어가기 전엔 꼭 씻기. 다들 작은 의자에 앉아서 샤워부터 해요.' },

  { en: 'The bath areas are split by gender and everyone is bare. The jjimjilbang hall is shared, and everyone wears the same outfit.', ko: '탕은 남녀가 따로이고 다들 맨몸이에요. 찜질방 홀은 함께 쓰고, 모두 같은 찜질복을 입어요.' },

  jjimjil: { en: 'Baths plus a shared hall on heated floors, with hot rooms, an ice room, a snack bar and TV corners. Families and friends hang out for hours.', ko: '목욕탕에 온돌 바닥 공용 홀, 불가마·얼음방·매점·TV 코너까지. 가족, 친구끼리 몇 시간씩 놀다 가요.' },
  kiln: { en: 'A dome-shaped kiln heated by burning wood. Much hotter than a sauna. Wrap your head in a towel and keep each round short.', ko: '장작으로 데운 돔 모양 가마. 사우나보다 훨씬 뜨거워요. 수건으로 머리를 감싸고 짧게 들어가요.' },
  busan: { en: 'Seawater baths, found in coastal cities like Busan. Slightly salty water, and many say it leaves skin smooth.', ko: '바닷물을 데워 쓰는 해수탕. 부산 같은 바닷가 도시에 있어요. 살짝 짭조름하고 피부가 매끈해진다는 사람이 많아요.' },
  onsen: { en: 'Natural hot spring water from deep underground. Whole towns grew around these springs, some with outdoor pools.', ko: '땅속 깊은 곳에서 나온 천연 온천수. 온천을 중심으로 마을이 생겼고, 노천탕이 있는 곳도 있어요.' }
};

/* ─────────────────────────────────────────────
   gfx: 도트 스프라이트를 코드로 그린다
   - 캐릭터(코스튬 조합), NPC, 몬스터, 보스, 타일, 아이콘
   ───────────────────────────────────────────── */

const OUT = '#2A2320';   // 기본 외곽선

// 픽셀 페인터 (작은 캔버스에 직접 찍기)
function painter(w, h) {
  const [c, x] = mkCanvas(w, h);
  const P = {
    c, x, w, h,
    px(X, Y, col) { if (!col) return; x.fillStyle = col; x.fillRect(X | 0, Y | 0, 1, 1); },
    r(X, Y, ww, hh, col) { if (!col) return; x.fillStyle = col; x.fillRect(X | 0, Y | 0, ww | 0, hh | 0); },
    ell(cx, cy, rx, ry, col, fn) {           // 픽셀 타원
      x.fillStyle = col;
      for (let yy = Math.floor(cy - ry); yy <= Math.ceil(cy + ry); yy++)
        for (let xx = Math.floor(cx - rx); xx <= Math.ceil(cx + rx); xx++) {
          const dx = (xx + .5 - cx) / rx, dy = (yy + .5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) { if (fn) { x.fillStyle = fn(xx, yy, dx, dy) || col; x.fillRect(xx, yy, 1, 1); } else x.fillRect(xx, yy, 1, 1); }
        }
    },
    line(x0, y0, x1, y1, col) {
      x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let e = dx + dy; x.fillStyle = col;
      for (; ;) { x.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
    },
    map(rows, pal, ox = 0, oy = 0) {          // 문자 지도 → 픽셀
      rows.forEach((row, yy) => { for (let xx = 0; xx < row.length; xx++) { const ch = row[xx]; if (ch !== '.' && ch !== ' ' && pal[ch]) P.px(ox + xx, oy + yy, pal[ch]); } });
    },
    clear(X, Y, ww, hh) { x.clearRect(X, Y, ww, hh); }
  };
  return P;
}

// 불투명 픽셀 둘레에 1px 외곽선
function outline(c, col = OUT, diag = false) {
  const x = c.getContext('2d');
  const d = x.getImageData(0, 0, c.width, c.height), a = d.data, w = c.width, h = c.height;
  const src = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) src[i] = a[i * 4 + 3] > 20 ? 1 : 0;
  const [r, g, b] = hex2rgb(col);
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    const i = yy * w + xx; if (src[i]) continue;
    let n = (xx > 0 && src[i - 1]) || (xx < w - 1 && src[i + 1]) || (yy > 0 && src[i - w]) || (yy < h - 1 && src[i + w]);
    if (!n && diag) n = (xx > 0 && yy > 0 && src[i - w - 1]) || (xx < w - 1 && yy > 0 && src[i - w + 1]) || (xx > 0 && yy < h - 1 && src[i + w - 1]) || (xx < w - 1 && yy < h - 1 && src[i + w + 1]);
    if (n) { a[i * 4] = r; a[i * 4 + 1] = g; a[i * 4 + 2] = b; a[i * 4 + 3] = 255; }
  }
  x.putImageData(d, 0, 0);
  return c;
}
function flipH(c) { const [n, x] = mkCanvas(c.width, c.height); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return n; }
function tintCanvas(c, col, alpha = 1) {      // 실루엣(피격 번쩍임 등)
  const [n, x] = mkCanvas(c.width, c.height); x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = alpha; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return n;
}
function scaleCanvas(c, k) { const [n, x] = mkCanvas(c.width * k, c.height * k); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, n.width, n.height); return n; }

/* ═══════════ 코스튬 카탈로그 (색·모양) ═══════════ */
const LOOK = {
  skin: { s1: C.skin1, s2: C.skin2, s3: C.skin3, s4: '#7A4E35' },
  hair: { black: '#2B2522', brown: '#6B4630', blonde: '#D9B061', red: '#A0472E', grey: '#B9B6B0', white: '#F2F0EA' },
  outfit: { ochre: C.ochre, pink: C.pink, sky: '#8EC5E8', mint: '#8FD4B8', navy: '#3E5E90', plum: '#9A5C8E', black: '#3A3835', gold: C.gold, seal: C.red, white: '#ECEAE4', burlap: '#9C7A55', lavender: '#B9A6E0', coral: '#F09A86' },
  towel: { white: '#F4F4EE', pink: '#F2B8C2', mint: '#A8E0C8', yellow: '#F2D77A', sky: '#A9D3F0', seal: C.redL, gold: C.gold },
  scrub: { green: '#2FA35E', red: '#D2463A', blue: '#3D7FC4', flame: '#F08A2C', gold: C.gold },
  bagaji: { orange: '#F0913A', wood: C.woodL, blue: '#4A9AD6', octo: '#C95A6E', gold: C.gold },
  slipper: { blue: '#3D7FC4', pink: '#E58FA0', yellow: '#E8C547', moon: '#5C4E9E', tile: '#EAF2F7' }
};

/* ═══════════ 사람 캐릭터 ═══════════
   look = { skin, hair, hairStyle, outfit, towelShape, towelColor, scrub, slipper, extra:[] }
   스프라이트 20×30, 발끝 기준점 (10, 28) */
const CHAR_W = 20, CHAR_H = 30, CHAR_AX = 10, CHAR_AY = 28;
const charCache = new Map();

function lookKey(l) { return [l.skin, l.hair, l.hairStyle, l.outfit, l.towelShape, l.towelColor, l.scrub, l.slipper, (l.extra || []).join('+'), l.ghost ? 'g' : ''].join('|'); }

function getChar(look) {
  const k = lookKey(look);
  let f = charCache.get(k);
  if (!f) { f = buildChar(look); charCache.set(k, f); }
  return f;
}

function buildChar(look) {
  const res = { down: [], up: [], right: [], left: [] };
  for (const dir of ['down', 'up', 'right']) for (let fr = 0; fr < 4; fr++) res[dir].push(drawChar(look, dir, fr));
  res.left = res.right.map(flipH);
  res.flash = {};
  for (const d of ['down', 'up', 'right', 'left']) res.flash[d] = tintCanvas(res[d][0], '#FFFFFF', .85);
  res.portrait = drawPortrait(look);
  return res;
}

function drawChar(look, dir, fr) {
  const P = painter(CHAR_W, CHAR_H);
  const ox = 2, oy = 4;
  const skin = LOOK.skin[look.skin] || look.skin || C.skin1, skinS = shade(skin, -.16);
  const hair = LOOK.hair[look.hair] || look.hair || '#2B2522', hairS = shade(hair, -.25), hairL = shade(hair, .18);
  const out = LOOK.outfit[look.outfit] || look.outfit || C.ochre, outS = shade(out, -.18), outL = shade(out, .2);
  const pants = shade(out, -.24);
  const tw = LOOK.towel[look.towelColor] || look.towelColor || '#F4F4EE', twS = shade(tw, -.16);
  const scrub = LOOK.scrub[look.scrub] || look.scrub || '#2FA35E';
  const sl = LOOK.slipper[look.slipper] || look.slipper || '#3D7FC4', slS = shade(sl, -.25);
  const ex = look.extra || [];
  const step = fr === 1 ? -1 : fr === 3 ? 1 : 0;   // -1 왼발, +1 오른발
  const bob = (fr === 1 || fr === 3) ? 1 : 0;
  const R = (x, y, w, h, c) => P.r(ox + x, oy + y + (y < 20 ? bob : 0), w, h, c);
  const D = (x, y, c) => P.px(ox + x, oy + y + (y < 20 ? bob : 0), c);
  const hs = look.hairStyle || 'short';

  if (dir === 'down' || dir === 'up') {
    const back = dir === 'up';
    // 긴머리 뒷부분
    if (hs === 'long') { R(3, 6, 10, 8, hairS); }
    // 다리·슬리퍼
    const legL = step === -1 ? 1 : 0, legR = step === 1 ? 1 : 0;
    P.r(ox + 5, oy + 20, 2, 2 - legL, skin); P.r(ox + 9, oy + 20, 2, 2 - legR, skin);
    P.r(ox + 4, oy + 22 - legL, 3, 2, sl); P.r(ox + 4, oy + 23 - legL, 3, 1, slS);
    P.r(ox + 9, oy + 22 - legR, 3, 2, sl); P.r(ox + 9, oy + 23 - legR, 3, 1, slS);
    // 반바지
    R(4, 17, 8, 3, pants); R(7, 19, 2, 1, null); P.x.clearRect(ox + 7, oy + 19 + bob, 2, 1);
    D(4, 17, shade(pants, .12)); D(11, 17, shade(pants, -.1));
    // 상의 + 소매
    R(4, 11, 8, 6, out); R(3, 11, 1, 3, out); R(12, 11, 1, 3, out);
    R(4, 16, 8, 1, outS); R(4, 11, 1, 5, outL);
    if (!back) { R(6, 11, 4, 1, skinS); D(9, 13, outL); D(9, 14, outL); }  // 목선, 가슴 로고
    else { R(6, 11, 4, 1, outS); R(7, 12, 2, 3, outS); }
    // 팔·손
    R(3, 14, 1, 2, skin); R(12, 14, 1, 2, skin); D(3, 16, skin); D(12, 16, skin);
    // 때타올(손에 낀 장갑)
    if (!ex.includes('nomitt')) { const mx = back ? 2 : 12; R(mx, 15, 2, 2, scrub); D(mx + (back ? 0 : 1), 15, shade(scrub, .25)); }
    // 앞치마
    if (ex.includes('apron')) { R(5, 12, 6, 7, '#F7F6F2'); R(5, 12, 6, 1, '#DCD9D2'); R(7, 15, 2, 2, '#DCD9D2'); }
    if (ex.includes('apronBlue')) { R(5, 12, 6, 7, '#6FA9D2'); R(5, 12, 6, 1, '#4D8AB6'); R(7, 15, 2, 2, '#4D8AB6'); }
    // 머리(피부)
    R(4, 1, 8, 1, skin); R(3, 2, 10, 8, skin); R(4, 10, 8, 1, skin);
    R(3, 9, 10, 1, skinS); R(4, 10, 8, 1, skinS);
    // 머리카락
    drawHairFront(R, D, hs, hair, hairS, hairL, back);
    // 얼굴
    if (!back) {
      if (ex.includes('sleepy')) { R(4, 7, 2, 1, OUT); R(10, 7, 2, 1, OUT); }
      else if (ex.includes('closed')) { R(5, 7, 1, 1, OUT); R(10, 7, 1, 1, OUT); }
      else { R(5, 6, 1, 2, OUT); R(10, 6, 1, 2, OUT); }
      D(4, 8, '#EE9A90'); D(11, 8, '#EE9A90');
      if (ex.includes('glasses')) { R(4, 5, 3, 1, OUT); R(9, 5, 3, 1, OUT); D(4, 6, OUT); D(6, 6, OUT); D(9, 6, OUT); D(11, 6, OUT); R(7, 6, 2, 1, OUT); }
      if (ex.includes('beard')) { R(4, 9, 8, 2, '#F4F2EC'); R(5, 11, 6, 3, '#F4F2EC'); R(6, 14, 4, 2, '#F4F2EC'); R(7, 16, 2, 1, '#F4F2EC'); D(7, 9, skinS); D(8, 9, skinS); }
      if (ex.includes('stubble')) { R(4, 9, 8, 1, shade(skin, -.3)); }
    }
    // 수건
    drawTowel(R, D, look.towelShape, tw, twS, back, 'front');
    if (ex.includes('eyemask')) { R(3, 3, 10, 2, '#3E4E7A'); R(5, 3, 2, 1, '#8A9AC8'); R(9, 3, 2, 1, '#8A9AC8'); }
    if (ex.includes('headband')) { R(3, 3, 10, 2, C.red); if (!back) { D(3, 5, C.red); D(2, 5, C.red); } else { R(7, 5, 2, 2, C.red); } }
  } else {
    // ── 옆모습(오른쪽) ──
    if (hs === 'long') { R(4, 6, 5, 8, hairS); }
    const fx = step === 0 ? 0 : step;  // 보폭
    // 뒷다리, 앞다리
    const bL = step === 0 ? 6 : 5 + (step < 0 ? 0 : 2), fL = step === 0 ? 8 : 9 - (step < 0 ? 0 : 2);
    P.r(ox + bL, oy + 20, 2, 2, skinS); P.r(ox + bL - 1, oy + 22, 3, 2, slS);
    P.r(ox + fL, oy + 20, 2, 2, skin); P.r(ox + fL, oy + 22, 3, 2, sl); P.r(ox + fL, oy + 23, 3, 1, slS);
    // 반바지
    R(5, 17, 6, 3, pants); D(5, 17, shade(pants, .12));
    // 상의
    R(5, 11, 6, 6, out); R(5, 16, 6, 1, outS); R(5, 11, 1, 5, outS);
    // 앞팔
    R(7, 11, 2, 3, outL); R(7, 14, 2, 2, skin); D(8, 16, skin);
    if (!ex.includes('nomitt')) { R(8, 15, 2, 2, scrub); D(9, 15, shade(scrub, .25)); }
    if (ex.includes('apron') || ex.includes('apronBlue')) { const ac = ex.includes('apron') ? '#F7F6F2' : '#6FA9D2'; R(9, 12, 2, 7, ac); }
    // 머리
    R(5, 1, 7, 1, skin); R(4, 2, 9, 8, skin); R(5, 10, 7, 1, skin); R(4, 9, 9, 1, skinS);
    drawHairSide(R, D, hs, hair, hairS, hairL);
    // 얼굴
    if (ex.includes('sleepy')) { R(10, 7, 2, 1, OUT); }
    else if (ex.includes('closed')) { D(11, 7, OUT); }
    else { R(11, 6, 1, 2, OUT); }
    D(11, 8, '#EE9A90'); D(7, 7, skinS);
    if (ex.includes('glasses')) { R(10, 5, 3, 1, OUT); D(10, 6, OUT); D(12, 6, OUT); }
    if (ex.includes('beard')) { R(8, 9, 5, 2, '#F4F2EC'); R(9, 11, 4, 3, '#F4F2EC'); R(10, 14, 2, 2, '#F4F2EC'); }
    if (ex.includes('stubble')) { R(9, 9, 4, 1, shade(skin, -.3)); }
    drawTowel(R, D, look.towelShape, tw, twS, false, 'side');
    if (ex.includes('eyemask')) { R(4, 3, 9, 2, '#3E4E7A'); R(10, 3, 2, 1, '#8A9AC8'); }
    if (ex.includes('headband')) { R(4, 3, 9, 2, C.red); D(3, 4, C.red); D(3, 5, C.red); }
  }
  outline(P.c);
  if (look.ghost) { const [n, x] = mkCanvas(P.c.width, P.c.height); x.globalAlpha = .82; x.drawImage(P.c, 0, 0); return n; }
  return P.c;
}

function drawHairFront(R, D, hs, hair, hairS, hairL, back) {
  if (hs === 'bald') { R(3, 4, 1, 3, hair); R(12, 4, 1, 3, hair); if (back) R(4, 6, 8, 2, hair); return; }
  if (hs === 'perm') {
    R(3, 0, 10, 5, hair); R(2, 1, 12, 4, hair); R(4, -1, 8, 1, hair);
    for (let i = 0; i < 6; i++) { D(3 + i * 2, 1, hairL); D(4 + i * 2, 3, hairS); }
    R(2, 5, 2, 2, hair); R(12, 5, 2, 2, hair);
    if (back) { R(2, 5, 12, 4, hair); for (let i = 0; i < 5; i++) D(4 + i * 2, 6, hairS); }
    return;
  }
  // 공통 윗머리
  R(4, 1, 8, 1, hair); R(3, 2, 10, 2, hair); D(5, 2, hairL); D(6, 2, hairL);
  if (back) {
    R(3, 4, 10, 5, hair); R(4, 9, 8, 1, hairS);
    if (hs === 'bob' || hs === 'long') R(3, 9, 10, 2, hair);
    if (hs === 'bun') { R(6, -1, 4, 2, hair); R(7, -2, 2, 1, hair); }
    return;
  }
  R(3, 4, 2, 1, hair); R(11, 4, 2, 1, hair); R(6, 4, 4, 1, hair); D(7, 5, hairS);
  R(3, 5, 1, 1, hair); R(12, 5, 1, 1, hair);
  if (hs === 'bob' || hs === 'long') { R(3, 5, 1, 5, hair); R(12, 5, 1, 5, hair); D(3, 9, hairS); D(12, 9, hairS); }
  if (hs === 'bun') { R(6, -1, 4, 2, hair); R(7, -2, 2, 1, hair); D(7, -1, hairL); }
  if (hs === 'spiky') { D(4, 0, hair); D(7, 0, hair); D(10, 0, hair); }
}
function drawHairSide(R, D, hs, hair, hairS, hairL) {
  if (hs === 'bald') { R(4, 4, 3, 3, hair); return; }
  if (hs === 'perm') { R(3, 0, 9, 5, hair); R(3, 5, 4, 3, hair); for (let i = 0; i < 4; i++) { D(4 + i * 2, 1, hairL); D(5 + i * 2, 3, hairS); } return; }
  R(5, 1, 7, 1, hair); R(4, 2, 9, 2, hair); R(4, 4, 4, 4, hair); R(8, 4, 3, 1, hair); D(6, 2, hairL); D(7, 2, hairL);
  if (hs === 'bob' || hs === 'long') R(4, 8, 3, 2, hair);
  if (hs === 'bun') { R(3, 0, 3, 3, hair); D(4, 0, hairL); }
  if (hs === 'spiky') { D(6, 0, hair); D(9, 0, hair); }
}
function drawTowel(R, D, shape, tw, twS, back, view) {
  if (!shape || shape === 'none') return;
  if (view === 'side') {
    if (shape === 'lamb' || shape === 'crown') {
      R(5, 1, 7, 2, tw); R(6, 0, 5, 1, tw); R(5, 3, 7, 1, twS);
      R(3, 1, 5, 5, tw); R(4, 0, 3, 1, tw); R(4, 6, 3, 1, tw); D(5, 2, twS); D(4, 3, twS); D(5, 4, twS); D(6, 5, twS);   // 귀 위 말이
      if (shape === 'crown') { R(6, -3, 5, 2, C.gold); D(6, -4, C.gold); D(8, -4, C.gold); D(10, -4, C.gold); D(8, -3, C.red); }
    } else if (shape === 'band') { R(4, 3, 9, 2, tw); R(2, 4, 2, 2, tw); D(2, 6, twS); }
    else if (shape === 'turban') { R(4, -1, 9, 5, tw); R(5, -2, 6, 1, tw); D(6, 0, twS); D(8, 1, twS); D(10, 0, twS); R(4, 3, 9, 1, twS); }
    else if (shape === 'shell') { R(4, -1, 9, 4, '#FBF7EA'); D(4, 3, '#FBF7EA'); D(6, 3, '#FBF7EA'); D(9, 3, '#FBF7EA'); D(12, 3, '#FBF7EA'); D(7, 0, '#E7DFC6'); }
    else if (shape === 'frog') { R(4, 0, 9, 4, '#7DC46A'); R(7, -2, 3, 2, '#7DC46A'); R(10, -2, 3, 2, '#7DC46A'); D(8, -2, OUT); D(11, -2, OUT); }
    else if (shape === 'cat') { R(4, 0, 9, 4, tw); R(4, 3, 9, 1, twS); R(5, -2, 2, 2, tw); D(5, -3, tw); R(10, -2, 2, 2, tw); D(11, -3, tw); D(6, -1, '#F2B8C2'); D(10, -1, '#F2B8C2'); }
    return;
  }
  if (shape === 'lamb' || shape === 'crown') {
    R(4, 1, 8, 2, tw); R(5, 0, 6, 1, tw); R(4, 3, 8, 1, twS);
    // 양쪽 말이(양머리) : 귀 위로 동그랗게 만 수건
    R(0, 1, 5, 5, tw); R(1, 0, 3, 1, tw); R(1, 6, 3, 1, tw); D(2, 2, twS); D(3, 3, twS); D(2, 4, twS); D(1, 5, twS); D(4, 5, twS);
    R(11, 1, 5, 5, tw); R(12, 0, 3, 1, tw); R(12, 6, 3, 1, tw); D(13, 2, twS); D(12, 3, twS); D(13, 4, twS); D(14, 5, twS); D(11, 5, twS);
    if (shape === 'crown') { R(5, -3, 6, 2, C.gold); D(5, -4, C.gold); D(7, -4, C.gold); D(10, -4, C.gold); D(8, -4, C.gold); D(7, -3, C.red); D(8, -3, '#7FB8E6'); }
  } else if (shape === 'band') {
    R(3, 3, 10, 2, tw); R(3, 4, 10, 1, twS);
    if (!back) { D(12, 2, tw); D(13, 2, tw); D(13, 3, tw); } else { R(7, 5, 2, 2, tw); D(6, 7, twS); D(9, 7, twS); }
  } else if (shape === 'turban') {

  } else if (shape === 'shell') {

    D(6, -1, '#E7DFC6'); D(9, 0, '#E7DFC6');
  } else if (shape === 'cat') {

    R(3, 0, 10, 4, '#7DC46A'); R(3, 3, 10, 1, '#5FA350');
    R(3, -2, 3, 3, '#7DC46A'); R(10, -2, 3, 3, '#7DC46A'); D(4, -1, OUT); D(11, -1, OUT); D(4, -2, '#FFFFFF'); D(11, -2, '#FFFFFF');
  }
}

// 대화창 초상화 (얼굴 확대 32×32)
function drawPortrait(look) {

const WATER = { '~': 'warm', '^': 'hot', '=': 'cold', 's': 'sea', 'o': 'spring' };

function tileFloor(ch) {
  const P = painter(16, 16);
  const R = P.r.bind(P), D = P.px.bind(P);
  switch (ch) {
    case '.': { R(0, 0, 16, 16, '#F7F9FA'); R(0, 0, 16, 1, '#D7E2EA'); R(0, 8, 16, 1, '#D7E2EA'); R(0, 0, 1, 16, '#D7E2EA'); R(8, 0, 1, 16, '#D7E2EA'); D(3, 3, '#FFFFFF'); D(11, 11, '#FFFFFF'); break; }
    case ',': { R(0, 0, 16, 16, C.woodL); for (let i = 0; i < 4; i++) { R(0, i * 4 + 3, 16, 1, C.wood); } D(4, 1, '#D8AE78'); D(12, 5, '#B98A55'); D(7, 9, '#D8AE78'); D(2, 13, '#B98A55'); R((ch.charCodeAt(0) * 3) % 12, 3, 1, 1, '#8E6438'); break; }
    case '_': { R(0, 0, 16, 16, C.ondol); R(0, 0, 16, 1, C.ondolD); R(0, 0, 1, 16, C.ondolD); D(4, 4, '#F0CC7E'); D(5, 4, '#F0CC7E'); D(11, 10, '#D4A44A'); D(9, 12, '#F0CC7E'); break; }
    case ':': { R(0, 0, 16, 16, '#5E6E80'); R(0, 0, 16, 1, '#4A5868'); R(0, 8, 16, 1, '#4A5868'); R(0, 0, 1, 16, '#4A5868'); R(8, 0, 1, 16, '#4A5868'); D(3, 3, '#6E7E90'); D(11, 11, '#6E7E90'); break; }
    case 'k': { R(0, 0, 16, 16, '#C99468'); for (let i = 0; i < 16; i += 2) for (let j = (i / 2) % 2; j < 16; j += 3) D(j, i, '#B57F55'); R(0, 15, 16, 1, '#A86F48'); break; }
    case 'p': { R(0, 0, 16, 16, C.grass); P.ell(5, 5, 4, 3, '#B9B6AE'); P.ell(12, 11, 4, 3, '#A9A69E'); D(4, 4, '#D6D3CC'); D(11, 10, '#C6C3BC'); break; }
    case 'g': { R(0, 0, 16, 16, C.grass); D(3, 4, C.grassD); D(4, 3, C.grassD); D(11, 9, C.grassD); D(12, 8, C.grassD); D(7, 13, '#9CCB80'); D(13, 2, '#9CCB80'); break; }
    case 'd': { R(0, 0, 16, 16, '#C9A57A'); for (let i = 0; i < 4; i++) R(i * 4 + 3, 0, 1, 16, '#A8835A'); D(1, 5, '#DDBE96'); D(9, 11, '#DDBE96'); break; }

    case 'x': { R(0, 0, 16, 16, '#F7F9FA'); R(0, 0, 16, 1, '#D7E2EA'); R(0, 0, 1, 16, '#D7E2EA'); P.ell(8, 8, 5, 5, '#A9B4BC'); P.ell(8, 8, 4, 4, '#7C8890'); for (let i = 5; i < 12; i += 2) R(i, 5, 1, 7, '#56616A'); break; }
    case 'z': { R(0, 0, 16, 16, '#5E6E80'); R(0, 0, 16, 1, '#4A5868'); R(0, 0, 1, 16, '#4A5868'); P.ell(8, 8, 5, 5, '#3E4A56'); for (let i = 5; i < 12; i += 2) R(i, 5, 1, 7, '#2A333C'); break; }
    case 'y': { R(0, 0, 16, 16, '#D9C9A8'); R(0, 0, 16, 1, '#C4B28C'); R(0, 0, 1, 16, '#C4B28C'); D(5, 6, '#E8DCC2'); D(12, 12, '#C4B28C'); break; }   // 황토 마당
    case 'j': { R(0, 0, 16, 16, '#CFE3EE'); R(0, 0, 16, 1, '#B5CFDE'); R(0, 0, 1, 16, '#B5CFDE'); D(4, 5, '#FFFFFF'); D(5, 5, '#FFFFFF'); D(11, 11, '#EAF4FA'); break; }   // 얼음방 바닥

function tileWater(kind, f) {
  const base = { warm: '#7FC8E0', hot: '#72CDBF', cold: '#3E8EC8', sea: '#3FA0A8', spring: '#A8DCD2', deep: '#2F7EA8' }[kind];
  const P = painter(16, 16);
  P.r(0, 0, 16, 16, base);
  const hl = shade(base, .35), dk = shade(base, -.12);
  for (let i = 0; i < 3; i++) {
    const yy = (i * 6 + f * 2) % 16, xx = (i * 7 + f * 3) % 12;
    P.r(xx, yy, 4, 1, hl); P.r(xx + 5, (yy + 3) % 16, 3, 1, dk);
  }
  if (kind === 'hot' || kind === 'spring') { P.px((3 + f * 5) % 16, (9 + f) % 16, '#FFFFFF'); }
  return P.c;
}

function tileWall(ch, front) {
  const P = painter(16, 16);
  const R = P.r.bind(P), D = P.px.bind(P);
  const top = { '#': '#2C4E66', 'H': '#5A3A1E', 'K': '#6E3A22', 'Y': '#3A3835', 'Q': '#5A3A1E', 'N': '#3E5A6A' }[ch];
  if (!front) { R(0, 0, 16, 16, top); R(0, 0, 16, 1, shade(top, .15)); return P.c; }
  if (ch === '#') {           // 흰 타일 벽 + 파란 띠
    R(0, 0, 16, 16, '#EEF3F6'); R(0, 0, 16, 3, top);
    for (let x = 0; x < 16; x += 5) R(x, 3, 1, 9, '#D2DEE6'); R(0, 7, 16, 1, '#D2DEE6');
    R(0, 11, 16, 2, C.blue); R(0, 13, 16, 3, '#C8D4DC'); R(0, 15, 16, 1, '#A9B8C2');
  } else if (ch === 'H' || ch === 'Q') {
    R(0, 0, 16, 16, C.wood); R(0, 0, 16, 3, top);
    for (let x = 1; x < 16; x += 4) R(x, 3, 1, 13, '#8E6438'); D(3, 6, C.woodL); D(10, 9, C.woodL); R(0, 14, 16, 2, '#6E4A26');
  } else if (ch === 'K') {
    R(0, 0, 16, 16, C.clay); R(0, 0, 16, 3, top);
    for (let y = 3; y < 16; y += 4) { R(0, y, 16, 1, C.clayD); for (let x = (y % 8 === 3 ? 0 : 4); x < 16; x += 8) R(x, y, 1, 4, C.clayD); }
  } else if (ch === 'Y') {    // 한옥 담 (기와 + 회벽)
    R(0, 0, 16, 5, '#4A4E56'); for (let x = 0; x < 16; x += 4) R(x, 4, 3, 2, '#5E626A'); R(0, 6, 16, 10, '#F2EEE4');
    R(0, 6, 16, 1, '#C9C2B2'); R(2, 9, 12, 4, '#E4DCCA'); R(0, 15, 16, 1, '#B9B0A0');
  } else if (ch === 'N') {    // 바다쪽 창
    R(0, 0, 16, 16, '#EEF3F6'); R(0, 0, 16, 3, top); R(1, 4, 14, 9, '#8FD0E8'); R(1, 4, 14, 1, '#C7ECF7'); D(4, 6, '#FFFFFF'); D(5, 7, '#FFFFFF'); R(7, 4, 1, 9, '#EEF3F6'); R(0, 13, 16, 3, '#C8D4DC');
  }
  return P.c;
}

}

const FX = {};
function buildFX() {

  // 하트
  P = painter(9, 8); P.map(['.rr.rr.', 'rwrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r: C.red, w: '#FFB3A6' }, 1, 1); outline(P.c, OUT); FX.heart = P.c;

/* ─────────────────────────────────────────────
   audio: WebAudio 합성 효과음 + 칩튠 배경음악
   (사용자가 한 번 누른 뒤부터 소리가 난다)
   ───────────────────────────────────────────── */

const SND = {
  ctx: null, master: null, sfxG: null, musG: null, noiseBuf: null,
  musicOn: true, sfxOn: true, track: null, timer: null, step: 0, nextT: 0, pourNode: null,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = .8; this.master.connect(c.destination);
      this.sfxG = c.createGain(); this.sfxG.gain.value = this.sfxOn ? .55 : 0; this.sfxG.connect(this.master);
      this.musG = c.createGain(); this.musG.gain.value = this.musicOn ? .32 : 0; this.musG.connect(this.master);
      const n = c.createBuffer(1, c.sampleRate * 1, c.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = n;
      if (this.pending) { const p = this.pending; this.pending = null; this.play(p); }
    } catch (e) { this.ctx = null; }
  },
  setMusic(on) { this.musicOn = on; if (this.musG) this.musG.gain.value = on ? .32 : 0; },
  setSfx(on) { this.sfxOn = on; if (this.sfxG) this.sfxG.gain.value = on ? .55 : 0; },

  // 기본 발음기
  tone(f, dur, type = 'square', vol = .2, t0 = 0, f2 = null, dest = null) {
    const c = this.ctx; if (!c) return;
    const t = (t0 || c.currentTime) + .001;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol = .2, t0 = 0, filt = 'lowpass', fq = 1200, fq2 = null, dest = null) {
    const c = this.ctx; if (!c) return;
    const t = (t0 || c.currentTime) + .001;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = filt; f.frequency.setValueAtTime(fq, t);
    if (fq2) f.frequency.exponentialRampToValueAtTime(fq2, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxG); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  },

  sfx(name) {
    const c = this.ctx; if (!c || !this.sfxOn) return;
    const T = c.currentTime;
    switch (name) {
      case 'swing': this.noise(.12, .25, 0, 'bandpass', 2400, 500); break;
      case 'splash': this.noise(.28, .3, 0, 'lowpass', 2200, 400); this.tone(700, .08, 'sine', .12, 0, 1400); break;
      case 'hit': this.tone(260, .08, 'square', .16, 0, 120); this.noise(.05, .15, 0, 'highpass', 2000); break;
      case 'pop': this.tone(500, .12, 'triangle', .22, 0, 1300); break;
      case 'coin': this.tone(988, .06, 'square', .1); this.tone(1319, .14, 'square', .1, T + .06); break;
      case 'hurt': this.tone(320, .22, 'sawtooth', .14, 0, 110); break;
      case 'heal': [523, 659, 784].forEach((f, i) => this.tone(f, .14, 'triangle', .16, T + i * .07)); break;
      case 'stamp': this.tone(130, .25, 'sine', .45, 0, 45); this.noise(.08, .3, 0, 'lowpass', 600); [1047, 1568].forEach((f, i) => this.tone(f, .5, 'triangle', .12, T + .14 + i * .08)); break;
      case 'click': this.tone(660, .03, 'square', .07); break;
      case 'open': this.tone(440, .08, 'triangle', .14, 0, 700); break;
      case 'close': this.tone(600, .08, 'triangle', .12, 0, 380); break;
      case 'roar': this.tone(95, .7, 'sawtooth', .22, 0, 60); this.noise(.6, .18, 0, 'lowpass', 500, 150); break;
      case 'crack': this.noise(.06, .35, 0, 'highpass', 3000); this.tone(1800, .04, 'square', .08); break;
      case 'kick': this.tone(140, .14, 'sine', .5, 0, 45); break;
      case 'snare': this.noise(.12, .22, 0, 'highpass', 1500); break;
      case 'hat': this.noise(.03, .1, 0, 'highpass', 6000); break;
      case 'shiver': for (let i = 0; i < 6; i++) this.tone(300 + (i % 2) * 40, .04, 'square', .05, T + i * .05); break;
      case 'snore': this.tone(70, .9, 'sawtooth', .12, 0, 50); this.noise(.8, .06, 0, 'lowpass', 300); break;
      case 'bubble': this.tone(380, .1, 'sine', .14, 0, 900); break;
      case 'wash': this.noise(.9, .16, 0, 'bandpass', 3000, 1500); this.noise(.6, .08, T + .2, 'highpass', 5000); break;
      case 'fail': this.tone(330, .18, 'square', .12, 0); this.tone(220, .3, 'square', .12, T + .16); break;
      case 'good': this.tone(784, .06, 'triangle', .16); this.tone(1047, .1, 'triangle', .16, T + .05); break;
      case 'perfect': [1047, 1319, 1568].forEach(f => this.tone(f, .16, 'triangle', .1)); break;
      case 'miss': this.noise(.1, .2, 0, 'lowpass', 300); break;
      case 'unlock': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .16, 'square', .08, T + i * .07)); break;
      case 'boss': for (let i = 0; i < 4; i++) { this.tone(440, .12, 'square', .1, T + i * .26); this.tone(330, .12, 'square', .1, T + i * .26 + .13); } break;
      case 'fire': this.noise(.4, .24, 0, 'lowpass', 1800, 300); break;
      case 'boing': this.tone(200, .3, 'sine', .25, 0, 600); break;
      case 'tick': this.tone(1200, .02, 'square', .05); break;
      case 'door': this.tone(300, .1, 'triangle', .15, 0, 500); this.tone(500, .1, 'triangle', .1, T + .08); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .25, 'square', .09, T + i * .12)); this.tone(1047, .6, 'triangle', .12, T + .5); break;
      case 'levelup': [392, 523, 659, 784].forEach((f, i) => this.tone(f, .12, 'square', .08, T + i * .08)); [1047, 1319].forEach((f, i) => this.tone(f, .5, 'triangle', .13, T + .36 + i * .1)); break;
      case 'shutter': this.noise(.04, .4, 0, 'highpass', 4000); this.tone(1600, .03, 'square', .06, T + .05); this.noise(.06, .25, T + .07, 'bandpass', 2500); break;
      case 'gulp': this.tone(240, .09, 'sine', .3, 0, 140); break;
      case 'cough': for (let i = 0; i < 3; i++) this.noise(.09, .3, T + i * .16, 'bandpass', 900, 400); break;
      case 'ach': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, .14, 'triangle', .11, T + i * .06)); break;
      case 'page': this.noise(.07, .14, 0, 'bandpass', 3500, 1800); break;
    }
  },
  pour(on) {
    const c = this.ctx; if (!c) return;
    if (on && !this.pourNode && this.sfxOn) {
      const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .8;
      const g = c.createGain(); g.gain.value = .16; s.connect(f); f.connect(g); g.connect(this.sfxG); s.start();
      this.pourNode = { s, g };
    } else if (!on && this.pourNode) { try { this.pourNode.s.stop(); } catch (e) { } this.pourNode = null; }
  },

  /* ── 배경음악 ── */
  play(name) {
    if (!this.ctx) { this.pending = name; return; }
    if (this.track && this.track.name === name) return;
    this.stop();
    const tr = TRACKS[name]; if (!tr) return;
    this.track = Object.assign({ name }, tr);
    this.step = 0; this.nextT = this.ctx.currentTime + .1;
    this.timer = setInterval(() => this.tick(), 30);
  },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.track = null; },
  tick() {
    const c = this.ctx, tr = this.track; if (!c || !tr) return;
    const sd = 60 / tr.bpm / 4;
    while (this.nextT < c.currentTime + .15) {
      const s = this.step, t = this.nextT;
      if (this.musicOn) {
        const m = tr.mel[s % tr.mel.length]; if (m) this.tone(NOTE(m), sd * (tr.len || 1.8), tr.lead || 'square', .09, t, null, this.musG);
        const b = tr.bass[s % tr.bass.length]; if (b) this.tone(NOTE(b), sd * 3.5, 'triangle', .22, t, null, this.musG);
        if (tr.arp) { const a = tr.arp[s % tr.arp.length]; if (a) this.tone(NOTE(a), sd * .9, 'sine', .07, t, null, this.musG); }
        const d = tr.drum[s % tr.drum.length];
        if (d === 'k') this.tone(140, .12, 'sine', .3, t, 45, this.musG);
        else if (d === 's') this.noise(.1, .1, t, 'highpass', 1500, null, this.musG);
        else if (d === 'h') this.noise(.025, .05, t, 'highpass', 6000, null, this.musG);
        else if (d === 't') this.tone(110, .2, 'sine', .3, t, 70, this.musG);
      }
      this.step++; this.nextT += sd;
    }
  }
};

const NOTE_IX = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
function NOTE(n) { const m = /^([A-G]#?)(\d)$/.exec(n); if (!m) return 440; return 440 * Math.pow(2, (NOTE_IX[m[1]] + (+m[2] + 1) * 12 - 69) / 12); }
const seq = s => s.trim().split(/\s+/).map(x => x === '.' ? null : x);

const TRACKS = {
  bath: { bpm: 96,
    mel: seq('E5 . G5 . A5 . G5 . E5 . D5 . C5 . . .  D5 . E5 . G5 . E5 . D5 . . . . . . .  E5 . G5 . A5 . C6 . A5 . G5 . E5 . . .  D5 . C5 . D5 . E5 . C5 . . . . . . .'),

/* ─────────────────────────────────────────────
   input: 키보드 + 모바일 조이스틱/버튼 + 포인터
   ───────────────────────────────────────────── */

const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'act', ShiftLeft: 'alt', ShiftRight: 'alt', KeyK: 'alt', KeyE: 'use', Enter: 'use', KeyF: 'use',
  Digit1: 'e1', Digit2: 'e2', Digit3: 'e3', Digit4: 'e4', Escape: 'menu', KeyM: 'map', KeyT: 'chat', KeyQ: 'eat', KeyC: 'costume', KeyB: 'bag', Tab: 'chat',
  KeyJ: 'missions', KeyP: 'photo', KeyL: 'album', KeyI: 'card'
};

const Input = {
  down: {}, pressed: {}, released: {}, joy: { x: 0, y: 0, on: false },
  pointer: { x: 0, y: 0, down: false, clicked: false },
  touchMode: false, blocked: false,

  init(canvas) {
    window.addEventListener('keydown', e => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const a = KEYMAP[e.code]; if (!a) return;
      if (['up', 'down', 'left', 'right', 'act', 'chat'].includes(a)) e.preventDefault();
      if (!this.down[a]) this.pressed[a] = true;
      this.down[a] = true;
      SND.init();
    });
    window.addEventListener('keyup', e => {
      const a = KEYMAP[e.code]; if (!a) return;
      this.down[a] = false; this.released[a] = true;
    });
    window.addEventListener('blur', () => { this.down = {}; this.joy.x = this.joy.y = 0; this.joy.on = false; });

    // 포인터 (캔버스 위 논리 좌표)
    const toLogical = e => {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
    };
    canvas.addEventListener('pointerdown', e => {
      SND.init();
      const p = toLogical(e); this.pointer.x = p.x; this.pointer.y = p.y; this.pointer.down = true; this.pointer.clicked = true;
    });
    canvas.addEventListener('pointermove', e => { const p = toLogical(e); this.pointer.x = p.x; this.pointer.y = p.y; });
    window.addEventListener('pointerup', () => { this.pointer.down = false; });

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) this.setTouch(true);
    window.addEventListener('touchstart', () => this.setTouch(true), { once: true, passive: true });
    this.bindTouch();
  },
  setTouch(on) { this.touchMode = on; document.documentElement.classList.toggle('touch', on); },

  bindTouch() {
    const base = $('#joy'), knob = $('#joyKnob');
    if (base && !base.dataset.bound) {
      base.dataset.bound = '1';
      let id = null, cx = 0, cy = 0;
      const R = 42;
      const move = (x, y) => {
        let dx = x - cx, dy = y - cy; const d = Math.hypot(dx, dy);
        if (d > R) { dx = dx / d * R; dy = dy / d * R; }
        knob.style.transform = `translate(${dx}px,${dy}px)`;
        this.joy.x = Math.abs(dx) > 6 ? dx / R : 0; this.joy.y = Math.abs(dy) > 6 ? dy / R : 0; this.joy.on = true;
      };
      base.addEventListener('pointerdown', e => {
        SND.init(); e.preventDefault(); id = e.pointerId; base.setPointerCapture(id);
        const r = base.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; move(e.clientX, e.clientY);
      });
      base.addEventListener('pointermove', e => { if (e.pointerId === id) move(e.clientX, e.clientY); });
      const end = e => { if (e.pointerId !== id) return; id = null; knob.style.transform = ''; this.joy.x = this.joy.y = 0; this.joy.on = false; };
      base.addEventListener('pointerup', end); base.addEventListener('pointercancel', end);
    }
    $$('[data-act]').forEach(b => {
      if (b.dataset.bound) return; b.dataset.bound = '1';
      const a = b.dataset.act;
      const on = e => { e.preventDefault(); SND.init(); if (!this.down[a]) this.pressed[a] = true; this.down[a] = true; b.classList.add('on'); };
      const off = e => { this.down[a] = false; this.released[a] = true; b.classList.remove('on'); };
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
      b.addEventListener('contextmenu', e => e.preventDefault());
    });
  },

  axis() {
    let x = (this.down.right ? 1 : 0) - (this.down.left ? 1 : 0);
    let y = (this.down.down ? 1 : 0) - (this.down.up ? 1 : 0);
    if (this.joy.on && (this.joy.x || this.joy.y)) { x = this.joy.x; y = this.joy.y; }
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    return { x, y };
  },
  hit(a) { return !this.blocked && !!this.pressed[a]; },
  held(a) { return !this.blocked && !!this.down[a]; },
  any() { return this.hit('act') || this.hit('use') || this.pointer.clicked; },
  endFrame() { this.pressed = {}; this.released = {}; this.pointer.clicked = false; },
  clear() { this.down = {}; this.pressed = {}; this.released = {}; }
};

const SAVE_KEY = 'hantang_online_v2';
const PHOTO_KEY = 'hantang_online_photos_v2';
let S = null;

function newSave(name, look) {
  return {
    v: 2, id: 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4),

    track: 'm_bath1',
    daily: { day: '', ids: [], base: {}, done: {}, bonus: false },
    ach: {}, titles: [], title: '',

    stamps: [], lastDaily: '', days: [],
    codex: { bath: {}, food: {}, phrase: Object.fromEntries(START_PHRASES.map(p => [p, 1])), act: {}, scene: {}, npc: {} },
    scenes: {},            // id → {d: 날짜, l: 그때 외형}
    diary: [],             // [{d, l, label}]
    best: {}, weekly: { wk: weekKey(), s: {} },
    inv: { sikhye: 1, egg: 2 }, quick: 'sikhye',
    mgPlayed: {}, mgBestGrade: {},
    settings: { music: true, sfx: true, tracker: true },
    flags: {}
  };
}
// 예전(몬스터 버전) 저장이 있으면 이름·외형·옷장·땀P·도감만 옮겨 온다
function migrateV1() {
  const o = Store.get('hantang_online_v1', null);
  if (!o || !o.name) return null;
  const d = newSave(o.name, o.look);
  d.id = o.id || d.id; d.created = o.created || d.created; d.lang = o.lang || d.lang;
  if (o.costume) Object.assign(d.costume, o.costume);
  if (o.owned) for (const k of SLOTS) if (Array.isArray(o.owned[k])) o.owned[k].forEach(id => { if (COSTUMES[k].some(x => x.id === id) && !d.owned[k].includes(id)) d.owned[k].push(id); });
  for (const k of SLOTS) if (!d.owned[k].includes(d.costume[k])) d.costume[k] = d.owned[k][0];
  d.sweat = Math.max(d.sweat, Math.min(5000, o.sweat | 0));
  if (o.codex) ['bath', 'food', 'phrase'].forEach(k => Object.assign(d.codex[k], o.codex[k] || {}));
  if (o.best) d.best = o.best; if (o.mgPlayed) d.mgPlayed = o.mgPlayed;
  if (o.inv) d.inv = Object.assign(d.inv, o.inv);
  d.flags.migrated = 1;
  Store.set(SAVE_KEY, d);
  return d;
}
function loadSave() {
  let d = Store.get(SAVE_KEY, null);
  if (!d) d = migrateV1();
  if (!d || d.v !== 2) return null;
  const base = newSave(d.name, d.look);
  for (const k in base) if (d[k] === undefined) d[k] = base[k];
  for (const k in base.codex) if (!d.codex[k]) d.codex[k] = {};
  for (const k of SLOTS) if (!d.owned[k]) d.owned[k] = base.owned[k];
  if (!d.weekly || d.weekly.wk !== weekKey()) d.weekly = { wk: weekKey(), s: {} };
  START_PHRASES.forEach(p => d.codex.phrase[p] = d.codex.phrase[p] || 1);
  return d;
}
let saveTimer = null;
function save(now) {
  if (!S) return;
  if (now) { Store.set(SAVE_KEY, S); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(() => Store.set(SAVE_KEY, S), 400);
}
// 사진은 용량이 커서 따로 저장
function loadPhotos() { return Store.get(PHOTO_KEY, []) || []; }
function savePhotos(list) {
  while (list.length) { if (Store.set(PHOTO_KEY, list)) return true; list.shift(); }
  return false;
}

function playerLook() { return Object.assign({}, S.look, S.costume); }
function stampCount() { return S.stamps.length; }
function mainStampCount() { return S.stamps.filter(s => s.t === 'main').length; }
function addStamp(t, id) {
  S.stamps.push({ t, id, d: dayKey() });
  save(); Bus.emit('stamp', { t, id });
  if (S.stamps.length === 6) unlockCostume('towelColor', 'seal', true);
  if (S.stamps.length === 10) unlockCostume('outfit', 'seal', true);
  stat('stamps', 0);
}
function checkDaily() {
  const k = dayKey();
  if (!S.days.includes(k)) { S.days.push(k); if (S.days.length > 400) S.days.shift(); }
  if (S.lastDaily !== k) { S.lastDaily = k; addStamp('daily', k); return true; }
  return false;
}
function stageUnlocked(id) {
  const st = STAGES[id];
  if (S.lv < st.lv) return false;
  if (st.needStamps && mainStampCount() < st.needStamps) return false;
  return true;
}
function unlockCostume(slot, id, announce) {
  if (!S.owned[slot].includes(id)) {
    S.owned[slot].push(id); save();
    if (announce) Bus.emit('costume', { slot, id });
    stat('costumes', 0);
    return true;
  }
  return false;
}
function costumeCount() { return SLOTS.reduce((a, s) => a + S.owned[s].length, 0); }
function codexAdd(cat, id) {
  if (!S.codex[cat]) S.codex[cat] = {};
  if (!S.codex[cat][id]) { S.codex[cat][id] = Date.now(); save(); Bus.emit('codex', { cat, id }); if (cat === 'phrase') stat('phrasesKnown', 0); stat('codexPct', 0); return true; }
  return false;
}
function codexTotals() {
  const tot = { bath: STAGE_ORDER.length, food: FOOD_ORDER.length, phrase: PHRASES.length, act: ACT_ORDER.length, scene: SCENE_ORDER.length, npc: Object.keys(NPCS).length };
  const valid = { bath: STAGES, food: FOODS, phrase: PHRASE, act: ACTS, scene: SCENES, npc: NPCS };
  let a = 0, b = 0;
  for (const k in tot) { b += tot[k]; a += Object.keys(S.codex[k] || {}).filter(id => valid[k][id]).length; }
  return { a, b, pct: Math.round(a / b * 100), tot };
}
function addSweat(n) {
  S.sweat = Math.max(0, Math.min(99999, S.sweat + n));
  if (n > 0) stat('sweatEarned', n);
  if (S.sweat >= 1000) achUnlock('a_rich');
  save(); Bus.emit('sweat', n);
}
function recordScore(mg, score) {
  if (S.weekly.wk !== weekKey()) S.weekly = { wk: weekKey(), s: {} };
  const prevBest = S.best[mg] || 0, prevWeek = S.weekly.s[mg] || 0;
  if (score > prevBest) S.best[mg] = score;
  if (score > prevWeek) S.weekly.s[mg] = score;
  S.mgPlayed[mg] = (S.mgPlayed[mg] || 0) + 1;
  save();
  return { newBest: score > prevBest, newWeek: score > prevWeek };
}

function Grid(w, h, ch) {
  const a = Array.from({ length: h }, () => Array(w).fill(ch));
  const g = {
    w, h, a,
    fill(x, y, ww, hh, c) { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) if (a[j] && i >= 0 && i < w) a[j][i] = c; return g; },
    set(x, y, c) { if (a[y] && x >= 0 && x < w) a[y][x] = c; return g; },
    box(x, y, ww, hh, wall, floor) { g.fill(x, y, ww, hh, wall); g.fill(x + 1, y + 1, ww - 2, hh - 2, floor); return g; },
    rows() { return a.map(r => r.join('')); }
  };
  return g;
}

function buildStageLayer() {

  const wl = (ch, f) => wallCache[ch + f] || (wallCache[ch + f] = tileWall(ch, f));
  for (let ty = 0; ty < World.h; ty++) for (let tx = 0; tx < World.w; tx++) {
    const c = tAt(tx, ty), X = tx * TS, Y = ty * TS;
    if (WATER[c]) { World.water.push({ x: X, y: Y, k: WATER[c] }); lx.drawImage(fl(floorUnder(tx, ty)), X, Y); continue; }
    if (isWallish(c)) { const below = tAt(tx, ty + 1); const front = ty + 1 < World.h && !isWallish(below); lx.drawImage(wl(c === 'Q' ? 'H' : c, front), X, Y); continue; }

      const spr = c === 'E' ? propSprite('B', 1) : propSprite(c, c === 'C' ? ((tx + ty) % 3) : (c === 'A' ? tx % 2 : 0));
      World.props.push({ ch: c, x: X, y: Y + TS, spr, tx, ty });

    const stone = wt.k === 'spring';
    const edge = stone ? '#8E8A82' : wt.k === 'hot' ? C.red : wt.k === 'cold' ? C.blueD : C.blue, edgeL = stone ? '#B9B5AC' : '#FFFFFF';
    const nw = (x, y) => !WATER[tAt(x, y)];

    if (nw(tx, ty + 1)) { rx.fillStyle = edge; rx.fillRect(wt.x, wt.y + TS - 2, TS, 2); }
    if (nw(tx - 1, ty)) { rx.fillStyle = edge; rx.fillRect(wt.x, wt.y, 2, TS); }

  }
}

  if (dy) { const b = blocked(a.x, a.y + dy); if (!b) a.y += dy; else if (b === 'water') hitWater = true; else if (opt.slide && Math.abs(dx) < .01) { for (const off of [3, -3, 6, -6]) if (!blocked(a.x + off, a.y + dy)) { a.x += Math.sign(off) * Math.min(1.5, Math.abs(dy) + .5); break; } } }

  return hitWater;
}
function dirFrom(x, y, cur) {
  if (Math.abs(x) < .01 && Math.abs(y) < .01) return cur;
  return Math.abs(x) > Math.abs(y) * 1.05 ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
}
const DIRV = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };

/* ── 길찾기 ── */
function findPath(sx, sy, tx, ty, allowWater = true, near = 0) {
  const w = World.w, h = World.h, key = (x, y) => y * w + x;
  const prev = new Int32Array(w * h).fill(-1), seen = new Uint8Array(w * h);
  const q = [key(sx, sy)]; seen[q[0]] = 1; let qi = 0, end = -1;
  while (qi < q.length) {
    const k = q[qi++], x = k % w, y = (k / w) | 0;
    if ((near === 0 && x === tx && y === ty) || (near > 0 && Math.max(Math.abs(x - tx), Math.abs(y - ty)) <= near && !(x === tx && y === ty && solidT(x, y)))) { end = k; break; }
    for (const [ddx, ddy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + ddx, ny = y + ddy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const nk = key(nx, ny); if (seen[nk]) continue;
      if (solidT(nx, ny) || tAt(nx, ny) === 'w') continue;
      if (!allowWater && waterT(nx, ny)) continue;
      seen[nk] = 1; prev[nk] = k; q.push(nk);
    }
  }
  if (end < 0) return null;
  const path = []; let k = end;
  while (k !== key(sx, sy) && k >= 0) { path.unshift({ x: (k % w) * TS + 8, y: ((k / w) | 0) * TS + 12 }); k = prev[k]; }
  return path;
}

/* ═══════════ 업데이트 ═══════════ */
function updateWorld(dt) {
  World.t += dt;
  if (World.paused) { updateRemotes(dt); updateParticles(dt); return; }
  updatePlayer(dt);
  World.npcs.forEach(n => updateNpc(n, dt));
  World.bots.forEach(b => updateBot(b, dt));
  updateRemotes(dt); updateParticles(dt);
  updateZones(dt); updateAmbient(dt);
  World.floaters.forEach(f => { f.t -= dt; f.y -= 14 * dt; }); World.floaters = World.floaters.filter(f => f.t > 0);
  updateCamera(dt);
  World.guide = guideTarget();
}
// HUD 에 가리지 않도록 지도 가장자리에 여백을 둔다
function camBounds() {
  const mw = World.w * TS, mh = World.h * TS;
  return { x0: mw <= W ? (mw - W) / 2 : -10, x1: mw <= W ? (mw - W) / 2 : mw - W + 10, y0: mh <= H ? (mh - H) / 2 - 20 : -44, y1: mh <= H ? (mh - H) / 2 : mh - H + 12 };
}
function snapCamera() { const p = World.player, b = camBounds(); World.cam.x = clamp(p.x - W / 2, b.x0, b.x1); World.cam.y = clamp(p.y - 10 - H / 2, b.y0, b.y1); }
function updateCamera(dt) {
  const p = World.player, b = camBounds();
  const tx = clamp(p.x - W / 2, b.x0, b.x1), ty = clamp(p.y - 10 - H / 2, b.y0, b.y1);
  World.cam.x = lerp(World.cam.x, tx, Math.min(1, dt * 8)); World.cam.y = lerp(World.cam.y, ty, Math.min(1, dt * 8));
}

function updatePlayer(dt) {
  const p = World.player;
  World.hotT = Math.max(0, World.hotT - dt);
  if (p.splashT > 0) p.splashT -= dt;
  if (World.busyT > 0) {        // 샤워·안마의자 등 잠깐 멈춤
    World.busyT -= dt; p.moving = false; p.fr = 0;
    if (World.busyKind === 'shower' && Math.random() < .6) spawnPart(p.x + rnd(-6, 6), p.y - 24 + rnd(-2, 2), rnd(-10, 10), rnd(30, 60), '#9AD6F0', .5, 1);
    if (World.busyKind === 'massage' && Math.random() < .2) p.x += Math.sin(World.t * 40) * .3;
    if (World.busyT <= 0) { const k = World.busyKind; World.busyKind = null; if (World.busyDone) { const f = World.busyDone; World.busyDone = null; f(); } }
    return;
  }
  const ax = Input.axis();
  const manual = Math.abs(ax.x) + Math.abs(ax.y) > .05;
  if (manual) { World.path = null; World.goal = null; }
  let mx = ax.x, my = ax.y;
  // 탭 이동
  if (!manual && World.path) {
    const wp = World.path[0];
    if (!wp) { World.path = null; arriveGoal(); }
    else {
      const dx = wp.x - p.x, dy = wp.y - p.y, d = Math.hypot(dx, dy);
      if (d < 2.5) { World.path.shift(); if (!World.path.length) { World.path = null; arriveGoal(); } }
      else { mx = dx / d; my = dy / d; }
    }
  }
  const inWater = waterAtPx(p.x, p.y);
  const spd = 74 * (inWater ? .62 : 1) * (buffOn('speed') ? 1.3 : 1);
  p.moving = Math.abs(mx) + Math.abs(my) > .05;
  if (p.moving) p.dir = dirFrom(mx, my, p.dir);
  const ox = p.x, oy = p.y;
  const noWater = World.st.washRule && !World.washed;
  const hitWater = moveActor(p, mx * spd * dt, my * spd * dt, { noWater, slide: true });
  if (hitWater) { World.path = null; World.goal = null; if (World.washWarnT <= 0) { World.washWarnT = 3; warnShowerFirst(); } }
  World.washWarnT = Math.max(0, World.washWarnT - dt);
  if (World.path && p.moving && Math.abs(p.x - ox) + Math.abs(p.y - oy) < .05) { p.stuckT = (p.stuckT || 0) + dt; if (p.stuckT > .6) { World.path = null; World.goal = null; p.stuckT = 0; } } else p.stuckT = 0;
  // 걸음 수
  p.walkAcc += Math.hypot(p.x - ox, p.y - oy); if (p.walkAcc >= TS * 10) { stat('walk', Math.floor(p.walkAcc / TS)); p.walkAcc %= TS; }
  if (p.moving) { p.animT += dt * (inWater ? 6 : 9); p.fr = Math.floor(p.animT) % 4; } else { p.fr = 0; p.animT = 0; }

  if (Input.hit('alt')) doSplash();
  for (let i = 1; i <= 4; i++) if (Input.hit('e' + i)) { const q = quickEmotes(); if (q[i - 1]) doEmote(p, q[i - 1], true); }
  if (Input.hit('eat')) quickEat();
  World.interact = findInteract();
  if ((Input.hit('use') || Input.hit('act')) && World.interact) doInteract(World.interact);
  else if (Input.hit('act') && !World.interact) doSplash();
  if (p.emote) { p.emote.t -= dt; if (p.emote.t <= 0) p.emote = null; }
  if (p.say) { p.say.t -= dt; if (p.say.t <= 0) p.say = null; }
  Net.sendPos();
}

/* ── 상호작용 ── */
const TILE_USE = {
  S: { k: 'shower', lb: 'wash' }, L: { k: 'locker' }, G: { k: 'scale' }, I: { k: 'mg', mg: 'dryer' }, J: { k: 'mg', mg: 'shoes' },
  V: { k: 'vending' }, F: { k: 'snack' }, M: { k: 'massage' }, A: { k: 'tv' }, O: { k: 'splash' }, W: { k: 'jar' }, X: { k: 'booth' }
};
function tileLabel(o) {
  const n = {
    shower: [T('wash'), ''], locker: [{ en: 'Locker', ko: '사물함' }], scale: [{ en: 'Scale', ko: '체중계' }], vending: [{ en: 'Vending machine', ko: '자판기' }], snack: [{ en: 'Snacks', ko: '간식' }],
    massage: [{ en: 'Massage chair', ko: '안마의자' }], tv: [{ en: 'TV', ko: 'TV' }], splash: [{ en: 'Pour water', ko: '물 끼얹기' }], jar: [{ en: 'Water jar', ko: '물 항아리' }], booth: [{ en: 'Four-cut photo', ko: '네컷 사진관' }]
  }[o.k];
  if (o.k === 'mg') return L(MG_META[o.mg].n);
  return n ? L(n[0]) : '';
}
function findInteract() {
  const p = World.player, st = World.st;
  let best = null, bd = 26;
  const want = wantedActs();
  const consider = (o, x, y, rng = 26) => {
    let d = dist(p.x, p.y, x, y); if (d >= rng) return;
    const key = o.k === 'mg' ? 'mg:' + o.mg : o.k === 'npc' ? 'npc:' + o.a.npc : o.k === 'view' ? o.v.act : o.k === 'shower' ? 'shower' : o.k;
    if (want.has(key)) d -= 14;
    d -= (o.pri || 0);
    if (d < bd) { bd = d; best = Object.assign(o, { ax: x, ay: y }); }
  };
  World.npcs.forEach(n => consider({ k: 'npc', a: n, label: T('talk'), name: n.name }, n.x, n.y, 30));
  st.stations.forEach(s => consider({ k: 'mg', mg: s.mg, x: s.x, y: s.y, label: T('play'), name: L(MG_META[s.mg].n) }, s.x, s.y, 24));
  (st.views || []).forEach(v => consider({ k: 'view', v, label: T('look'), name: L(ACTS[v.act].n) }, v.x, v.y, 22));
  if (st.booth) consider({ k: 'booth', label: '', name: L({ en: 'Four-cut photo', ko: '네컷 사진관' }) }, st.booth.x, st.booth.y, 22);
  consider({ k: 'exit', label: T('exit_door'), name: T('map') }, st.exit.x, st.exit.y, 22);
  World.bots.forEach(b => consider({ k: 'bot', a: b, label: '', name: b.name, pri: -6 }, b.x, b.y, 20));
  const tx = Math.floor(p.x / TS), ty = Math.floor((p.y - 2) / TS);
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const c = tAt(tx + dx, ty + dy), u = TILE_USE[c]; if (!u) continue;
    const ox = (tx + dx) * TS + 8, oy = (ty + dy) * TS + 12;
    consider(Object.assign({ tx: tx + dx, ty: ty + dy, tile: c, label: '', name: '' }, u), ox, oy, 22);
  }
  if (best && best.tile) { best.name = tileLabel(best); best.label = best.k === 'mg' ? T('play') : ''; }
  return best;
}
// 진행 중인 미션이 기다리는 체험 (가까운 후보 중 이것을 먼저 고른다)
function wantedActs() {
  const w = new Set();
  Prog.active().forEach(m => { const st = Prog.current(m.id); if (st && m.stage === World.st.id) { if (st.o.t === 'act') w.add(st.o.id); if (st.o.t === 'mg') w.add('mg:' + st.o.id); if (st.o.t === 'talk') w.add('npc:' + st.o.npc); } });
  return w;
}
function doInteract(o) {

    case 'scale': busy('scale', 1.2, () => { UI.toast(T('scale_msg') + ' ' + L(pick(SCALE_LINES))); Prog.act('scale'); Prog.scene('sc_scale'); }); break;
    case 'vending': UI.openPanel('shop', { kind: 'vending' }); break;
    case 'snack': UI.openPanel('shop', { kind: 'snack' }); break;
    case 'massage': p.dir = 'down'; SND.sfx('shiver'); busy('massage', 2.4, () => { UI.toast(T('massage_msg')); Prog.act('massage'); Prog.scene('sc_massage'); }); p.emote = { id: 'zzz', t: 2.4 }; break;
    case 'tv': busy('tv', 1.6, () => { UI.toast(T('tv_msg') + ' ' + L(pick(TV_LINES))); Prog.act('tv'); }); break;
    case 'splash': doSplash(); break;

function faceTo(a, b) { a.dir = dirFrom(b.x - a.x, b.y - a.y, a.dir); }

// 탭으로 이동·상호작용
function tapWorld(lx, ly) {
  if (!World.player || World.paused || World.busyT > 0) return;
  const wx = lx + World.cam.x, wy = ly + World.cam.y, p = World.player;
  // 누른 곳 근처의 상호작용 대상
  let it = null, bd = 18;
  const cands = [];
  World.npcs.forEach(n => cands.push({ o: { k: 'npc', a: n }, x: n.x, y: n.y - 10 }));
  World.bots.forEach(b => cands.push({ o: { k: 'bot', a: b }, x: b.x, y: b.y - 10 }));
  World.st.stations.forEach(s => cands.push({ o: { k: 'mg', mg: s.mg }, x: s.x, y: s.y - 6 }));
  (World.st.views || []).forEach(v => cands.push({ o: { k: 'view', v }, x: v.x, y: v.y - 6 }));
  if (World.st.booth) cands.push({ o: { k: 'booth' }, x: World.st.booth.x, y: World.st.booth.y - 10 });
  const ttx = Math.floor(wx / TS), tty = Math.floor(wy / TS);
  for (let dy = 0; dy <= 1; dy++) { const c = tAt(ttx, tty + dy), u = TILE_USE[c]; if (u) { cands.push({ o: Object.assign({ tx: ttx, ty: tty + dy, tile: c }, u), x: ttx * TS + 8, y: (tty + dy) * TS + 8, tile: true }); break; } }
  cands.forEach(c => { const d = dist(wx, wy, c.x, c.y) - (c.tile ? 6 : 0); if (d < bd) { bd = d; it = c; } });
  const allowWater = !World.st.washRule || World.washed;
  const sx = Math.floor(p.x / TS), sy = Math.floor(p.y / TS);
  let path, target;
  if (it) {
    const tx = Math.floor(it.x / TS), ty = Math.floor((it.y + 6) / TS);
    target = it;
    if (dist(p.x, p.y, it.x, it.y + 6) < 24) { World.path = null; const o = findInteract(); if (o) doInteract(o); return; }
    path = findPath(sx, sy, tx, ty, allowWater, 1);
  } else {
    if (solidT(ttx, tty)) return;
    path = findPath(sx, sy, ttx, tty, allowWater);
  }
  if (!path) { if (!allowWater && waterT(ttx, tty)) warnShowerFirst(); return; }
  World.path = path; World.goal = { x: it ? it.x : ttx * TS + 8, y: it ? it.y + 6 : tty * TS + 12, it: it ? it.o : null };
}
function arriveGoal() {
  const g = World.goal; World.goal = null; if (!g || !g.it) return;
  const o = findInteract();
  if (o && (o.k === g.it.k)) doInteract(o);
}

/* ── NPC / 손님 ── */
function updateNpc(n, dt) {
  n.animT += dt;
  if (n.emote) { n.emote.t -= dt; if (n.emote.t <= 0) n.emote = null; }
  if (n.say) { n.say.t -= dt; if (n.say.t <= 0) n.say = null; }
  const p = World.player;
  if (dist(n.x, n.y, p.x, p.y) < 60) faceTo(n, p); else if (Math.random() < dt * .1) n.dir = pick(['down', 'left', 'right']);
}
function updateBot(b, dt) {
  b.t -= dt;
  if (b.emote) { b.emote.t -= dt; if (b.emote.t <= 0) b.emote = null; }
  if (b.say) { b.say.t -= dt; if (b.say.t <= 0) b.say = null; }
  if (b.react) { b.react.t -= dt; if (b.react.t <= 0) { const r = b.react; b.react = null; if (r.emote) doEmote(b, r.emote); if (r.phrase) doSay(b, r.phrase); } }
  if (b.ai === 'walk' && b.path && b.path.length) {
    const tgt = b.path[0], dx = tgt.x - b.x, dy = tgt.y - b.y, d = Math.hypot(dx, dy);
    const sp = 42 * (waterAtPx(b.x, b.y) ? .6 : 1) * dt;
    if (d < 2) { b.path.shift(); if (!b.path.length) { b.ai = waterAtPx(b.x, b.y) ? 'soak' : 'idle'; b.t = waterAtPx(b.x, b.y) ? rnd(6, 12) : rnd(1.5, 4); } }
    else { const ox = b.x, oy = b.y; moveActor(b, dx / d * Math.min(sp, d), dy / d * Math.min(sp, d), { slide: true }); b.dir = dirFrom(dx, dy, b.dir); b.moving = true; b.animT += dt * 8; b.fr = Math.floor(b.animT) % 4; if (Math.abs(b.x - ox) + Math.abs(b.y - oy) < .01) { b.stuck = (b.stuck || 0) + dt; if (b.stuck > 1) { b.path = null; b.ai = 'idle'; b.t = 1; b.stuck = 0; } } }
    return;
  }
  b.moving = false; b.fr = 0;
  if (b.t > 0) return;
  const r = Math.random();
  if (b.ai === 'chat') b.ai = 'idle';
  if (r < .55) {
    const tgt = randomFloor(t => Math.abs(t.x - b.x / TS) + Math.abs(t.y - b.y / TS) < 16);
    if (tgt) { const path = findPath(Math.floor(b.x / TS), Math.floor(b.y / TS), tgt.tx, tgt.ty); if (path && path.length) { b.path = path; b.ai = 'walk'; return; } }
    b.t = 1;
  } else if (r < .72) { doEmote(b, pick(EMOTES).id); b.t = rnd(2, 4); }
  else if (r < .84) { doSay(b, pick(['p1', 'p2', 'p9', 'p10', 'p11', 'p13', 'p15', 'p23', 'p24', 'p26', 'p28', 'p30'])); b.t = rnd(3, 5); }
  else { b.dir = pick(['down', 'left', 'right', 'up']); b.t = rnd(1.5, 4); }
}
function doEmote(a, id, mine) {
  if (!EMOTE[id]) return;
  a.emote = { id, t: 2.6 };
  if (mine) { SND.sfx('pop'); Net.sendEmote(id); botsReact(a, { emote: id }); stat('emote'); Prog.event('emote', { id }); }
}
function doSay(a, pid, mine) {
  const ph = PHRASE[pid]; if (!ph) return;
  a.say = { ko: ph.ko, en: ph.en, t: 4.2 };

    else if (it.tile) { ay = it.ty * TS - 4; }
    const [x, y] = P(ax, ay);
    const key = Input.touchMode ? '' : 'E  ';
    const label = key + (it.label ? it.label + (it.name ? ' · ' : '') : '') + (it.name || '');
    tx.font = fpx(12); const w = tx.measureText(label).width + 16;
    const bx = Math.round(x - w / 2), by = Math.round(y - 22);
    tx.fillStyle = '#1B1A18'; tx.fillRect(bx - 1, by - 1, w + 2, 22);
    tx.fillStyle = '#1E6E9C'; tx.fillRect(bx, by, w, 20);
    tx.fillStyle = '#FFFFFF'; tx.fillText(label, x, by + 14);
  }
  World.floaters.forEach(f => {
    const [x, y] = P(f.x, f.y); tx.globalAlpha = Math.min(1, f.t * 2);
    tx.font = fpx(12); tx.lineWidth = 3; tx.strokeStyle = '#1B1A18'; tx.strokeText(f.text, x, y); tx.fillStyle = f.col; tx.fillText(f.text, x, y);

/* ─────────────────────────────────────────────
   progress: 경험치·레벨, 미션, 오늘의 미션, 업적, 칭호, 문화 체험, 명장면, 의상 일기
   ───────────────────────────────────────────── */

const GRADE_RANK = { C: 1, B: 2, A: 3, S: 4 };
const LOCAL_EV = new Set(['talk', 'act', 'soak', 'sec', 'greet']);   // 그 탕 안에서 해야 인정

/* ── 통계 ── */
function stat(key, inc = 1) {
  if (!S) return;
  if (inc) S.stats[key] = (S.stats[key] || 0) + inc;
  Prog.checkAch(key);
  Prog.checkDaily();
  if (inc) Prog.checkCnt(key);
  save();
}
function statValue(key) {
  switch (key) {
    case 'foodKinds': return Object.keys(S.codex.food).filter(f => FOODS[f]).length;
    case 'mgKinds': return Object.keys(S.mgPlayed).length;
    case 'level': return S.lv;
    case 'stamps': return S.stamps.length;
    case 'codexPct': return codexTotals().pct;
    case 'days': return S.days.length;
    case 'costumes': return costumeCount();
    case 'scenes': return Object.keys(S.scenes).length;
    case 'phrasesKnown': return Object.keys(S.codex.phrase).filter(p => PHRASE[p]).length;
    case 'acts': return Object.keys(S.acts).filter(a => ACTS[a]).length;
    default: return S.stats[key] || 0;
  }
}

/* ── 버프 (음식) ── */
function buffOn(name) { return S && S.buffs && S.buffs[name] > Date.now(); }
function addBuff(name, sec) { S.buffs = S.buffs || {}; S.buffs[name] = Date.now() + sec * 1000; save(); Bus.emit('buff', name); }

/* ── 경험치·레벨 ── */
function gainXP(n, quiet) {
  if (!S || n <= 0) return 0;
  if (buffOn('full')) n = Math.round(n * 1.2);
  S.xp += n; S.xpTotal = (S.xpTotal || 0) + n;
  if (!quiet && World.player) addFloater(World.player.x, World.player.y - 34, T('xp_gain', { n }), '#9BE3D6');
  while (S.lv < MAX_LV && S.xp >= xpNeed(S.lv)) { S.xp -= xpNeed(S.lv); levelUp(); }
  if (S.lv >= MAX_LV) S.xp = Math.min(S.xp, xpNeed(MAX_LV));
  save(); Bus.emit('xp', n);
  return n;
}
function levelUp() {
  S.lv++;
  const got = [];
  addSweat(S.lv * 10);
  (LV_REWARD[S.lv] || []).forEach(r => {
    if (r[0] === 'emote' && !S.emotes.includes(r[1])) { S.emotes.push(r[1]); got.push({ k: 'emote', id: r[1] }); }
    if (r[0] === 'costume' && unlockCostume(r[1], r[2])) got.push({ k: 'costume', slot: r[1], id: r[2] });
    if (r[0] === 'title' && Prog.addTitle(r[1], true)) got.push({ k: 'title', id: r[1] });
  });
  STAGE_ORDER.forEach(id => { if (STAGES[id].lv === S.lv && stageUnlocked(id)) got.push({ k: 'stage', id }); });
  if (S.lv % 5 === 0) Prog.remember({ lv: S.lv }, true);
  SND.sfx('unlock');
  Bus.emit('levelup', { lv: S.lv, got });
  setTimeout(() => stat('level', 0), 10);
}

/* ═══════════ 진행 엔진 ═══════════ */
const Prog = {
  lastAct: {}, eggT: -99,

  init() {
    this.rollDaily();
    // 시간대 업적
    const h = new Date().getHours();

    stat('days', 0);
  },

  /* ── 문화 체험 ── */
  act(id, extra) {
    const now = performance.now() / 1000;
    if (ACTS[id] && !S.acts[id]) {
      S.acts[id] = dayKey(); codexAdd('act', id);
      gainXP(25); UI.toast(T('act_first', { name: L(ACTS[id].n) }), 'good');
      stat('acts', 0);
    } else if (!this.lastAct[id] || now - this.lastAct[id] > 20) gainXP(2, true);

  },

  },

    save();

  },
