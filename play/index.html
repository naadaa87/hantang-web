  setTimeout(() => {
    gainXP(rw.xp, true); addSweat(rw.sweat);
    if (a.title) Prog.addTitle(a.title, true);
    UI.achToast(a);
  }, 300);

}
// 미니게임 특수 업적
function checkMgAch(id, score, grade) {
  if (id === 'cold' && score >= 600) achUnlock('a_cold60');
  if (id === 'egg' && score >= 1200) achUnlock('a_egg8');
  if (id === 'sleep' && score >= 1700) achUnlock('a_silent');
  if (id === 'milk' && grade === 'S') achUnlock('a_milkS');
  const titleFor = { scrub: 't_seshin', towel: 't_lamb', egg: 't_egg', sikhye: 't_sikhye', sleep: 't_ninja', milk: 't_milk' };

}
function checkOutfitAch() {

}

/* ─────────────────────────────────────────────
   minigames: 미니게임 16종
   각 게임: init() update(dt) draw(ctx) text(tx,k) → this.done = {score}

const GRADE_PTS = { S: 4, A: 3, B: 2, C: 1 };
const BIG = {};   // 확대 스프라이트 캐시
function big(key, c, k) { const kk = key + '@' + k; return BIG[kk] || (BIG[kk] = scaleCanvas(c, k)); }
const tap = () => Input.hit('act') || Input.pointer.clicked || Input.hit('use');
const hold = () => Input.held('act') || Input.pointer.down || Input.held('use');

function T2(tx, k, s, x, y, o = {}) {           // 글자층 텍스트
  const size = o.size || 12;
  tx.font = (o.bold ? 'bold ' : '') + size + 'px ' + (size >= 15 ? 'Galmuri14, Galmuri11' : 'Galmuri11') + ', sans-serif';
  tx.textAlign = o.align || 'center'; tx.textBaseline = 'middle';
  if (o.stroke !== false) { tx.lineWidth = o.lw || 3; tx.strokeStyle = o.sc || 'rgba(27,26,24,.9)'; tx.strokeText(s, x * k, y * k); }
  tx.fillStyle = o.col || '#FFFFFF'; tx.fillText(s, x * k, y * k);
}
function panel(ctx, x, y, w, h, fill = '#FFFFFF', bd = OUT) {
  ctx.fillStyle = bd; ctx.fillRect(x + 2, y, w - 4, h); ctx.fillRect(x, y + 2, w, h - 4);
  ctx.fillStyle = fill; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
}
function tileBG(ctx, col1 = '#F7F9FA', col2 = '#D7E2EA', s = 12) {
  ctx.fillStyle = col1; ctx.fillRect(0, 0, W, H); ctx.fillStyle = col2;
  for (let x = 0; x < W; x += s) ctx.fillRect(x, 0, 1, H); for (let y = 0; y < H; y += s) ctx.fillRect(0, y, W, 1);
}
function meter(ctx, x, y, w, h, v, col, bg = '#3A3835') { ctx.fillStyle = OUT; ctx.fillRect(x - 1, y - 1, w + 2, h + 2); ctx.fillStyle = bg; ctx.fillRect(x, y, w, h); ctx.fillStyle = col; ctx.fillRect(x, y, Math.round(w * clamp(v, 0, 1)), h); }


// 등 그리기 (뒷모습, 수건 두른 허리)
function drawBack(ctx, cx, top, skin, hair, spots, towel = '#F4F4EE') {
  const sk = skin, skS = shade(skin, -.12), skL = shade(skin, .12);
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.ellipse(cx, top + 66, 80, 26, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 70, top + 64, 140, 92);
  ctx.beginPath(); ctx.ellipse(cx, top + 22, 31, 27, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sk;
  ctx.beginPath(); ctx.ellipse(cx, top + 66, 78, 24, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 68, top + 64, 136, 90);
  ctx.fillRect(cx - 12, top + 36, 24, 16);
  ctx.fillStyle = skS; ctx.fillRect(cx - 2, top + 56, 4, 92);
  ctx.fillRect(cx - 50, top + 70, 22, 3); ctx.fillRect(cx + 28, top + 70, 22, 3);
  ctx.fillRect(cx - 68, top + 64, 4, 90); ctx.fillRect(cx + 64, top + 64, 4, 90);
  ctx.fillStyle = skL; ctx.fillRect(cx - 56, top + 50, 30, 4); ctx.fillRect(cx + 26, top + 50, 30, 4);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(cx, top + 22, 29, 25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(hair, .2); ctx.fillRect(cx - 14, top + 6, 10, 3);
  (spots || []).forEach(g => { ctx.fillStyle = 'rgba(122,108,90,.6)'; ctx.fillRect(cx + g.x | 0, top + 100 + g.y | 0, g.r | 0, (g.r * .7) | 0); });
  ctx.fillStyle = OUT; ctx.fillRect(cx - 72, top + 146, 144, 18);
  ctx.fillStyle = towel; ctx.fillRect(cx - 70, top + 148, 140, 14);
  ctx.fillStyle = shade(towel, -.12); for (let i = -66; i < 70; i += 8) ctx.fillRect(cx + i, top + 148, 1, 14);
}

const MINI = {};

/* 1. 때밀기 리듬 ─────────────────────── */
MINI.scrub = {
  controls: 'tap', grade: s => s.acc >= 92 ? 'S' : s.acc >= 80 ? 'A' : s.acc >= 60 ? 'B' : 'C',
  init() {
    this.bpm = 104; this.beat = 60 / this.bpm; this.t = -1.6; this.speed = 170; this.hitX = 92;
    const notes = []; const R = seeded('scrub' + Math.floor(Math.random() * 9999));
    let b = 2;
    while (b < 46) {
      const r = R();
      if (r < .12 && b < 42) { notes.push({ t: b * this.beat, hold: this.beat * 2 }); b += 3; }
      else if (r < .32) { notes.push({ t: b * this.beat }); notes.push({ t: (b + .5) * this.beat }); b += 1; }
      else if (r < .42) { b += 1; }
      else { notes.push({ t: b * this.beat }); b += 1; }
    }
    this.notes = notes; this.total = notes.length; this.score = 0; this.combo = 0; this.maxCombo = 0; this.judged = 0; this.hitPts = 0;
    this.pops = []; this.lastBeat = -1; this.end = (b + 2) * this.beat; this.grime = 40; this.wipe = 0;
    this.grimeSpots = Array.from({ length: 40 }, () => ({ x: rnd(-60, 56), y: rnd(-40, 40), r: rnd(3, 7) }));
  },
  judge(n, q) {
    n.done = true; this.judged++;
    const pts = q === 'P' ? 100 : q === 'G' ? 60 : 0;
    if (q === 'M') { this.combo = 0; SND.sfx('miss'); }
    else { this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo); SND.sfx(q === 'P' ? 'perfect' : 'good'); this.wipe = .15; this.grime = Math.max(0, this.grime - 40 / this.total); this.grimeSpots.pop(); for (let i = 0; i < 6; i++) spawnMGPart(this, rnd(170, 310), rnd(80, 160), rnd(-80, 80), rnd(-90, -20), pick(['#9C8E7A', '#7E705C', '#BDB2A0'])); }
    this.hitPts += q === 'P' ? 1 : q === 'G' ? .6 : 0;
    this.score += Math.round(pts * (1 + Math.min(.5, this.combo * .01)));
    this.pops.push({ q, t: .6 });
  },
  update(dt) {
    this.t += dt; this.wipe = Math.max(0, this.wipe - dt);
    const bi = Math.floor(this.t / this.beat);
    if (bi !== this.lastBeat && this.t >= 0) { this.lastBeat = bi; SND.sfx(bi % 2 ? 'snare' : 'kick'); if (bi % 2 === 0) SND.sfx('hat'); }
    const press = tap();
    let used = false;
    for (const n of this.notes) {
      if (n.done) continue;
      const d = this.t - n.t;
      if (n.holding) {
        if (!hold()) { n.holding = false; n.done = true; this.judged++; if (this.t < n.t + n.hold - .12) { this.combo = 0; this.pops.push({ q: 'M', t: .6 }); SND.sfx('miss'); } else { this.score += 50; this.hitPts += 1; } }
        else if (this.t >= n.t + n.hold) { n.holding = false; n.done = true; this.judged++; this.score += 50; this.hitPts += 1; SND.sfx('perfect'); this.pops.push({ q: 'P', t: .6 }); }
        else if (Math.random() < .3) spawnMGPart(this, rnd(170, 310), rnd(80, 160), rnd(-60, 60), rnd(-60, -10), '#9C8E7A');
        continue;
      }
      if (d > .16) { this.judge(n, 'M'); if (n.hold) { n.done = true; this.judged++; } continue; }
      if (press && !used && Math.abs(d) <= .16) {
        used = true; const q = Math.abs(d) < .07 ? 'P' : 'G';
        this.judge(n, q);
        if (n.hold) { n.done = false; n.holding = true; this.judged--; }
      }
    }
    if (press && !used) { this.combo = 0; }
    this.pops.forEach(p => p.t -= dt); this.pops = this.pops.filter(p => p.t > 0);
    updateMGParts(this, dt);
    if (this.t > this.end) {
      const acc = Math.round(this.hitPts / (this.total + this.notes.filter(n => n.hold).length) * 100);
      this.done = { score: this.score, acc, extra: { combo: this.maxCombo } };
    }
  },
  draw(ctx) {
    tileBG(ctx);
    ctx.fillStyle = '#C8D4DC'; ctx.fillRect(0, 190, W, 80);
    // 세신 침대 + 등
    ctx.fillStyle = OUT; ctx.fillRect(138, 26, 204, 170); ctx.fillStyle = '#E9EEF2'; ctx.fillRect(140, 28, 200, 166); ctx.fillStyle = '#5DA7D6'; ctx.fillRect(146, 34, 188, 154);
    drawBack(ctx, 240, 22, this.skin || (this.skin = pick([C.skin1, C.skin2, C.skin3])), this.hair || (this.hair = pick(['#2B2522', '#6B4630', '#B9B6B0'])), this.grimeSpots);
    if (this.wipe > 0) { ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(170, 70, 140, 100); }
    // 박씨
    const park = getChar(NPCS.park.look); const pk = big('park', park.left[Math.floor(this.t * 4) % 2 ? 1 : 0], 3);
    ctx.drawImage(pk, 356, 60);
    // 레인
    panel(ctx, 6, 202, W - 12, 52, '#1B2A36', OUT);
    ctx.fillStyle = '#25394A'; ctx.fillRect(10, 222, W - 20, 12);
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    for (let b = Math.ceil(this.t / this.beat); b < (this.t + 3) / this.beat; b++) { const x = this.hitX + (b * this.beat - this.t) * this.speed; if (x < W) ctx.fillRect(x | 0, 208, 1, 40); }
    // 히트 지점
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(this.hitX, 228, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#25394A'; ctx.beginPath(); ctx.arc(this.hitX, 228, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = LOOK.scrub[S.costume.scrub]; ctx.fillRect(this.hitX - 6, 222, 12, 12);
    for (const n of this.notes) {
      if (n.done && !n.holding) continue;
      const x = this.hitX + (n.t - this.t) * this.speed;
      if (n.hold) { const x2 = this.hitX + (n.t + n.hold - this.t) * this.speed; ctx.fillStyle = n.holding ? C.gold : '#E0B85A'; ctx.fillRect(Math.max(this.hitX, x) | 0, 223, Math.max(0, x2 - Math.max(this.hitX, x)) | 0, 10); }
      if (x > W + 12 || (n.holding)) continue;
      ctx.fillStyle = OUT; ctx.fillRect(x - 8 | 0, 220, 16, 16); ctx.fillStyle = n.hold ? C.gold : '#2FA35E'; ctx.fillRect(x - 7 | 0, 221, 14, 14); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(x - 5 | 0, 223, 4, 2);
    }
    drawMGParts(this, ctx);
  },
  text(tx, k) {
    T2(tx, k, this.score + '', W - 16, 18, { align: 'right', size: 24, col: '#FFE27A' });
    if (this.combo > 2) T2(tx, k, this.combo + ' COMBO', W - 16, 40, { align: 'right', size: 12, col: '#FFFFFF' });
    this.pops.forEach(p => T2(tx, k, p.q === 'P' ? 'PERFECT' : p.q === 'G' ? 'GOOD' : 'MISS', this.hitX, 196 - (.6 - p.t) * 20, { size: 12, col: p.q === 'P' ? '#FFE27A' : p.q === 'G' ? '#9BE3D6' : '#E26A55' }));
    if (this.t < 0) T2(tx, k, Math.ceil(-this.t) + '', W / 2, 120, { size: 24, col: '#FFFFFF' });
  }
};

/* 2. 냉탕 버티기 ─────────────────────── */
MINI.cold = {
  controls: 'tap', unit: 's', grade: s => s.score >= 600 ? 'S' : s.score >= 400 ? 'A' : s.score >= 250 ? 'B' : 'C',
  init() {
    this.t = 0; this.pos = .3; this.vel = 0; this.zone = .5; this.zv = 0; this.zs = .26; this.shiver = 0; this.over = 0; this.frost = [];
    this.noiseT = 0; this.zt = .5;
  },
  update(dt) {
    if (this.over) { this.over -= dt; if (this.over <= 0) this.done = { score: Math.round(this.t * 10) }; return; }
    this.t += dt;
    const diff = Math.min(1, this.t / 70);

  draw(ctx) {

/* 9. 수면실 자리 찾기 ─────────────────── */

      if (nx === this.gx && ny === this.gy) { const pts = 300 + Math.max(0, Math.round(300 - this.t * 15)) - Math.round(this.noise); this.score += Math.max(100, pts); this.pts = Math.max(100, pts); this.state = 'res'; this.rt = 1.3; this.q = 'ok'; SND.sfx('perfect'); }

  draw(ctx) {

      else { this.q = 'bad'; this.pts = 0; SND.sfx('fail'); }
      this.state = 'res'; this.rt = 1.8;
    } else if (this.time <= 0) { this.q = 'late'; this.picked = -1; this.state = 'res'; this.rt = 1.8; SND.sfx('miss'); }
  },
  draw(ctx) {
    tileBG(ctx, '#F7F9FA', '#E3EBF0', 16);
    panel(ctx, 20, 14, 440, 100, '#FFFFFF'); ctx.fillStyle = C.blue; ctx.fillRect(22, 16, 6, 96);
    meter(ctx, 40, 102, 400, 4, this.time / 10, this.time < 3 ? C.red : C.blue);
    const q = this.qs[this.i];
    q.opts.forEach((o, i) => {
      const r = this.rect(i); let col = '#FFFFFF';
      if (this.state === 'res') { if (o.id === q.p.id) col = '#C9EED6'; else if (i === this.picked) col = '#F6D4CC'; }
      panel(ctx, r.x, r.y, r.w, r.h, col);
      if (i === this.cur && !Input.touchMode && this.state === 'ask') { ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); }
      ctx.fillStyle = C.blue; ctx.fillRect(r.x + 6, r.y + 6, 12, 12);
    });
    const ch = getChar(NPCS.mia.look); ctx.drawImage(big('miaQ', ch.down[0], 2), 420, 40);
  },
  text(tx, k) {
    const q = this.qs[this.i], p = q.p;

    T2(tx, k, this.score + '', 408, 28, { align: 'right', size: 15, col: '#1E6E9C', stroke: false });
    if (q.type === 'ko') {
      T2(tx, k, p.ko, 220, 58, { size: 24, col: '#1B1A18', stroke: false });
      T2(tx, k, this.state === 'res' ? p.ro : (LANG === 'ko' ? '무슨 뜻일까요?' : 'What does it mean?'), 220, 86, { size: 12, col: '#1E6E9C', stroke: false });
    } else {
      T2(tx, k, '"' + p.en + '"', 220, 56, { size: 15, col: '#1B1A18', stroke: false });
      T2(tx, k, this.state === 'res' ? p.ko + ' · ' + p.ro : (LANG === 'ko' ? '한국어로 뭐라고 할까요?' : 'How do you say it in Korean?'), 220, 84, { size: 12, col: '#1E6E9C', stroke: false });
    }
    q.opts.forEach((o, i) => {
      const r = this.rect(i); T2(tx, k, String(i + 1), r.x + 12, r.y + 12, { size: 12, col: '#FFFFFF', stroke: false });
      if (q.type === 'ko') T2(tx, k, o.en, r.x + r.w / 2 + 6, r.y + r.h / 2, { size: 12, col: '#1B1A18', stroke: false });
      else { T2(tx, k, o.ko, r.x + r.w / 2 + 6, r.y + r.h / 2 - 7, { size: 15, col: '#1B1A18', stroke: false }); T2(tx, k, o.ro, r.x + r.w / 2 + 6, r.y + r.h / 2 + 12, { size: 12, col: '#6E6B66', stroke: false }); }
    });
    if (this.state === 'res') T2(tx, k, this.q === 'ok' ? (LANG === 'ko' ? '정답! +' : 'Correct! +') + this.pts : this.q === 'late' ? (LANG === 'ko' ? '시간 초과' : 'Time\'s up') : (LANG === 'ko' ? '아쉬워요' : 'Not quite'), 240, 118, { size: 12, col: this.q === 'ok' ? '#1F9D57' : '#C13A2A', stroke: false });
  }
};

/* ── 미니게임 공용 파티클 ── */
function spawnMGPart(g, x, y, vx, vy, col) { (g.parts = g.parts || []).push({ x, y, vx, vy, col, t: rnd(.4, .8) }); if (g.parts.length > 200) g.parts.shift(); }
function updateMGParts(g, dt) { if (!g.parts) return; g.parts.forEach(p => { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; }); g.parts = g.parts.filter(p => p.t > 0); }
function drawMGParts(g, ctx) { if (!g.parts) return; g.parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x | 0, p.y | 0, 2, 2); }); ctx.globalAlpha = 1; }

/* ═══════════ 미니게임 진행 관리 ═══════════ */
// 처음 해보면 열리는 명장면, 함께 기록되는 목욕 문화
const MG_SCENE = { scrub: 'sc_seshin', dryer: 'sc_dryer', sleep: 'sc_sleeproom', towel: 'sc_lambtowel', egg: 'sc_eggcrack', back: 'sc_backscrub' };
const MG_ACT = { scrub: 'seshin', milk: 'banana', dryer: 'dryer', shoes: 'shoes', sleep: 'sleep' };
const MG_XP = { S: 60, A: 45, B: 30, C: 20 }, MG_SWEAT = { S: 40, A: 28, B: 18, C: 10 };
const MG = {
  cur: null,
  start(id, opts = {}) {
    if (!MINI[id]) return;
    const g = Object.create(MINI[id]); g.id = id; g.parts = [];
    this.cur = { id, g, opts, state: 'intro' };
    World.paused = true; World.path = null;
    UI.mgIntro(id, opts);
  },
  begin() {
    const c = this.cur; if (!c || c.state !== 'intro') return;
    c.g.init(); c.state = 'play'; Input.clear();
    if (c.id === 'scrub' || c.id === 'sleep') SND.stop(); else SND.play('mg');
    UI.mgPlay(c.id);
  },
  update(dt) {
    const c = this.cur; if (!c || c.state !== 'play') return;
    c.g.update(Math.min(dt, .05));
    if (c.g.done) this.finish(c.g.done);
  },
  finish(res) {
    const c = this.cur; c.state = 'result'; SND.pour(false);
    const id = c.id, meta = MG_META[id], grade = c.g.grade(res);
    const first = !S.mgPlayed[id];
    const rec = recordScore(id, res.score);
    const prev = S.mgBestGrade[id];
    if (!prev || GRADE_RANK[grade] > GRADE_RANK[prev]) S.mgBestGrade[id] = grade;
    let sweat = MG_SWEAT[grade], xp = MG_XP[grade] + (first ? 40 : 0);
    if (buffOn('focus')) { sweat = Math.round(sweat * 1.1); xp = Math.round(xp * 1.1); }
    addSweat(sweat);
    const gx = gainXP(xp, true);
    codexAdd('phrase', meta.phrase);
    (res.learned || []).forEach(p => codexAdd('phrase', p));
    stat('mgPlays'); stat('mg_' + id); if (grade === 'S') stat('mgS'); if (grade === 'S' || grade === 'A') stat('mgA'); stat('mgKinds', 0);
    if (MG_ACT[id]) Prog.act(MG_ACT[id]);
    checkMgAch(id, res.score, grade);
    Prog.event('mg', { id, grade, score: res.score });
    Net.submitScore(id, res.score);
    Net.submitScore('level', S.lv); Net.submitScore('stamps', stampCount()); Net.submitScore('codex', codexTotals().pct);
    c.result = { score: res.score, grade, sweat, xp: gx, newBest: rec.newBest, first, up: !prev || GRADE_RANK[grade] > GRADE_RANK[prev], learned: res.learned || [] };
    if (MG_SCENE[id] && !S.scenes[MG_SCENE[id]]) c.scene = MG_SCENE[id];
    save();
    UI.mgResult(id, c.result, c.opts);
    if (World.st) SND.play(World.st.music);
  },
  close() {
    const sc = this.cur && this.cur.scene;
    this.cur = null; World.paused = false; Input.clear(); UI.mgClose();
    if (sc) setTimeout(() => Prog.scene(sc), 150);
  },
  render(ctx) { const c = this.cur; if (!c || c.state === 'intro' || !c.g.draw) return false; try { c.g.draw(ctx); } catch (e) { console.error(e); return false; } return true; },
  renderText(tx, k) { const c = this.cur; if (!c || c.state !== 'play' || !c.g.text) return; c.g.text(tx, k); }
};
function fmtScore(id, v) { return MG_META[id] && MG_META[id].unit === 's' ? (v / 10).toFixed(1) + 's' : String(v); }

/* ─────────────────────────────────────────────
   ui: HUD, 대화, 패널(미션·지도·코스튬·앨범·회원증·도감·업적·랭킹·설정),

const UI = {

  busy() { return !!(this.panel || this.dlg || MG.cur || !$('#title').hidden); },

  /* ── HUD ── */

  sceneReveal(id, first) {

  viewScene(id, first, back) {
    if (MG.cur) return;
    if (this.dlg) this.closeDialog();
    const rec = S.scenes[id]; if (!rec) return;
    const meta = SCENES[id];
    const then = unpackLook(rec.l), now = playerLook();
    const same = lookKey(then) === lookKey(Object.assign(unpackLook(packLook(now))));
    let look = first ? now : then, useNow = !!first;
    this.panel = 'scene'; World.paused = true; World.path = null; Input.clear();
    if (first) { S.flags.newScene = 1; save(); SND.sfx('unlock'); }
    const head = first ? `<span class="badge gold">${T('scene_new')}</span> ` : '';
    this.sheetEl.innerHTML = this.card(L(meta.n), `<div class="scbox"><canvas id="scCv" width="1024" height="576"></canvas></div>
      <div class="row sccap">${head}<b class="nb">${esc(meta.n.ko)}</b><span class="muted">${esc(meta.n.en)} · ${rec.d}</span></div>
      <p class="muted" style="margin:4px 0 8px">${esc(L(meta.how))}</p>
      <div class="row">${same ? '' : `<button class="btn" id="scLook">${useNow ? T('scene_then') : T('scene_now')}</button>`}<button class="btn pri" id="scSave">${T('scene_save')}</button>${back ? `<button class="btn" id="scBack">${T('back')}</button>` : `<button class="btn" id="scAlbum">${T('album')}</button>`}</div>`, { cls: 'wide', icon: 'album' });
    this.sheetEl.hidden = false; this.sheetEl.onclick = null;
    $$('#sheet [data-close]').forEach(b => b.addEventListener('click', () => { SND.sfx('close'); this.closePanel(); }));
    const cv = $('#scCv'), x = cv.getContext('2d');
    const t0 = performance.now();
    const draw = () => {
      if (!$('#scCv')) return clearInterval(this._anim);
      const t = (performance.now() - t0) / 1000;
      const sc = renderScene(id, look, t);
      x.imageSmoothingEnabled = false; x.drawImage(sc, 0, 0, 1024, 576);
      const k = Math.min(1, t * 2);
      if (first && t < .6) { x.fillStyle = `rgba(255,255,255,${1 - t / .6})`; x.fillRect(0, 0, 1024, 576); }
      x.globalAlpha = k; sc.bubbles.forEach(b => drawBubbleAt(x, b.x * 4, b.y * 4, b.ko, b.en, 1.7)); x.globalAlpha = 1;
    };
    clearInterval(this._anim); draw(); this._anim = setInterval(draw, 110);
    const lb = $('#scLook'); if (lb) lb.addEventListener('click', () => { useNow = !useNow; look = useNow ? now : then; lb.textContent = useNow ? T('scene_then') : T('scene_now'); SND.sfx('page'); draw(); });
    $('#scSave').addEventListener('click', () => { SND.sfx('shutter'); saveCanvas(scenePostcard(id, look, (performance.now() - t0) / 1000), 'hantang-' + id.replace('sc_', '') + '.png'); stat('postcards'); });
    const bb = $('#scBack'); if (bb) bb.addEventListener('click', () => this.openPanel('album', 'scenes'));

  /* ── 신령의 시험 ── */
  startTrial() {
    const pool = ['scrub', 'cold', 'egg', 'towel', 'sikhye', 'locker', 'temp', 'back', 'milk', 'stack', 'quiz', 'order', 'shoes'];
    const ids = shuffle(pool.slice()).slice(0, 3);
    const trial = { ids, i: 0, grades: [] };
    this.dialog([{ en: '"' + ids.map(i => MG_META[i].n.en).join(', ') + '. Begin."', ko: '"' + ids.map(i => MG_META[i].n.ko).join(', ') + '. 시작하거라."' }], { name: L(NPCS.spirit.name), look: NPCS.spirit.look }, [{ label: T('mg_start'), fn: () => MG.start(ids[0], { trial }) }]);
  },
  trialNext(trial) {
    MG.close();
    if (trial.i < 2) { trial.i++; MG.start(trial.ids[trial.i], { trial }); return; }
    const avg = trial.grades.reduce((a, g) => a + GRADE_PTS[g], 0) / trial.grades.length;
    const who = { name: L(NPCS.spirit.name), look: NPCS.spirit.look };
    if (avg >= 2) {
      SND.sfx('win');
      const wasDone = Prog.state('m_onsen') === 'done';
      this.dialog([{ en: '"Well done. Wear the golden outfit, and come rest whenever your body feels heavy."', ko: '"훌륭하다. 황금 찜질복을 입고, 몸이 무거울 땐 언제든 와서 쉬어라."' }], who, null, () => { Prog.event('trial', { pass: true }); if (wasDone) this.ending(); });
    } else {
      this.dialog([{ en: '"' + T('trial_fail') + '"', ko: '"' + T('trial_fail') + '"' }], who, [{ label: T('trial_title'), fn: () => this.startTrial() }, { label: T('bot_leave'), fn: null }]);
    }
  },
  ending() {
    this.enqueue(() => {
      const body = `<div class="mgc"><div class="t">${T('ending_title')}</div><div class="sub">${LANG === 'ko' ? 'One tang a day' : '하루 한 탕'}</div>
        <p>${T('ending_body')}</p>
        <div class="list" style="text-align:left;margin:8px 0">${this.recordRows()}</div>
        <p>${T('ending_more')}</p>
        <div class="row" style="justify-content:center"><a class="btn pri" href="${SITE}" target="_blank" rel="noopener" style="text-decoration:none">${T('visit_real')} ↗</a><button class="btn" data-open="album" data-arg="scenes">${T('album')}</button><button class="btn" data-close>${T('close')}</button></div></div>`;
      this.panel = 'ending'; World.paused = true;

/* ─────────────────────────────────────────────
   net: 온라인 연결 (선택 사항)
   - 기본: 오프라인. 단골손님 NPC가 로비를 채운다.
   - config.js 에 Supabase 주소와 공개 키를 넣으면
     같은 탕에 있는 사람끼리 위치·이모트·한마디가 실시간으로 보이고,
     주간 랭킹이 전체 플레이어 기준으로 바뀐다.
   ───────────────────────────────────────────── */

const LOOK_KEYS = ['skin', 'hair', 'hairStyle', 'outfit', 'towelShape', 'towelColor', 'scrub', 'slipper', 'bagaji'];
const ALLOWED = {
  skin: Object.keys(LOOK.skin), hair: Object.keys(LOOK.hair), hairStyle: ['short', 'bob', 'long', 'bun', 'spiky', 'perm', 'bald'],
  outfit: Object.keys(LOOK.outfit), towelShape: ['lamb', 'band', 'none', 'turban', 'frog', 'crown', 'shell', 'cat'], towelColor: Object.keys(LOOK.towel),
  scrub: Object.keys(LOOK.scrub), slipper: Object.keys(LOOK.slipper), bagaji: Object.keys(LOOK.bagaji)
};
function packLook(l) { return LOOK_KEYS.map(k => l[k] || '').join('.'); }
function unpackLook(s) {
  const parts = String(s || '').split('.'); const l = {};
  LOOK_KEYS.forEach((k, i) => { l[k] = ALLOWED[k].includes(parts[i]) ? parts[i] : ALLOWED[k][0]; });
  return l;
}
function cleanName(n) { return String(n || 'Guest').replace(/[\u0000-\u001f<>]/g, '').slice(0, 12) || 'Guest'; }

const Net = {
  sb: null, ch: null, uid: null, state: 'off', peers: 0, stage: null, lastSend: 0, lastX: 0, lastY: 0, lastTrack: 0,

  cfg() { const c = window.HANTANG_CONFIG; return c && c.supabaseUrl && c.supabaseAnonKey ? c : null; },
  status() { return { s: this.state, n: this.peers + 1 }; },

  async init() {
    const cfg = this.cfg(); if (!cfg) return;
    this.state = 'conn'; Bus.emit('net');
    try {
      if (!window.supabase) await loadScript(cfg.supabaseJs || 'vendor/supabase.js');
      this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { realtime: { params: { eventsPerSecond: 8 } } });
      let user = null;
      try { const s = await this.sb.auth.getSession(); user = s.data && s.data.session && s.data.session.user; } catch (e) { }
      if (!user) { const r = await this.sb.auth.signInAnonymously(); if (r.error) console.warn('[net] 익명 로그인 실패 — 랭킹 저장은 꺼집니다', r.error.message); user = r.data && r.data.user; }
      this.uid = user ? user.id : null;
      this.key = this.uid || S.id;
      this.ready = true;
      if (this.stage) this.joinStage(this.stage, true);
    } catch (e) { console.warn('[net] 연결 실패', e); this.state = 'err'; Bus.emit('net'); }
  },

  joinStage(id, force) {
    if (this.stage === id && !force) return;
    this.stage = id;
    World.remotes.clear(); this.peers = 0;
    if (!this.sb || !this.ready) return;
    if (this.ch) { try { this.sb.removeChannel(this.ch); } catch (e) { } this.ch = null; }
    const ch = this.sb.channel('hantang-' + id, { config: { presence: { key: this.key }, broadcast: { self: false } } });
    ch.on('presence', { event: 'sync' }, () => this.syncPresence())
      .on('broadcast', { event: 'mv' }, ({ payload }) => this.onMove(payload))
      .on('broadcast', { event: 'em' }, ({ payload }) => { const r = World.remotes.get(payload && payload.i); if (r && EMOTE[payload.e]) r.emote = { id: payload.e, t: 2.6 }; })
      .on('broadcast', { event: 'sy' }, ({ payload }) => { const r = World.remotes.get(payload && payload.i); const ph = payload && PHRASE[payload.p]; if (r && ph && ph.chat) r.say = { ko: ph.ko, en: ph.en, t: 4.2 }; })
      .on('broadcast', { event: 'lk' }, ({ payload }) => { const r = World.remotes.get(payload && payload.i); if (r) { r.look = unpackLook(payload.l); r.spr = getChar(r.look); } })
      .subscribe(st => {
        if (st === 'SUBSCRIBED') { this.state = 'on'; Bus.emit('net'); this.track(); }
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { if (this.state !== 'on') { this.state = 'err'; Bus.emit('net'); } }
      });
    this.ch = ch;
  },
  me() { const p = World.player; return { n: cleanName(S.name), l: packLook(playerLook()), x: Math.round(p ? p.x : 0), y: Math.round(p ? p.y : 0), d: p ? p.dir : 'down', t: S.title || '', v: S.lv }; },
  track() { if (this.ch) { this.lastTrack = performance.now(); this.ch.track(this.me()).catch(() => { }); } },
  syncPresence() {

    for (const k in st) {
      if (k === this.key) continue;
      const m = st[k][0]; if (!m) continue; seen.add(k);
      let r = World.remotes.get(k);
      const x = clamp(+m.x || 0, 0, World.w * TS), y = clamp(+m.y || 0, 0, World.h * TS);
      if (!r) { const look = unpackLook(m.l); r = makeActor('remote', x, y, look); r.tx = x; r.ty = y; r.remote = true; World.remotes.set(k, r); }
      r.name = cleanName(m.n) + (m.v > 0 ? ' Lv' + Math.min(99, m.v | 0) : ''); r.title = TITLES[m.t] ? '[' + L(TITLES[m.t]) + ']' : ''; r.tx = x; r.ty = y; if (m.d && DIRV[m.d]) r.dir = m.d;

  async submitScore(board, score) {
    if (!this.sb || !this.uid || this.state !== 'on' || !(score > 0)) return;
    const wk = weekKey(); const k = 'sub_' + board + wk;
    if ((S.flags[k] || 0) >= score) return;
    try {
      const { error } = await this.sb.from('hantang_scores').upsert({ user_id: this.uid, board, week: wk, score: Math.round(score), name: cleanName(S.name), updated_at: new Date().toISOString() }, { onConflict: 'user_id,board,week' });
      if (!error) { S.flags[k] = score; save(); } else console.warn('[net] 점수 저장 실패', error.message);
    } catch (e) { }
  },
  async topScores(board) {
    if (!this.sb) return null;
    try {
      const { data, error } = await this.sb.from('hantang_scores').select('user_id,name,score').eq('board', board).eq('week', weekKey()).order('score', { ascending: false }).limit(20);
      if (error) return null;
      return data.map(r => ({ name: cleanName(r.name), score: r.score | 0, me: r.user_id === this.uid }));

  }
};

/* ─────────────────────────────────────────────
   scenes: 명장면 도트 일러스트 (256×144, 내 캐릭터가 들어간다)
   배경은 디더링 프레임버퍼로, 인물·소품은 스프라이트로 그린다.
   ───────────────────────────────────────────── */

const SW = 256, SH = 144;
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bth = (x, y) => (BAYER[y & 3][x & 3] + .5) / 16;
function pk(hex) { const [r, g, b] = hex2rgb(hex); return (255 << 24 | b << 16 | g << 8 | r) >>> 0; }
function upk(v) { return [v & 255, v >> 8 & 255, v >> 16 & 255]; }

// 디더링 프레임버퍼
function FB() {
  const img = new ImageData(SW, SH), d = new Uint32Array(img.data.buffer);
  const F = {
    img, d,
    set(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < SW && y < SH) d[y * SW + x] = c; },
    rect(x, y, w, h, hex) { const c = pk(hex); for (let j = Math.max(0, y | 0); j < Math.min(SH, (y + h) | 0); j++) for (let i = Math.max(0, x | 0); i < Math.min(SW, (x + w) | 0); i++) d[j * SW + i] = c; },
    // 여러 색 램프를 디더링으로 섞은 그라데이션
    grad(x, y, w, h, ramp, vert = true) {
      const cs = ramp.map(pk), n = cs.length - 1;
      for (let j = Math.max(0, y); j < Math.min(SH, y + h); j++) for (let i = Math.max(0, x); i < Math.min(SW, x + w); i++) {
        const t = vert ? (j - y) / Math.max(1, h - 1) : (i - x) / Math.max(1, w - 1);
        const p = t * n, k = Math.min(n - 1, Math.floor(p)), f = p - k;
        d[j * SW + i] = f > bth(i, j) ? cs[k + 1] : cs[k];
      }
    },
    ell(cx, cy, rx, ry, hex, fn) {
      const c = pk(hex);
      for (let j = Math.floor(cy - ry); j <= Math.ceil(cy + ry); j++) for (let i = Math.floor(cx - rx); i <= Math.ceil(cx + rx); i++) {
        const dx = (i + .5 - cx) / rx, dy = (j + .5 - cy) / ry, r = dx * dx + dy * dy;
        if (r <= 1 && i >= 0 && j >= 0 && i < SW && j < SH) { const cc = fn ? fn(i, j, dx, dy, r) : null; d[j * SW + i] = cc ? pk(cc) : c; }
      }
    },
    // 디더링 안개 (김, 빛)
    fog(cx, cy, rx, ry, hex, dens = .6) {
      const c = pk(hex);
      for (let j = Math.floor(cy - ry); j <= Math.ceil(cy + ry); j++) for (let i = Math.floor(cx - rx); i <= Math.ceil(cx + rx); i++) {
        if (i < 0 || j < 0 || i >= SW || j >= SH) continue;
        const dx = (i + .5 - cx) / rx, dy = (j + .5 - cy) / ry, r = dx * dx + dy * dy;
        if (r < 1 && dens * (1 - r) > bth(i, j)) d[j * SW + i] = c;
      }
    },
    // 기존 색을 밝게/어둡게 (디더링)
    tone(x, y, w, h, k, dens = 1) {
      for (let j = Math.max(0, y); j < Math.min(SH, y + h); j++) for (let i = Math.max(0, x); i < Math.min(SW, x + w); i++) {
        if (dens < 1 && dens <= bth(i, j)) continue;
        const [r, g, b] = upk(d[j * SW + i]);
        const f = v => k < 0 ? v * (1 + k) : v + (255 - v) * k;
        d[j * SW + i] = pk(rgb2hex(f(r), f(g), f(b)));
      }
    },
    glow(cx, cy, rad, hex, str = .5) {   // 색을 섞어 빛 번짐
      const [R, G, B] = hex2rgb(hex);
      for (let j = Math.floor(cy - rad); j <= cy + rad; j++) for (let i = Math.floor(cx - rad); i <= cx + rad; i++) {
        if (i < 0 || j < 0 || i >= SW || j >= SH) continue;
        const r = Math.hypot(i - cx, j - cy) / rad; if (r >= 1) continue;
        const a = str * (1 - r) * (1 - r); if (a < bth(i, j) * .35) continue;
        const [r0, g0, b0] = upk(d[j * SW + i]);
        d[j * SW + i] = pk(rgb2hex(r0 + (R - r0) * a, g0 + (G - g0) * a, b0 + (B - b0) * a));
      }
    },
    tiles(x, y, w, h, base, grout, s = 8, shadeTop = true) {
      F.rect(x, y, w, h, base); const g = pk(grout);
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (((i - x) % s === 0) || ((j - y) % s === 0)) F.set(i, j, g);
      if (shadeTop) F.tone(x, y, w, Math.min(10, h), -.06, .5);
    },
    put(ctx) { ctx.putImageData(img, 0, 0); }
  };
  return F;
}

/* ── 장면용 스프라이트 ── */
const SC_CACHE = new Map();

  const r = dir === 'left' ? flipH(c) : c; SC_CACHE.set(k, r); return r;
}
function lying(look, faceUp = true) {   // 누운 자세 (90도 회전)

    F.glow(40, 90, 24, '#FFB866', .5); F.rect(38, 84, 5, 7, '#E2603A');
    F.put(ctx);
    drawSpr(ctx, scSpr(L, 'up', 0), 120, 160, 4, { cut: 16 });
  },
  sc_spirit(F, ctx, L, t, B) {
    F.grad(0, 0, SW, 100, ['#1A2A4A', '#3A5A8A', '#8AB0D8']);
    for (let i = 0; i < 40; i++) F.set((i * 61) % SW, (i * 23) % 70, pk('#FFFFFF'));
    F.glow(128, 50, 110, '#FFE9A8', .5);
    F.rect(0, 92, SW, 10, '#4E5262'); for (let i = 0; i < 12; i++) F.ell(10 + i * 22, 94, 11, 6, '#6E7282');
    water(F, 0, 100, SW, 44, ['#A8DCD2', '#7EC4BC', '#5AA8A0'], t);
    for (let i = 0; i < 4; i++) { const a = t * .7 + i * 1.57; F.fog(128 + Math.cos(a) * 60, 60 + Math.sin(a) * 20, 18, 10, '#FFFFFF', .5); }
    steamWisps(F, t, 20, 236, 110, 8);
    F.put(ctx);
    const sp = bossLikeSpirit(); ctx.globalAlpha = .9; ctx.drawImage(sp, 128 - sp.width / 2, 8 + Math.sin(t * 1.5) * 3); ctx.globalAlpha = 1;
    const bow = scSpr(Object.assign({}, L, { outfit: L.outfit }), 'up', 0); drawSpr(ctx, bow, 128, 158, 3, { cut: 20 });
    bubble(B, 128, 8, '잘하였다', 'Well done');
  }
};
let _spiritBig = null;
function bossLikeSpirit() { if (_spiritBig) return _spiritBig; _spiritBig = scaleCanvas(drawChar(NPCS.spirit.look, 'down', 0), 3); return _spiritBig; }

/* ── 렌더 ── */
function renderScene(id, look, t = 0) {
  const [c, ctx] = mkCanvas(SW, SH); const F = FB(); const B = [];
  try { SCENE_DRAW[id](F, ctx, look, t, B); } catch (e) { console.error('scene', id, e); F.put(ctx); }
  c.bubbles = B; return c;
}
const THUMB_SC = {};
function sceneThumb(id, look) {
  const k = id + lookKey(look); if (THUMB_SC[k]) return THUMB_SC[k];
  return (THUMB_SC[k] = scaleCanvas(renderScene(id, look, 0), 1).toDataURL());
}
// 저장용 엽서 (장면 ×4 + 말풍선 + 설명)
function scenePostcard(id, look, t = 0) {
  const sc = renderScene(id, look, t), k = 4, PAD = 24, CAP = 120;
  const [c, x] = mkCanvas(SW * k + PAD * 2, SH * k + PAD * 2 + CAP);
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = OUT; x.fillRect(PAD - 4, PAD - 4, SW * k + 8, SH * k + 8);
  x.imageSmoothingEnabled = false; x.drawImage(sc, PAD, PAD, SW * k, SH * k);
  sc.bubbles.forEach(b => drawBubbleAt(x, PAD + b.x * k, PAD + b.y * k, b.ko, b.en, 1.6));
  const meta = SCENES[id];
  x.fillStyle = C.ink; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  x.font = '36px Galmuri11, sans-serif'; x.fillText(meta.n.ko + '  ·  ' + meta.n.en, PAD, SH * k + PAD * 2 + 44);
  x.font = '24px Galmuri11, sans-serif'; x.fillStyle = '#6E6B66';
  const rec = S.scenes[id]; x.fillText('HANTANG Online · ' + S.name + ' · ' + (rec ? rec.d : dayKey()), PAD, SH * k + PAD * 2 + 86);
  x.fillStyle = C.red; x.fillRect(c.width - PAD - 72, SH * k + PAD * 2 + 18, 72, 72);
  x.fillStyle = '#FFFFFF'; x.font = '30px Galmuri14, Galmuri11, sans-serif'; x.textAlign = 'center'; x.fillText('韓', c.width - PAD - 36, SH * k + PAD * 2 + 50); x.fillText('湯', c.width - PAD - 36, SH * k + PAD * 2 + 82);
  return c;
}
function drawBubbleAt(x, cx, cy, ko, en, k = 1) {
  x.save(); x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = Math.round(15 * k) + 'px Galmuri14, Galmuri11, sans-serif'; const w1 = x.measureText(ko).width;
  x.font = Math.round(12 * k) + 'px Galmuri11, sans-serif'; const w2 = x.measureText(en).width;
  const w = Math.max(w1, w2) + 20 * k, h = 38 * k, bx = cx - w / 2, by = cy - h / 2;
  x.fillStyle = OUT; x.fillRect(bx - 2 * k, by - 2 * k, w + 4 * k, h + 4 * k);
  x.fillStyle = '#FFFFFF'; x.fillRect(bx, by, w, h);
  x.fillStyle = C.ink; x.font = Math.round(15 * k) + 'px Galmuri14, Galmuri11, sans-serif'; x.fillText(ko, cx, by + 17 * k);
  x.fillStyle = C.blue; x.font = Math.round(12 * k) + 'px Galmuri11, sans-serif'; x.fillText(en, cx, by + 31 * k);
  x.restore();
}

/* ─────────────────────────────────────────────
   main: 부팅, 화면 맞춤, 타이틀(캐릭터 만들기), 메인 루프
   ───────────────────────────────────────────── */

let GAME = 'title';
const cv = $('#cv'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const txc = $('#tx'), tctx = txc.getContext('2d');
let VIEW = { s: 1, w: W, h: H, dpr: 1 };

function resize() {
  const app = $('#app'), cs = getComputedStyle(app);
  const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const portrait = Input.touchMode && ah > aw * 1.1;
  document.documentElement.classList.toggle('portrait', portrait);
  let s = portrait ? aw / W : Math.min(aw / W, (ah - 10) / H);
  if (s >= 3) s = Math.floor(s);
  s = Math.max(.5, s);
  const w = Math.floor(W * s), h = Math.floor(H * s), dpr = Math.min(3, window.devicePixelRatio || 1);
  const st = $('#stage'); st.style.width = w + 'px'; st.style.height = h + 'px';
  txc.width = Math.round(w * dpr); txc.height = Math.round(h * dpr);
  VIEW = { s, w, h, dpr };
}

/* ── 타이틀 ── */
const TITLE = { look: { skin: 's1', hair: 'black', hairStyle: 'short', outfit: 'ochre' }, name: '', scene: null, bots: [] };

  const has = !!S;

  t.innerHTML = `<div class="tcard">

    <div class="tag"><b>하루 한 탕</b> · One tang a day</div>
    <div class="tsub">${T('title_sub')}</div>
    <canvas id="tScene" width="240" height="64" style="width:min(480px,100%);aspect-ratio:240/64;image-rendering:pixelated;border:2px solid var(--ink);background:#F7F9FA"></canvas>
    <div class="tbox" id="tBox">

      <div class="row"><button class="btn pri big" id="tCont">${T('cont')}</button><button class="btn" id="tNew">${T('newgame')}</button></div>` :
      `<div class="field"><label for="tName">${T('your_name')}</label><input id="tName" maxlength="12" placeholder="${T('name_ph')}" autocomplete="off"></div>
      <div class="creator"><canvas id="tPrev" width="20" height="30"></canvas><div class="grow">
        <div><div class="muted">${T('skin')}</div><div class="opts">${skins.map(k => `<button class="sw ${TITLE.look.skin === k ? 'on' : ''}" data-k="skin" data-v="${k}" style="background:${LOOK.skin[k]}" aria-label="${k}"></button>`).join('')}</div></div>
        <div><div class="muted">${T('hair')}</div><div class="opts">${hairs.map(k => `<button class="sw ${TITLE.look.hair === k ? 'on' : ''}" data-k="hair" data-v="${k}" style="background:${LOOK.hair[k]}" aria-label="${k}"></button>`).join('')}</div></div>
        <div><div class="muted">${T('style')}</div><div class="opts">${styles.map(k => `<button class="pill ${TITLE.look.hairStyle === k ? 'on' : ''}" data-k="hairStyle" data-v="${k}">${L(styleN[k])}</button>`).join('')}</div></div>
        <div><div class="muted">${T('outfit')}</div><div class="opts">${['ochre', 'pink'].map(k => `<button class="pill ${TITLE.look.outfit === k ? 'on' : ''}" data-k="outfit" data-v="${k}">${L(COSTUMES.outfit.find(x => x.id === k).n)}</button>`).join('')}</div></div>
      </div></div>
      <button class="btn pri big" id="tGo">${T('lets_go')}</button>`}
    </div>
    <div class="langsw"><button class="pill ${LANG === 'en' ? 'on' : ''}" data-tl="en">English</button><button class="pill ${LANG === 'ko' ? 'on' : ''}" data-tl="ko">한국어</button></div>
    <div class="tfoot">${T('credits')} · <a href="${SITE}" target="_blank" rel="noopener">hantang-web.pages.dev</a></div>
  </div>`;
  const lc = $('#tLogo').getContext('2d'); lc.drawImage(logoCanvas(C.ink, 1), 0, 0);
  const drawPrev = () => { const pc = $('#tPrev'); if (!pc) return; const x = pc.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, 20, 30); const look = has ? playerLook() : Object.assign({ towelShape: 'lamb', towelColor: 'white', scrub: 'green', slipper: 'blue' }, TITLE.look); x.drawImage(drawChar(look, 'down', 0), 0, 0); };
  drawPrev();
  $$('#title [data-tl]').forEach(b => b.addEventListener('click', () => { if ($('#tName')) TITLE.name = $('#tName').value; setLang(b.dataset.tl); try { Store.set('hantang_lang', b.dataset.tl); } catch (e) { } showTitle(); }));
  $$('#title [data-k]').forEach(b => b.addEventListener('click', () => { SND.init(); SND.sfx('click'); TITLE.look[b.dataset.k] = b.dataset.v; TITLE.name = $('#tName').value; $$(`#title [data-k="${b.dataset.k}"]`).forEach(x => x.classList.toggle('on', x === b)); drawPrev(); }));
  if ($('#tName')) { $('#tName').value = TITLE.name; }
  if ($('#tGo')) $('#tGo').addEventListener('click', () => {
    SND.init();
    const nm = cleanName(($('#tName').value || '').trim() || (LANG === 'ko' ? '손님' : 'Guest'));
    S = newSave(nm, TITLE.look); S.lang = LANG; save(true); startGame(true);
  });
  if ($('#tCont')) $('#tCont').addEventListener('click', () => { SND.init(); startGame(false); });
  if ($('#tNew')) { let armed = false; $('#tNew').addEventListener('click', () => { if (!armed) { armed = true; $('#tNew').textContent = T('set_reset_confirm'); return; } Store.del(SAVE_KEY); Store.del('hantang_online_v1'); S = null; showTitle(); }); }
  // 타이틀 장면 손님
  TITLE.bots = Array.from({ length: 5 }, (_, i) => ({ x: 30 + i * 46, y: 54, look: randomLook(), dir: i % 2 ? 'left' : 'right', t: rnd(5), emote: null, et: rnd(2, 6) }));
}
function drawTitleScene(dt) {
  const c = $('#tScene'); if (!c) return; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = '#F7F9FA'; x.fillRect(0, 0, 240, 64);
  x.fillStyle = '#D7E2EA'; for (let i = 0; i < 240; i += 8) x.fillRect(i, 0, 1, 64); for (let j = 0; j < 64; j += 8) x.fillRect(0, j, 240, 1);
  // 탕
  x.fillStyle = C.blue; x.fillRect(150, 8, 82, 26); x.fillStyle = waterFrames.warm ? '#7FC8E0' : '#7FC8E0'; x.fillRect(152, 10, 78, 22);
  for (let i = 0; i < 4; i++) { x.fillStyle = 'rgba(255,255,255,.5)'; x.fillRect(156 + ((i * 19 + performance.now() / 60) % 70) | 0, 14 + i * 4, 6, 1); }
  x.fillStyle = C.red; x.fillRect(6, 6, 16, 16); x.fillStyle = '#FFF'; x.font = '8px Galmuri11, sans-serif'; x.textBaseline = 'top'; x.fillText('韓', 9, 6); x.fillText('湯', 9, 14);
  TITLE.bots.forEach(b => {
    b.t += dt; b.et -= dt;
    const sp = 14 * dt; b.x += b.dir === 'right' ? sp : -sp;
    if (b.x > 228) b.dir = 'left'; if (b.x < 12) b.dir = 'right';
    if (b.et <= 0) { b.et = rnd(3, 7); b.emote = { id: pick(EMOTES).id, t: 2 }; }
    if (b.emote) { b.emote.t -= dt; if (b.emote.t <= 0) b.emote = null; }
    const f = getChar(b.look); x.drawImage(FX.shadow, b.x - 7 | 0, b.y - 3); x.drawImage(f[b.dir][Math.floor(b.t * 8) % 4], b.x - CHAR_AX | 0, b.y - CHAR_AY);
  });
  TITLE.bots.forEach(b => { if (b.emote) { const ic = ICON[EMOTE[b.emote.id].icon]; x.fillStyle = '#FFFFFF'; x.fillRect(b.x - 7 | 0, 0, ic.width + 4, ic.height + 2); x.drawImage(ic, b.x - 5 | 0, 1); } });
}

/* ── 게임 시작 ── */
function startGame(isNew) {
  LANG = S.lang || LANG; document.documentElement.lang = LANG;
  SND.setMusic(S.settings.music); SND.setSfx(S.settings.sfx);
  $('#title').hidden = true; $('#hud').hidden = false; GAME = 'play';
  setLang(LANG);
  Prog.init();
  const st = stageUnlocked(S.stage) ? S.stage : 'bath1';
  loadStage(st); stat('visit_' + st);
  UI.hud(); UI.tracker();
  setTimeout(() => {
    const daily = checkDaily();
    if (!isNew && !daily) UI.toast(T('welcome_back', { name: S.name }));
    if (isNew) setTimeout(() => { if (!UI.busy()) UI.talkNpc('imo'); }, 500);
  }, 900);
  if (!Net._inited) { Net._inited = true; Net.init(); }
  resize();
}

/* ── 메인 루프 ── */
let lastT = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  try {
    if (GAME === 'title') { drawTitleScene(dt); }
    else {
      const busy = UI.busy();
      if (!busy) {
        if (Input.hit('map')) UI.openPanel('map');
        else if (Input.hit('bag')) UI.openPanel('bag');
        else if (Input.hit('costume')) UI.openPanel('costume');
        else if (Input.hit('chat')) UI.openPanel('chat');
        else if (Input.hit('missions')) UI.openPanel('missions');
        else if (Input.hit('album')) UI.openPanel('album');
        else if (Input.hit('card')) UI.openPanel('card');
        else if (Input.hit('photo')) UI.photo();
        else if (Input.hit('menu')) UI.openPanel('menu');
        else if (Input.pointer.clicked) tapWorld(Input.pointer.x, Input.pointer.y);
      } else if (UI.dlg && (Input.pressed.act || Input.pressed.use)) UI.dialogNext();
      else if (MG.cur && MG.cur.state === 'intro' && (Input.pressed.act) && document.activeElement !== $('#mgGo')) MG.begin();
      MG.update(dt);
      updateWorld(dt);
      // 렌더
      if (!MG.render(ctx)) renderWorld(ctx);
      tctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0); tctx.clearRect(0, 0, VIEW.w, VIEW.h);
      if (MG.cur && MG.cur.state === 'play') MG.renderText(tctx, VIEW.s); else if (!MG.cur) renderTextLayer(tctx, VIEW.s);
      const it = !busy && World.busyT <= 0 ? World.interact : null; if (it !== frame._it) { frame._it = it; UI.useLabel(it); }
      hudT -= dt; if (hudT <= 0) { hudT = .12; UI.heat(World.heat); UI.hudFade(); }
      UI.pump();
    }
  } catch (e) { console.error(e); }
  Input.endFrame();
  requestAnimationFrame(frame);
}

/* ── 부팅 ── */
async function boot() {
  const saved = Store.get('hantang_lang', null);
  LANG = saved || ((navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en');
  buildFX(); buildIcons(); buildTileCaches();
  Input.init(cv); UI.init();
  S = loadSave(); if (S && S.lang) LANG = S.lang;
  document.documentElement.lang = LANG;
  try { await Promise.race([Promise.all([document.fonts.load('12px Galmuri11'), document.fonts.load('15px Galmuri14')]), new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
  resize(); window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  setLang(LANG);
  showTitle();
  requestAnimationFrame(frame);
  window.addEventListener('beforeunload', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
}

// 테스트용 핸들
Object.defineProperty(HT, 'S', { get: () => S });
Object.assign(HT, { World, MG, UI, Net, loadStage, startGame, travel, MINI, Input, SND, Prog, gainXP, achUnlock, tapWorld, eatFood, MISSION, renderScene });
boot();
