    if (!quiet) UI.toast(T('new_title') + ' · ' + L(TITLES[id]), 'gold');
    stat('titles', 0); save(); Bus.emit('title');
    return true;
  },

  /* ── 미션 ── */
  state(id) { return S.ms[id] && S.ms[id].st; },
  startMission(id, quiet) {
    const m = MISSION[id]; if (!m || this.state(id)) return;
    S.ms[id] = { st: 'active', step: 0, acc: 0 };
    this.prepStep(id);
    if (!S.track || this.state(S.track) !== 'active' || m.kind === 'main') S.track = id;
    if (!quiet) { SND.sfx('open'); UI.toast(T('m_new') + ' · ' + L(m.n), 'good'); }
    save(); Bus.emit('missions');
    setTimeout(() => this.checkImmediate(id), 50);
  },
  prepStep(id) {
    const m = MISSION[id], s = S.ms[id], step = m.steps[s.step]; if (!step) return;
    s.acc = 0;
    if (step.o.t === 'cnt') s.base = statValue(step.o.stat);
  },
  checkImmediate(id) {
    const m = MISSION[id], s = S.ms[id]; if (!s || s.st !== 'active') return;
    const o = m.steps[s.step] && m.steps[s.step].o; if (!o) return;
    if (o.t === 'wear' && o.ids.includes(S.costume[o.slot])) this.advance(id);
  },
  autoStartMain(stageId) {
    MISSIONS.forEach(m => { if (m.kind === 'main' && m.stage === stageId && !this.state(m.id) && stageUnlocked(stageId)) this.startMission(m.id, false); });
  },
  // NPC 가 줄 수 있는 부탁
  offersFrom(npc) {
    return MISSIONS.filter(m => m.kind === 'side' && m.giver === npc && m.stage === World.st.id && !this.state(m.id) && S.lv >= (m.lv || 1));
  },
  hasOffer(npc) { return this.offersFrom(npc).length > 0; },
  needsTalk(npc) {   // 진행 중 미션이 이 NPC 와의 대화를 기다림
    return MISSIONS.some(m => this.state(m.id) === 'active' && m.steps[S.ms[m.id].step] && m.steps[S.ms[m.id].step].o.t === 'talk' && m.steps[S.ms[m.id].step].o.npc === npc && m.stage === World.st.id);
  },
  active() { return MISSIONS.filter(m => this.state(m.id) === 'active'); },
  current(id) { const m = MISSION[id], s = S.ms[id]; return m && s ? m.steps[s.step] : null; },
  progressText(id) {
    const m = MISSION[id], s = S.ms[id]; if (!m || !s) return '';
    const st = m.steps[s.step]; if (!st) return '';
    const o = st.o;
    if (o.t === 'soak' || o.t === 'sec') return Math.min(o.sec, Math.floor(s.acc)) + '/' + o.sec + 's';
    if (o.t === 'greet') return Math.min(o.n, s.acc) + '/' + o.n;
    if (o.t === 'cnt') return Math.min(o.n, statValue(o.stat) - (s.base || 0)) + '/' + o.n;
    return '';
  },

  // 모든 행동이 여기로 모인다
  event(type, d = {}) {
    if (!S) return;
    for (const m of this.active()) {
      const s = S.ms[m.id], step = m.steps[s.step]; if (!step) continue;
      const o = step.o; let done = false;
      if (o.t !== type) continue;
      if (LOCAL_EV.has(type) && World.st && m.stage !== World.st.id) continue;
      switch (type) {
        case 'talk': done = d.npc === o.npc && (!World.st || m.stage === World.st.id); break;
        case 'act': done = d.id === o.id; break;
        case 'soak': if (d.k === o.k) { s.acc += d.dt; done = s.acc >= o.sec; } break;
        case 'sec': if (d.k === o.k) { s.acc += d.dt; done = s.acc >= o.sec; } break;
        case 'mg': done = d.id === o.id && GRADE_RANK[d.grade] >= GRADE_RANK[o.g || 'C'] && (!o.min || d.score >= o.min); break;
        case 'eat': done = d.f === o.f; break;
        case 'wear': done = o.ids.includes(S.costume[o.slot]); break;
        case 'greet': s.acc += 1; done = s.acc >= o.n; break;
        case 'say': done = d.p === o.p; break;
        case 'photo': done = true; break;
        case 'trial': done = !!d.pass; break;
      }
      if (done) this.advance(m.id);
    }
    if (type === 'soak' || type === 'sec') { Bus.emit('missions_tick'); return; }
    Bus.emit('missions');
  },
  checkCnt(key) {
    for (const m of this.active()) { const st = this.current(m.id); if (st && st.o.t === 'cnt' && st.o.stat === key && statValue(key) - (S.ms[m.id].base || 0) >= st.o.n) this.advance(m.id); }
  },
  advance(id) {
    const m = MISSION[id], s = S.ms[id];
    s.step++;
    if (s.step >= m.steps.length) return this.complete(id);
    SND.sfx('good'); gainXP(m.kind === 'main' ? 40 : 20);
    UI.toast(T('m_step') + ' · ' + L(m.steps[s.step - 1].d), 'good');
    this.prepStep(id); save(); Bus.emit('missions');
    setTimeout(() => this.checkImmediate(id), 50);
  },
  complete(id) {
    const m = MISSION[id], s = S.ms[id], r = m.r;
    s.st = 'done'; s.d = dayKey();
    SND.sfx('win');
    gainXP(r.xp); addSweat(r.sweat || 0);
    const got = [];
    if (r.costume && unlockCostume(r.costume[0], r.costume[1])) got.push({ k: 'costume', slot: r.costume[0], id: r.costume[1] });
    if (r.title && this.addTitle(r.title, true)) got.push({ k: 'title', id: r.title });
    if (r.stamp) addStamp('main', m.stage);
    stat(m.kind === 'main' ? 'mainDone' : 'sideDone');
    if (m.kind === 'main') this.remember(m.n, true);
    if (S.track === id) S.track = this.pickTrack();
    save(); Bus.emit('missions');
    // NPC 감사 인사
    const npc = World.npcs.find(n => n.npc === m.giver);
    if (npc) { const t = TALK[m.giver] && TALK[m.giver].thanks; if (t) npc.say = { ko: t[0].ko, en: t[0].en, t: 3.5 }; }
    UI.missionClear(m, got, () => {
      if (r.scene) this.scene(r.scene);
      if (r.ending) { achUnlock('a_ending'); setTimeout(() => UI.ending(), 400); }
    });
  },
  pickTrack() {
    const here = World.st ? World.st.id : null;
    const act = this.active();
    return (act.find(m => m.kind === 'main' && m.stage === here) || act.find(m => m.stage === here) || act[0] || {}).id || '';
  },

  /* ── 오늘의 미션 ── */
  rollDaily() {
    const k = dayKey();
    if (S.daily.day === k) return;
    const R = seeded(k + S.id); const pool = DAILY.filter(d => S.lv >= (d.lv || 1));
    const ids = [];
    while (ids.length < 3) { const i = Math.floor(R() * pool.length); ids.push(pool.splice(i, 1)[0].id); }
    const base = {}; ids.forEach(id => { const d = DAILY.find(x => x.id === id); base[id] = S.stats[d.st] || 0; });
    S.daily = { day: k, ids, base, done: {}, bonus: false };
    save();
  },
  dailyProg(id) { const d = DAILY.find(x => x.id === id); return Math.min(d.n, (S.stats[d.st] || 0) - (S.daily.base[id] || 0)); },
  checkDaily() {
    if (!S.daily || S.daily.day !== dayKey()) { if (S.daily && S.daily.day) this.rollDaily(); return; }
    S.daily.ids.forEach(id => {
      if (S.daily.done[id]) return;
      const d = DAILY.find(x => x.id === id);
      if (this.dailyProg(id) >= d.n) {
        S.daily.done[id] = 1; gainXP(60); addSweat(30); SND.sfx('good');
        UI.toast(T('m_daily') + ' · ' + L(d.d) + ' ✓', 'good');
        S.stats.dailyDone = (S.stats.dailyDone || 0) + 1; this.checkAch('dailyDone');
      }
    });
    if (!S.daily.bonus && S.daily.ids.every(id => S.daily.done[id])) { S.daily.bonus = true; gainXP(150); addSweat(100); UI.toast(T('m_all_done') + ' ' + T('xp_gain', { n: 150 }) + ' · +100P', 'gold'); }
  },

  /* ── 업적 ── */
  checkAch(key) {
    ACHS.forEach(a => { if (a.st === key && !S.ach[a.id] && statValue(key) >= a.v) achUnlock(a.id); });
  }
};
function achUnlock(id) {

const GRADE_PTS = { S: 4, A: 3, B: 2, C: 1 };
const BIG = {};   // 확대 스프라이트 캐시
function big(key, c, k) { const kk = key + '@' + k; return BIG[kk] || (BIG[kk] = scaleCanvas(c, k)); }
const tap = () => Input.hit('act') || Input.pointer.clicked || Input.hit('use');
const hold = () => Input.held('act') || Input.pointer.down || Input.held('use');

function T2(tx, k, s, x, y, o = {}) {           // 글자층 텍스트 (화면 밖으로 넘치면 글씨를 줄인다)
  let size = o.size || 12;

  let w = tx.measureText(s).width;
  if (w > room && size > 9) { size = Math.max(9, Math.floor(size * room / w)); tx.font = font(size); w = tx.measureText(s).width; }
  const mw = w > room ? room : undefined;
  tx.textAlign = al; tx.textBaseline = 'middle';
  if (o.stroke !== false) { tx.lineWidth = o.lw || 3; tx.strokeStyle = o.sc || 'rgba(27,26,24,.9)'; mw ? tx.strokeText(s, x * k, y * k, mw) : tx.strokeText(s, x * k, y * k); }
  tx.fillStyle = o.col || '#FFFFFF'; mw ? tx.fillText(s, x * k, y * k, mw) : tx.fillText(s, x * k, y * k);
}
function panel(ctx, x, y, w, h, fill = '#FFFFFF', bd = OUT) {

function tileBG(ctx, col1 = '#F7F9FA', col2 = '#D7E2EA', s = 12) {
  ctx.fillStyle = col1; ctx.fillRect(0, 0, W, H); ctx.fillStyle = col2;

}
function meter(ctx, x, y, w, h, v, col, bg = '#3A3835') { ctx.fillStyle = OUT; ctx.fillRect(x - 1, y - 1, w + 2, h + 2); ctx.fillStyle = bg; ctx.fillRect(x, y, w, h); ctx.fillStyle = col; ctx.fillRect(x, y, Math.round(w * clamp(v, 0, 1)), h); }


// 등 그리기 (뒷모습, 수건 두른 허리)
function drawBack(ctx, cx, top, skin, hair, spots, towel = '#F4F4EE') {

const MINI = {};

/* 1. 때밀기 리듬 ─────────────────────── */
MINI.scrub = {
  controls: 'tap', grade: s => s.acc >= 92 ? 'S' : s.acc >= 80 ? 'A' : s.acc >= 60 ? 'B' : 'C',
  init() {
    this.bpm = 104; this.beat = 60 / this.bpm; this.t = -1.6; this.speed = 170; this.hitX = 92;
    const notes = []; const R = seeded('scrub' + Math.floor(Math.random() * 9999));
    let b = 2;
    while (b < 46) {
      const r = R();
      if (r < .12 && b < 42) { notes.push({ t: b * this.beat, hold: this.beat * 2 }); b += 3; }
      else if (r < .32) { notes.push({ t: b * this.beat }); notes.push({ t: (b + .5) * this.beat }); b += 1; }
      else if (r < .42) { b += 1; }
      else { notes.push({ t: b * this.beat }); b += 1; }
    }
    this.notes = notes; this.total = notes.length; this.score = 0; this.combo = 0; this.maxCombo = 0; this.judged = 0; this.hitPts = 0;
    this.pops = []; this.lastBeat = -1; this.end = (b + 2) * this.beat; this.grime = 40; this.wipe = 0;
    this.grimeSpots = Array.from({ length: 40 }, () => ({ x: rnd(-60, 56), y: rnd(-40, 40), r: rnd(3, 7) }));
  },
  judge(n, q) {
    n.done = true; this.judged++;

MINI.locker = {

  setup() {
    const r = this.round; this.cols = r < 2 ? 8 : 10; this.rows = r < 2 ? 3 : 4;

/* 9. 수면실 자리 찾기 ─────────────────── */
MINI.sleep = {
  controls: 'arrows', grade: s => s.score >= 1600 ? 'S' : s.score >= 1200 ? 'A' : s.score >= 750 ? 'B' : 'C',
  init() { this.round = 0; this.score = 0; this.setup(); },
  setup() {
    const r = this.round; this.cw = 12; this.ch = 7; this.ts = 24; this.ox = (W - this.cw * this.ts) / 2; this.oy = 50;
    const sleepers = [];
    const count = 14 + r * 7;
    const taken = new Set();
    this.px = 0; this.py = this.ch - 1; taken.add(this.px + ',' + this.py);
    do { this.gx = irnd(this.cw - 4, this.cw - 1); this.gy = irnd(0, this.ch - 1); } while (taken.has(this.gx + ',' + this.gy));
    taken.add(this.gx + ',' + this.gy);
    let tries = 0;
    while (sleepers.length < count && tries++ < 500) {
      const x = irnd(0, this.cw - 1), y = irnd(0, this.ch - 1); const k = x + ',' + y;
      if (taken.has(k) || (Math.abs(x - this.px) + Math.abs(y - this.py) < 2)) continue;
      taken.add(k); sleepers.push({ x, y, look: randomLook(), toss: rnd(3, 9) });
      if (!this.reachable(sleepers)) { sleepers.pop(); }
    }
    this.sl = sleepers; this.noise = 0; this.phase = 'snore'; this.pt = rnd(1.6, 2.4); this.t = 0; this.state = 'play'; this.mv = 0;
  },
  reachable(sl) {
    const bl = new Set(sl.map(s => s.x + ',' + s.y)); const q = [[this.px, this.py]]; const seen = new Set([this.px + ',' + this.py]);
    while (q.length) { const [x, y] = q.shift(); if (x === this.gx && y === this.gy) return true; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy, k = nx + ',' + ny; if (nx < 0 || ny < 0 || nx >= this.cw || ny >= this.ch || seen.has(k) || bl.has(k)) continue; seen.add(k); q.push([nx, ny]); } }
    return false;
  },
  update(dt) {
    if (this.state === 'res') { this.rt -= dt; if (this.rt <= 0) { if (this.q === 'fail') { this.done = { score: this.score }; return; } this.round++; if (this.round >= 3) this.done = { score: this.score }; else this.setup(); } return; }
    this.t += dt; this.pt -= dt; this.mv = Math.max(0, this.mv - dt);
    if (this.pt <= 0) { if (this.phase === 'snore') { this.phase = 'quiet'; this.pt = rnd(1.2, 2.2); } else { this.phase = 'snore'; this.pt = rnd(1.5, 2.6); SND.sfx('snore'); } }
    this.noise = Math.max(0, this.noise - 9 * dt);
    if (this.mv <= 0) for (const d of ['up', 'down', 'left', 'right']) if (Input.hit(d)) {
      const [dx, dy] = DIRV[d]; const nx = this.px + dx, ny = this.py + dy;
      if (nx < 0 || ny < 0 || nx >= this.cw || ny >= this.ch) break;
      if (this.sl.some(s => s.x === nx && s.y === ny)) { this.noise += 12; SND.sfx('miss'); break; }
      this.px = nx; this.py = ny; this.mv = .16; this.noise += (this.phase === 'snore' ? 4 : 24) * (buffOn('awake') ? .7 : 1); SND.sfx('tick');
      if (nx === this.gx && ny === this.gy) { const pts = 300 + Math.max(0, Math.round(300 - this.t * 15)) - Math.round(this.noise); this.score += Math.max(100, pts); this.pts = Math.max(100, pts); this.state = 'res'; this.rt = 1.3; this.q = 'ok'; SND.sfx('perfect'); }
      break;
    }
    // 뒤척이기
    this.sl.forEach(s => { s.toss -= dt; if (s.toss <= 0) { s.toss = rnd(4, 9); s.shake = .5; } s.shake = Math.max(0, (s.shake || 0) - dt); });
    if (this.noise >= 100) { this.state = 'res'; this.rt = 1.6; this.q = 'fail'; SND.sfx('fail'); }
  },
  draw(ctx) {
    ctx.fillStyle = '#141A22'; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < this.ch; y++) for (let x = 0; x < this.cw; x++) { const X = this.ox + x * this.ts, Y = this.oy + y * this.ts; ctx.fillStyle = (x + y) % 2 ? '#2E3A4E' : '#334158'; ctx.fillRect(X, Y, this.ts, this.ts); ctx.fillStyle = '#4E6FA8'; ctx.fillRect(X + 2, Y + 3, this.ts - 4, this.ts - 6); }
    const gX = this.ox + this.gx * this.ts, gY = this.oy + this.gy * this.ts; ctx.fillStyle = `rgba(255,226,122,${.4 + Math.sin(World.t * 4) * .2})`; ctx.fillRect(gX + 2, gY + 3, this.ts - 4, this.ts - 6);
    this.sl.forEach(s => {
      const X = this.ox + s.x * this.ts, Y = this.oy + s.y * this.ts; const sh = s.shake ? Math.round(Math.sin(World.t * 40)) : 0;
      ctx.fillStyle = OUT; ctx.fillRect(X + 3 + sh, Y + 5, this.ts - 6, this.ts - 9); ctx.fillStyle = LOOK.outfit[s.look.outfit]; ctx.fillRect(X + 4 + sh, Y + 6, this.ts - 8, this.ts - 11);
      ctx.fillStyle = LOOK.skin[s.look.skin]; ctx.fillRect(X + 4 + sh, Y + 7, 7, 7); ctx.fillStyle = LOOK.hair[s.look.hair]; ctx.fillRect(X + 4 + sh, Y + 7, 7, 3);
    });
    const ch = getChar(playerLook()); ctx.drawImage(ch.down[0], this.ox + this.px * this.ts + 2 | 0, this.oy + this.py * this.ts - 10 | 0);
    meter(ctx, 140, 230, 200, 10, this.noise / 100, this.noise > 70 ? C.red : C.gold);
    ctx.fillStyle = 'rgba(10,16,32,.35)'; ctx.fillRect(0, 0, W, H);
  },
  text(tx, k) {
    T2(tx, k, this.score + '', W - 16, 18, { align: 'right', size: 24 });
    T2(tx, k, this.phase === 'snore' ? 'Zzz… 드르렁~' : (L({ ko: '…조용…', en: '...quiet...' })), 240, 26, { size: 15, col: this.phase === 'snore' ? '#C4B0E6' : '#E26A55' });
    T2(tx, k, L({ ko: '소음', en: 'Noise' }), 128, 235, { align: 'right', size: 12 });
    if (this.state === 'res') T2(tx, k, this.q === 'ok' ? L({ ko: '자리 찾았다. +{n}', en: 'Found a spot. +{n}' }, { n: this.pts }) : (L({ ko: '"쉿! 조용히 해주세요!"', en: '"Shh! Keep it down!"' })), 240, 140, { size: 15, col: this.q === 'ok' ? '#FFE27A' : '#FFFFFF' });
  }

const SHOE_TYPES = ['sneaker', 'slipper', 'boot', 'heel', 'sandal', 'loafer'];
const SHOE_COLS = ['#D2463A', '#3D7FC4', '#2FA35E', '#E8C547', '#3A3835', '#E58FA0', '#F4F4EE', '#9C7A55'];
function drawShoe(ctx, type, col, x, y) {
  const parts = {
    sneaker: [[0, 8, 14, 3, '#FFFFFF'], [2, 3, 10, 5, col], [9, 1, 4, 3, col], [3, 4, 1, 1, '#FFFFFF'], [5, 4, 1, 1, '#FFFFFF']],
    slipper: [[0, 9, 14, 2, col], [1, 5, 7, 4, col], [2, 6, 5, 1, shade(col, .3)]],
    boot: [[0, 8, 14, 3, shade(col, -.3)], [1, 5, 12, 3, col], [8, -2, 5, 7, col], [8, -2, 5, 1, shade(col, .25)]],
    heel: [[0, 6, 6, 2, col], [5, 4, 8, 2, col], [11, 6, 2, 5, shade(col, -.3)], [1, 4, 4, 2, col]],
    sandal: [[0, 9, 14, 2, '#9C7A55'], [2, 6, 2, 3, col], [7, 6, 2, 3, col], [2, 6, 7, 1, col]],
    loafer: [[0, 8, 14, 3, shade(col, -.35)], [1, 4, 12, 4, col], [3, 5, 5, 1, shade(col, -.25)]]
  }[type];
  for (let i = 0; i < 2; i++) {
    const ox = x + i * 16, oy = y + (i ? 1 : 0);
    parts.forEach(([a, b, w, h]) => { ctx.fillStyle = OUT; ctx.fillRect(ox + a - 1, oy + b - 1, w + 2, h + 2); });
    parts.forEach(([a, b, w, h, c]) => { ctx.fillStyle = c; ctx.fillRect(ox + a, oy + b, w, h); });
  }
}
MINI.shoes = {
  controls: 'point', grade: s => s.score >= 1500 ? 'S' : s.score >= 1200 ? 'A' : s.score >= 850 ? 'B' : 'C',
  init() {
    const kinds = []; const types = shuffle(SHOE_TYPES.slice());
    while (kinds.length < 8) { const t = types[kinds.length % types.length], c = pick(SHOE_COLS); if (!kinds.some(k => k.t === t && k.c === c)) kinds.push({ t, c }); }
    this.cards = shuffle(kinds.concat(kinds).map((k, i) => ({ k, id: kinds.indexOf(k), open: false, done: false })));
    this.cols = 4; this.rows = 4; this.cw = 66; this.ch = 50; this.ox = 164; this.oy = 34;
    this.sel = []; this.tries = 0; this.cur = 0; this.t = 0; this.wait = 0; this.pairs = 0; this.endT = 0; this.score = 0; this.msg = null;
    this.base = irnd(1, 8) * 10;
  },
  cell(i) { return { x: this.ox + (i % this.cols) * this.cw, y: this.oy + Math.floor(i / this.cols) * this.ch }; },
  update(dt) {
    if (this.msg) { this.msg.t -= dt; if (this.msg.t <= 0) this.msg = null; }
    if (this.endT) { this.endT -= dt; if (this.endT <= 0) this.done = { score: this.score }; return; }

    if (this.wait > 0) { this.wait -= dt; if (this.wait <= 0) { this.sel.forEach(i => this.cards[i].open = false); this.sel = []; SND.sfx('door'); } return; }
    const n = this.cards.length;
    if (Input.hit('left')) this.cur = (this.cur + n - 1) % n;
    if (Input.hit('right')) this.cur = (this.cur + 1) % n;
    if (Input.hit('up')) this.cur = (this.cur - this.cols + n) % n;
    if (Input.hit('down')) this.cur = (this.cur + this.cols) % n;
    let pi = -1;
    if (Input.pointer.clicked) for (let i = 0; i < n; i++) { const c = this.cell(i); if (Input.pointer.x >= c.x && Input.pointer.x < c.x + this.cw - 4 && Input.pointer.y >= c.y && Input.pointer.y < c.y + this.ch - 4) { pi = i; this.cur = i; } }

        if (c.done) { ctx.fillStyle = 'rgba(108,203,143,.35)'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2); }
      } else {
        ctx.fillStyle = '#C99A63'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2); ctx.fillStyle = '#DDB27E'; ctx.fillRect(x + 1, y + 1, w - 2, 2);
        ctx.fillStyle = '#F2E6C4'; ctx.fillRect(x + 6, y + 6, 24, 12); ctx.fillStyle = '#5E6E80'; ctx.fillRect(x + w - 10, y + h / 2 - 3, 4, 8);

    const lk = playerLook(), ch = getChar(lk); ctx.drawImage(big('shoeP' + lookKey(lk), ch.right[0], 3), 40, 90);
  },
  text(tx, k) {
    this.cards.forEach((c, i) => { if (c.open || c.done) return; const { x, y } = this.cell(i); T2(tx, k, String(this.base + i + 1), x + 18, y + 12, { size: 12, col: '#1B1A18', stroke: false }); });

    if (this.endT) T2(tx, k, L({ ko: '신발장 정리 끝!', en: 'All sorted!' }), 296, 252, { size: 15, col: '#FFE27A' });
  }

/* 15. 수건 쌓기 ─────────────────────── */
const TOWEL_COLS = ['#F4F4EE', '#F2B8C2', '#A8E0C8', '#F2D77A', '#A9D3F0'];
MINI.stack = {
  controls: 'tap', grade: s => s.score >= 2400 ? 'S' : s.score >= 1700 ? 'A' : s.score >= 1000 ? 'B' : 'C',
  init() {
    this.th = 9; this.stack = [{ x: 180, w: 120, c: 0 }]; this.speed = 110; this.score = 0; this.perfect = 0; this.combo = 0;
    this.cam = 0; this.endT = 0; this.falling = []; this.t = -.6; this.pops = [];
    this.cur = { x: 60, w: 120, dir: 1, c: 1 };
  },
  topY(i) { return 236 - i * this.th; },
  update(dt) {
    this.pops.forEach(p => p.t -= dt); this.pops = this.pops.filter(p => p.t > 0);
    this.falling.forEach(f => { f.vy += 500 * dt; f.y += f.vy * dt; }); this.falling = this.falling.filter(f => f.y < 400);
    this.cam = lerp(this.cam, Math.max(0, this.stack.length * this.th - 150), Math.min(1, dt * 5));
    if (this.endT) { this.endT -= dt; if (this.endT <= 0) this.done = { score: this.score }; return; }
    this.t += dt; if (this.t < 0) return;
    const c = this.cur;
    c.x += c.dir * this.speed * dt;
    if (c.x + c.w > 430) { c.x = 430 - c.w; c.dir = -1; } if (c.x < 50) { c.x = 50; c.dir = 1; }
    if (!tap()) return;
    const top = this.stack[this.stack.length - 1], y = this.topY(this.stack.length);
    const l = Math.max(c.x, top.x), r = Math.min(c.x + c.w, top.x + top.w), ov = r - l;
    if (ov <= 0) { this.falling.push({ x: c.x, w: c.w, y, vy: 0, c: c.c }); this.endT = 1.2; SND.sfx('fail'); return; }
    let nx, nw;
    if (Math.abs(c.x - top.x) <= 3) { nx = top.x; nw = Math.min(140, top.w + (this.combo >= 2 ? 4 : 0)); this.combo++; this.perfect++; this.score += 150; SND.sfx('perfect'); this.pops.push({ t: .7, s: 'PERFECT' }); }
    else {
      nx = l; nw = ov; this.combo = 0; this.score += 100; SND.sfx('good');
      if (c.x < top.x) this.falling.push({ x: c.x, w: top.x - c.x, y, vy: 0, c: c.c }); else this.falling.push({ x: r, w: c.x + c.w - r, y, vy: 0, c: c.c });
    }
    this.stack.push({ x: nx, w: nw, c: c.c });
    this.speed = Math.min(300, this.speed + 7);
    if (this.stack.length >= 26) { this.endT = 1.4; SND.sfx('win'); return; }
    this.cur = { x: c.dir > 0 ? 430 - nw : 50, w: nw, dir: -c.dir, c: (c.c + 1) % TOWEL_COLS.length };
  },
  towel(ctx, x, y, w, c) {
    const col = TOWEL_COLS[c];
    ctx.fillStyle = OUT; ctx.fillRect(x - 1 | 0, y - 1 | 0, w + 2 | 0, this.th + 1);
    ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, this.th - 1);
    ctx.fillStyle = shade(col, -.12); ctx.fillRect(x | 0, y + this.th - 3 | 0, w | 0, 2);
    if (w > 10) { ctx.fillStyle = shade(col, -.2); ctx.fillRect(x + 3 | 0, y | 0, 2, this.th - 1); ctx.fillRect(x + w - 5 | 0, y | 0, 2, this.th - 1); }
  },
  draw(ctx) {
    tileBG(ctx, '#F7F9FA', '#E3EBF0', 16);
    const cam = this.cam;
    ctx.fillStyle = C.wood; ctx.fillRect(140, 245 + cam, 200, 30); ctx.fillStyle = C.woodL; ctx.fillRect(140, 245 + cam, 200, 4);
    this.stack.forEach((s, i) => { const y = this.topY(i) + cam; if (y > -10 && y < H) this.towel(ctx, s.x, y, s.w, s.c); });
    this.falling.forEach(f => this.towel(ctx, f.x, f.y + cam, f.w, f.c));
    if (!this.endT) this.towel(ctx, this.cur.x, this.topY(this.stack.length) + cam - 14, this.cur.w, this.cur.c);
    // 알바 준호
    const ch = getChar(NPCS.alba.look); ctx.drawImage(big('albaS', ch.left[0], 3), 410, 170);
  },
  text(tx, k) {
    T2(tx, k, this.score + '', W - 16, 20, { align: 'right', size: 24 });
    T2(tx, k, L({ ko: '수건 {n}', en: 'Towels {n}' }, { n: this.stack.length - 1 }), 20, 20, { align: 'left', size: 15 });
    if (this.combo >= 2) T2(tx, k, this.combo + ' COMBO', 20, 42, { align: 'left', size: 12, col: '#FFE27A' });
    this.pops.forEach(p => T2(tx, k, p.s, 240, 90 - (.7 - p.t) * 30, { size: 15, col: '#FFE27A' }));
    if (this.t < 0) T2(tx, k, L({ ko: '눌러서 떨어뜨려요', en: 'Tap to drop' }), 240, 120, { size: 15 });
    if (this.endT) T2(tx, k, this.stack.length >= 26 ? (L({ ko: '수건 산 완성!', en: 'Towel mountain!' })) : (L({ ko: '와르르…', en: 'Whoops...' })), 240, 70, { size: 24, col: '#FFFFFF' });
  }
};

MINI.quiz = {
  controls: 'point', grade: s => s.score >= 1700 ? 'S' : s.score >= 1300 ? 'A' : s.score >= 800 ? 'B' : 'C',
  init() {
    const known = shuffle(PHRASES.filter(p => S.codex.phrase[p.id])), unknown = shuffle(PHRASES.filter(p => !S.codex.phrase[p.id]));
    let pool = known.slice(0, 5).concat(unknown.slice(0, 5));
    if (pool.length < 10) pool = pool.concat(shuffle(PHRASES.filter(p => !pool.includes(p)))).slice(0, 10);
    this.qs = shuffle(pool).map((p, i) => {
      const others = shuffle(PHRASES.filter(x => x.id !== p.id)).slice(0, 3);
      return { p, type: i % 2 ? 'en' : 'ko', opts: shuffle([p, ...others]) };
    });
    this.i = 0; this.score = 0; this.right = 0; this.learned = []; this.cur = 0; this.time = 10; this.state = 'ask'; this.rt = 0;
  },
  rect(i) { return { x: 20 + (i % 2) * 224, y: 126 + Math.floor(i / 2) * 68, w: 216, h: 60 }; },
  update(dt) {
    if (this.state === 'res') { this.rt -= dt; if (this.rt <= 0 && !this.done) { if (this.i + 1 >= this.qs.length) this.done = { score: this.score, learned: this.learned }; else { this.i++; this.state = 'ask'; this.time = 10; this.cur = 0; } } return; }
    this.time -= dt;
    if (Input.hit('left') || Input.hit('right')) this.cur ^= 1;
    if (Input.hit('up') || Input.hit('down')) this.cur ^= 2;
    let pi = -1;
    if (Input.pointer.clicked) for (let i = 0; i < 4; i++) { const r = this.rect(i); if (Input.pointer.x >= r.x && Input.pointer.x < r.x + r.w && Input.pointer.y >= r.y && Input.pointer.y < r.y + r.h) pi = i; }
    if (Input.hit('act') || Input.hit('use')) pi = this.cur;
    for (let i = 0; i < 4; i++) if (Input.hit('e' + (i + 1))) pi = i;
    const q = this.qs[this.i];
    if (pi >= 0) {
      this.cur = pi; this.picked = pi;
      if (q.opts[pi].id === q.p.id) { const pts = 100 + Math.round(Math.max(0, this.time) * 10); this.score += pts; this.pts = pts; this.right++; this.q = 'ok'; SND.sfx('good'); if (!S.codex.phrase[q.p.id] && !this.learned.includes(q.p.id)) this.learned.push(q.p.id); }
      else { this.q = 'bad'; this.pts = 0; SND.sfx('fail'); }
      this.state = 'res'; this.rt = 1.8;
    } else if (this.time <= 0) { this.q = 'late'; this.picked = -1; this.state = 'res'; this.rt = 1.8; SND.sfx('miss'); }
  },
  draw(ctx) {
    tileBG(ctx, '#F7F9FA', '#E3EBF0', 16);
    panel(ctx, 20, 14, 440, 100, '#FFFFFF'); ctx.fillStyle = C.blue; ctx.fillRect(22, 16, 6, 96);
    meter(ctx, 40, 102, 400, 4, this.time / 10, this.time < 3 ? C.red : C.blue);
    const q = this.qs[this.i];
    q.opts.forEach((o, i) => {
      const r = this.rect(i); let col = '#FFFFFF';
      if (this.state === 'res') { if (o.id === q.p.id) col = '#C9EED6'; else if (i === this.picked) col = '#F6D4CC'; }
      panel(ctx, r.x, r.y, r.w, r.h, col);
      if (i === this.cur && !Input.touchMode && this.state === 'ask') { ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); }
      ctx.fillStyle = C.blue; ctx.fillRect(r.x + 6, r.y + 6, 12, 12);
    });
    const ch = getChar(NPCS.mia.look); ctx.drawImage(big('miaQ', ch.down[0], 2), 420, 40);
  },
  text(tx, k) {
    const q = this.qs[this.i], p = q.p;
    T2(tx, k, (this.i + 1) + ' / ' + this.qs.length, 40, 28, { align: 'left', size: 12, col: '#6E6B66', stroke: false });
    T2(tx, k, this.score + '', 408, 28, { align: 'right', size: 15, col: '#1E6E9C', stroke: false });
    if (q.type === 'ko') {
      T2(tx, k, p.ko, 220, 58, { size: 24, col: '#1B1A18', stroke: false, ko: true });
      T2(tx, k, this.state === 'res' ? p.ro : (L({ ko: '무슨 뜻일까요?', en: 'What does it mean?' })), 220, 86, { size: 12, col: '#1E6E9C', stroke: false, max: 370 });
    } else {
      T2(tx, k, T('quote', { s: tr(p.en) }), 220, 56, { size: 15, col: '#1B1A18', stroke: false, max: 370 });
      T2(tx, k, this.state === 'res' ? p.ko + ' · ' + p.ro : (L({ ko: '한국어로 뭐라고 할까요?', en: 'How do you say it in Korean?' })), 220, 84, { size: 12, col: '#1E6E9C', stroke: false, max: 370 });
    }
    q.opts.forEach((o, i) => {
      const r = this.rect(i); T2(tx, k, String(i + 1), r.x + 12, r.y + 12, { size: 12, col: '#FFFFFF', stroke: false });
      if (q.type === 'ko') T2(tx, k, tr(o.en), r.x + r.w / 2 + 6, r.y + r.h / 2, { size: 12, col: '#1B1A18', stroke: false, max: r.w - 30 });
      else { T2(tx, k, o.ko, r.x + r.w / 2 + 6, r.y + r.h / 2 - 7, { size: 15, col: '#1B1A18', stroke: false, ko: true }); T2(tx, k, o.ro, r.x + r.w / 2 + 6, r.y + r.h / 2 + 12, { size: 12, col: '#6E6B66', stroke: false }); }
    });
    if (this.state === 'res') T2(tx, k, this.q === 'ok' ? L({ ko: '정답! +{n}', en: 'Correct! +{n}' }, { n: this.pts }) : this.q === 'late' ? (L({ ko: '시간 초과', en: 'Time\'s up' })) : (L({ ko: '아쉬워요', en: 'Not quite' })), 240, 118, { size: 12, col: this.q === 'ok' ? '#1F9D57' : '#C13A2A', stroke: false });
  }
};

/* ── 미니게임 공용 파티클 ── */
function spawnMGPart(g, x, y, vx, vy, col) { (g.parts = g.parts || []).push({ x, y, vx, vy, col, t: rnd(.4, .8) }); if (g.parts.length > 200) g.parts.shift(); }
function updateMGParts(g, dt) { if (!g.parts) return; g.parts.forEach(p => { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; }); g.parts = g.parts.filter(p => p.t > 0); }
function drawMGParts(g, ctx) { if (!g.parts) return; g.parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x | 0, p.y | 0, 2, 2); }); ctx.globalAlpha = 1; }

/* ═══════════ 미니게임 진행 관리 ═══════════ */
// 처음 해보면 열리는 명장면, 함께 기록되는 목욕 문화
const MG_SCENE = { scrub: 'sc_seshin', dryer: 'sc_dryer', sleep: 'sc_sleeproom', towel: 'sc_lambtowel', egg: 'sc_eggcrack', back: 'sc_backscrub' };
const MG_ACT = { scrub: 'seshin', milk: 'banana', dryer: 'dryer', shoes: 'shoes', sleep: 'sleep' };
const MG_XP = { S: 60, A: 45, B: 30, C: 20 }, MG_SWEAT = { S: 40, A: 28, B: 18, C: 10 };
const MG = {
  cur: null,
  start(id, opts = {}) {
    if (!MINI[id]) return;
    const g = Object.create(MINI[id]); g.id = id; g.parts = [];
    this.cur = { id, g, opts, state: 'intro' };
    World.paused = true; World.path = null;
    UI.mgIntro(id, opts);
  },
  begin() {
    const c = this.cur; if (!c || c.state !== 'intro') return;
    c.g.init(); c.state = 'play'; Input.clear();
    if (c.id === 'scrub' || c.id === 'sleep') SND.stop(); else SND.play('mg');
    UI.mgPlay(c.id);
  },
  update(dt) {
    const c = this.cur; if (!c || c.state !== 'play') return;
    c.g.update(Math.min(dt, .05));
    if (c.g.done) this.finish(c.g.done);
  },
  finish(res) {
    const c = this.cur; c.state = 'result'; SND.pour(false);
    const id = c.id, meta = MG_META[id], grade = c.g.grade(res);
    const first = !S.mgPlayed[id];
    const rec = recordScore(id, res.score);
    const prev = S.mgBestGrade[id];
    if (!prev || GRADE_RANK[grade] > GRADE_RANK[prev]) S.mgBestGrade[id] = grade;
    let sweat = MG_SWEAT[grade], xp = MG_XP[grade] + (first ? 40 : 0);
    if (buffOn('focus')) { sweat = Math.round(sweat * 1.1); xp = Math.round(xp * 1.1); }
    addSweat(sweat);
    const gx = gainXP(xp, true);
    codexAdd('phrase', meta.phrase);
    (res.learned || []).forEach(p => codexAdd('phrase', p));
    stat('mgPlays'); stat('mg_' + id); if (grade === 'S') stat('mgS'); if (grade === 'S' || grade === 'A') stat('mgA'); stat('mgKinds', 0);
    if (MG_ACT[id]) Prog.act(MG_ACT[id]);
    checkMgAch(id, res.score, grade);
    Prog.event('mg', { id, grade, score: res.score });
    Net.submitScore(id, res.score);
    Net.submitScore('level', S.lv); Net.submitScore('stamps', stampCount()); Net.submitScore('codex', codexTotals().pct);
    c.result = { score: res.score, grade, sweat, xp: gx, newBest: rec.newBest, first, up: !prev || GRADE_RANK[grade] > GRADE_RANK[prev], learned: res.learned || [] };
    if (MG_SCENE[id] && !S.scenes[MG_SCENE[id]]) c.scene = MG_SCENE[id];
    save();
    UI.mgResult(id, c.result, c.opts);
    if (World.st) SND.play(World.st.music);
  },
  close() {
    const sc = this.cur && this.cur.scene;
    this.cur = null; World.paused = false; Input.clear(); UI.mgClose();
    if (sc) setTimeout(() => Prog.scene(sc), 150);
  },
  render(ctx) { const c = this.cur; if (!c || c.state === 'intro' || !c.g.draw) return false; try { c.g.draw(ctx); } catch (e) { console.error(e); return false; } return true; },
  renderText(tx, k) { const c = this.cur; if (!c || c.state !== 'play' || !c.g.text) return; c.g.text(tx, k); }
};
function fmtScore(id, v) { return MG_META[id] && MG_META[id].unit === 's' ? (v / 10).toFixed(1) + 's' : String(v); }

  sceneReveal(id, first) {

  viewScene(id, first, back) {
    if (MG.cur) return;
    if (this.dlg) this.closeDialog();
    const rec = S.scenes[id]; if (!rec) return;
    const meta = SCENES[id];
    const then = unpackLook(rec.l), now = playerLook();
    const same = lookKey(then) === lookKey(Object.assign(unpackLook(packLook(now))));
    let look = first ? now : then, useNow = !!first;
    this.panel = 'scene'; World.paused = true; World.path = null; Input.clear();
    if (first) { S.flags.newScene = 1; save(); SND.sfx('unlock'); }
    const head = first ? `<span class="badge gold">${T('scene_new')}</span> ` : '';
    this.sheetEl.innerHTML = this.card(L(meta.n), `<div class="scbox"><canvas id="scCv" width="1024" height="576"></canvas></div>
      <div class="row sccap">${head}<b class="nb">${esc(meta.n.ko)}</b><span class="muted">${esc(LANG === 'ko' ? meta.n.en : L(meta.n))} · ${rec.d}</span></div>
      <p class="muted" style="margin:4px 0 8px">${esc(L(meta.how))}</p>
      <div class="row">${same ? '' : `<button class="btn" id="scLook">${useNow ? T('scene_then') : T('scene_now')}</button>`}<button class="btn pri" id="scSave">${T('scene_save')}</button>${back ? `<button class="btn" id="scBack">${T('back')}</button>` : `<button class="btn" id="scAlbum">${T('album')}</button>`}</div>`, { cls: 'wide', icon: 'album' });
    this.sheetEl.hidden = false; this.sheetEl.onclick = null;
    $$('#sheet [data-close]').forEach(b => b.addEventListener('click', () => { SND.sfx('close'); this.closePanel(); }));
    const cv = $('#scCv'), x = cv.getContext('2d');
    const t0 = performance.now();
    const draw = () => {
      if (!$('#scCv')) return clearInterval(this._anim);
      const t = (performance.now() - t0) / 1000;
      const sc = renderScene(id, look, t);
      x.imageSmoothingEnabled = false; x.drawImage(sc, 0, 0, 1024, 576);
      const k = Math.min(1, t * 2);
      if (first && t < .6) { x.fillStyle = `rgba(255,255,255,${1 - t / .6})`; x.fillRect(0, 0, 1024, 576); }
      x.globalAlpha = k; sc.bubbles.forEach(b => drawBubbleAt(x, b.x * 4, b.y * 4, b.ko, b.en, 1.7)); x.globalAlpha = 1;

      <div class="row" id="bAfter" hidden style="margin-top:8px"><button class="btn pri" id="bSave">${T('photo_save')}</button><span class="muted">${T('booth_saved')}</span></div>

  a_booth() {
    const cv = $('#bCv'), x = cv.getContext('2d');
    const preview = () => { const s = boothStrip(this._bb, this._bf, null, this._bfr !== false); x.clearRect(0, 0, 200, 520); x.drawImage(s, 0, 0, 200, 520); };
    preview();

    $('#bFriend').addEventListener('change', e => { this._bfr = e.target.checked; preview(); });
    $('#bShoot').addEventListener('click', () => {
      const btn = $('#bShoot'); btn.disabled = true; this.panelLock = true;
      const poses = shuffle(['wave', 'thumb', 'heart', 'lamb', 'cheers', 'lol', 'egg', 'bow']).slice(0, 4);
      const friend = randomLook(); const shots = [];
      let i = 0;
      const shoot = () => {
        let n = 3;
        const cd = setInterval(() => {
          if (!$('#bShoot')) return clearInterval(cd);
          btn.textContent = n > 0 ? n + '…' : T('booth_flash'); SND.sfx(n > 0 ? 'tick' : 'shutter');

            clearInterval(cd); shots.push({ pose: poses[i], friend });

        this.panelLock = false; btn.disabled = false; btn.textContent = T('mg_retry');
        const big2 = boothStrip(this._bb, this._bf, shots, this._bfr !== false, friend, 2);
        addPhoto(big2, L(World.st.name) + ' · ' + T('booth_title'));

        Prog.scene('sc_fourcut');
      };
      shoot();
    });
  },

async function saveCanvas(c, fname, type = 'image/png') {
  const cl = window.claude;

    let dl = null; try { dl = await cl.use('downloads'); } catch (e) { }
    if (!dl) { UI.toast(T('photo_hint')); return; }
    c.toBlob(b => { dl.save({ filename: fname, data: b }).then(() => UI.toast(T('photo_saved'), 'good')).catch(e => { if (!e || e.code !== 'declined') UI.toast(T('photo_hint')); }); }, type, .92);
    return;
  }
  try {
    const url = c.toDataURL(type, .92); const a = document.createElement('a'); a.href = url; a.setAttribute('download', fname);
    document.body.appendChild(a); a.click(); a.remove(); UI.toast(T('photo_saved'), 'good');
  } catch (e) { UI.toast(T('photo_hint')); }
}

  const rows = names.map(n => ({ name: n, npc: true, score: Math.max(1, Math.round(RANK_REF[board] * (.3 + R() * .75))) }));

}

function scenePostcard(id, look, t = 0) {
  const sc = renderScene(id, look, t), k = 4, PAD = 24, CAP = 120;
  const [c, x] = mkCanvas(SW * k + PAD * 2, SH * k + PAD * 2 + CAP);
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = OUT; x.fillRect(PAD - 4, PAD - 4, SW * k + 8, SH * k + 8);
  x.imageSmoothingEnabled = false; x.drawImage(sc, PAD, PAD, SW * k, SH * k);
  sc.bubbles.forEach(b => drawBubbleAt(x, PAD + b.x * k, PAD + b.y * k, b.ko, b.en, 1.6));
  const meta = SCENES[id];
  x.fillStyle = C.ink; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  x.font = fpx(36); x.fillText(meta.n.ko + '  ·  ' + (LANG === 'ko' ? meta.n.en : L(meta.n)), PAD, SH * k + PAD * 2 + 44);
  x.font = fpx(24); x.fillStyle = '#6E6B66';
  const rec = S.scenes[id]; x.fillText('HANTANG Online · ' + S.name + ' · ' + (rec ? rec.d : dayKey()), PAD, SH * k + PAD * 2 + 86);
  x.fillStyle = C.red; x.fillRect(c.width - PAD - 72, SH * k + PAD * 2 + 18, 72, 72);
  x.fillStyle = '#FFFFFF'; x.font = '30px Galmuri14, Galmuri11, sans-serif'; x.textAlign = 'center'; x.fillText('韓', c.width - PAD - 36, SH * k + PAD * 2 + 50); x.fillText('湯', c.width - PAD - 36, SH * k + PAD * 2 + 82);
  return c;
}
function drawBubbleAt(x, cx, cy, ko, en, k = 1) {
  en = tr(en);
  x.save(); x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = fko(Math.round(15 * k)); const w1 = x.measureText(ko).width;
  x.font = fpx(Math.round(12 * k)); const w2 = x.measureText(en).width;
  const w = Math.max(w1, w2) + 20 * k, h = 38 * k, bx = cx - w / 2, by = cy - h / 2;
  x.fillStyle = OUT; x.fillRect(bx - 2 * k, by - 2 * k, w + 4 * k, h + 4 * k);
  x.fillStyle = '#FFFFFF'; x.fillRect(bx, by, w, h);
  x.fillStyle = C.ink; x.font = fko(Math.round(15 * k)); x.fillText(ko, cx, by + 17 * k);
  x.fillStyle = C.blue; x.font = fpx(Math.round(12 * k)); x.fillText(en, cx, by + 31 * k);
  x.restore();
}

function resize() {
  const app = $('#app'), cs = getComputedStyle(app);
  const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const portrait = Input.touchMode && ah > aw * 1.1;
  document.documentElement.classList.toggle('portrait', portrait);
  let s = portrait ? aw / W : Math.min(aw / W, (ah - 10) / H);
  if (s >= 3) s = Math.floor(s);
  s = Math.max(.5, s);
  const w = Math.floor(W * s), h = Math.floor(H * s), dpr = Math.min(3, window.devicePixelRatio || 1);
  const st = $('#stage'); st.style.width = w + 'px'; st.style.height = h + 'px';
  txc.width = Math.round(w * dpr); txc.height = Math.round(h * dpr);
  VIEW = { s, w, h, dpr };
}

    const sp = 14 * dt; b.x += b.dir === 'right' ? sp : -sp;
    if (b.x > 228) b.dir = 'left'; if (b.x < 12) b.dir = 'right';
    if (b.et <= 0) { b.et = rnd(3, 7); b.emote = { id: pick(EMOTES).id, t: 2 }; }
    if (b.emote) { b.emote.t -= dt; if (b.emote.t <= 0) b.emote = null; }
    const f = getChar(b.look); x.drawImage(FX.shadow, b.x - 7 | 0, b.y - 3); x.drawImage(f[b.dir][Math.floor(b.t * 8) % 4], b.x - CHAR_AX | 0, b.y - CHAR_AY);
  });
  TITLE.bots.forEach(b => { if (b.emote) { const ic = ICON[EMOTE[b.emote.id].icon]; x.fillStyle = '#FFFFFF'; x.fillRect(b.x - 7 | 0, 0, ic.width + 4, ic.height + 2); x.drawImage(ic, b.x - 5 | 0, 1); } });
}

/* ── 게임 시작 ── */
function startGame(isNew) {
  LANG = S.lang || LANG; document.documentElement.lang = LANG;
  SND.setMusic(S.settings.music); SND.setSfx(S.settings.sfx);
  $('#title').hidden = true; $('#hud').hidden = false; GAME = 'play';
  setLang(LANG);
  Prog.init();
  const st = stageUnlocked(S.stage) ? S.stage : 'bath1';
  loadStage(st); stat('visit_' + st);
  UI.hud(); UI.tracker();
  setTimeout(() => {
    const daily = checkDaily();
    if (!isNew && !daily) UI.toast(T('welcome_back', { name: S.name }));
    if (isNew) setTimeout(() => { if (!UI.busy()) UI.talkNpc('imo'); }, 500);
  }, 900);
  if (!Net._inited) { Net._inited = true; Net.init(); }
  resize();
}

/* ── 메인 루프 ── */
let lastT = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  try {
    if (GAME === 'title') { drawTitleScene(dt); }
    else {
      const busy = UI.busy();
      if (!busy) {
        if (Input.hit('map')) UI.openPanel('map');
        else if (Input.hit('bag')) UI.openPanel('bag');
        else if (Input.hit('costume')) UI.openPanel('costume');
        else if (Input.hit('chat')) UI.openPanel('chat');
        else if (Input.hit('missions')) UI.openPanel('missions');
        else if (Input.hit('album')) UI.openPanel('album');
        else if (Input.hit('card')) UI.openPanel('card');
        else if (Input.hit('photo')) UI.photo();
        else if (Input.hit('menu')) UI.openPanel('menu');
        else if (Input.pointer.clicked) tapWorld(Input.pointer.x, Input.pointer.y);
      } else if (UI.dlg && (Input.pressed.act || Input.pressed.use)) UI.dialogNext();
      else if (MG.cur && MG.cur.state === 'intro' && (Input.pressed.act) && document.activeElement !== $('#mgGo')) MG.begin();
      MG.update(dt);
      updateWorld(dt);
      // 렌더
      if (!MG.render(ctx)) renderWorld(ctx);
      tctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0); tctx.clearRect(0, 0, VIEW.w, VIEW.h);
      if (MG.cur && MG.cur.state === 'play') MG.renderText(tctx, VIEW.s); else if (!MG.cur) renderTextLayer(tctx, VIEW.s);
      const it = !busy && World.busyT <= 0 ? World.interact : null; if (it !== frame._it) { frame._it = it; UI.useLabel(it); }
      hudT -= dt; if (hudT <= 0) { hudT = .12; UI.heat(World.heat); UI.hudFade(); }
      UI.pump();
    }
  } catch (e) { console.error(e); }
  Input.endFrame();
  requestAnimationFrame(frame);
}

/* ── 부팅 ── */
// 주소의 ?lang= 값을 게임 언어 id 로 (ja, zh-Hant, zh-tw … 모두 받는다)
function langFromParam(v) {
  if (!v) return null;
  const l = String(v).toLowerCase();
  return LANG_IDS.find(id => id.toLowerCase() === l) || { 'zh-tw': 'zh-Hant', 'zh-hk': 'zh-Hant', 'zh-mo': 'zh-Hant', zh: 'zh-Hans', 'zh-cn': 'zh-Hans', 'zh-sg': 'zh-Hans' }[l] || null;
}
async function boot() {
  // 언어: 주소의 ?lang= (홈페이지 언어별 링크) > 저장된 게임 > 마지막 선택 > 브라우저 언어
  let fromURL = null; try { fromURL = langFromParam(new URLSearchParams(location.search).get('lang')); } catch (e) { }
  buildFX(); buildIcons(); buildTileCaches();
  Input.init(cv); UI.init();
  S = loadSave();
  const want = fromURL || (S && S.lang) || langFromParam(Store.get('hantang_lang', null)) || langFromBrowser();
  LANG = want; document.documentElement.lang = want;
  try { await Promise.race([Promise.all([document.fonts.load('12px Galmuri11'), document.fonts.load('15px Galmuri14')]), new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
  resize(); window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  await setLang(want);
  showTitle();
  requestAnimationFrame(frame);
  window.addEventListener('beforeunload', () => save(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
}

// 테스트용 핸들
Object.defineProperty(HT, 'S', { get: () => S });
Object.assign(HT, { World, MG, UI, Net, loadStage, startGame, travel, MINI, Input, SND, Prog, gainXP, achUnlock, tapWorld, eatFood, MISSION, renderScene });
boot();

</script>
